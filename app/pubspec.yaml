name: bomesh
description: BoMesh mobile knowledge and BI assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  file_picker: ^12.1.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/bomesh-logo.png
