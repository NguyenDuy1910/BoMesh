name: bomesh
description: BoMesh mobile knowledge and BI assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  file_picker: ^12.1.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/bomesh-logo.png
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
