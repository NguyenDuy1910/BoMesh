.ds-type>div span:first-child{width:150px;flex:none;font-size:12.5px;color:var(--text-3)}
@container app (max-width:900px){.rv-ia,.rv-dec{grid-template-columns:1fr}}
</style>
<script>
'use strict';
/* ═══════════════════════════ Auth ═══════════════════════════ */
function authArt() {
  return `<aside class="auth-art auth-mesh" aria-label="BoMesh knowledge network">
  <div class="brand-mark mesh-brand"><span class="brand-glyph">${ic('layers', 'i-sm')}</span>BoMesh</div>
  <div class="km-copy"><div class="km-eyebrow">One trusted knowledge layer</div>
    <h1 class="au-h1">Your company’s knowledge, <em>alive and connected.</em></h1>
    <p class="km-subtitle">BoMesh links every approved source into a living knowledge mesh—so every answer arrives with context, lineage, and evidence.</p>
    <div class="km-stage" role="img" aria-label="Product, customer, security, and engineering knowledge connected into one grounded answer">
      <svg class="km-links" viewBox="0 0 540 300" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="meshLine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset=".52" stop-color="#818CF8"/><stop offset="1" stop-color="#67E8F9"/></linearGradient></defs>
        <path class="km-link is-bright" d="M98 70 C180 62 188 128 270 156"/><path class="km-link" d="M444 64 C356 70 350 119 270 156"/><path class="km-link" d="M104 238 C174 224 196 186 270 156"/><path class="km-link is-bright" d="M438 232 C358 222 344 180 270 156"/>
        <path class="km-link" d="M98 70 C188 8 352 8 444 64"/><path class="km-link" d="M104 238 C206 286 342 280 438 232"/>
        <circle class="km-link-dot" cx="168" cy="87" r="2.4"/><circle class="km-link-dot" cx="370" cy="88" r="2.4"/><circle class="km-link-dot" cx="365" cy="209" r="2.4"/>
      </svg>
      <div class="km-node n1">${ic('file-text')}<span><b>Product knowledge</b><small>Roadmaps &amp; specifications</small></span></div>
      <div class="km-node n2">${ic('users')}<span><b>Customer context</b><small>Research &amp; insights</small></span></div>
      <div class="km-node n3">${ic('shield')}<span><b>Security policies</b><small>Controls &amp; guidance</small></span></div>
      <div class="km-node n4">${ic('book')}<span><b>Engineering memory</b><small>Decisions &amp; runbooks</small></span></div>
      <div class="km-core"><span class="km-core-icon">${ic('sparkles')}</span><b>Grounded answer</b><span>Connected across trusted sources</span><span class="km-core-proof">${ic('link')}Evidence attached</span></div>
    </div>
    <div class="km-proof">${ic('shield')}<span><b>Permission-aware by design.</b> People only discover knowledge they can access.</span></div>
  </div>
  <div class="km-foot"><span>${ic('lock')}Private to your workspace</span><span>${ic('route')}Every answer stays traceable</span></div></aside>`;
}
P.signin = () => {
  const f = ui('signin', { email: '', password: '', show: false, errors: {}, busy: '' });
  if (!f.email) f.email = me().email;
  const e = f.errors;
  return `<div class="auth-wrap">${authArt()}<main class="auth-form"><form class="auth-card" data-act="noop" novalidate>
    <h1 class="au-title">Sign in</h1><p class="muted" style="margin:6px 0 24px">Use your work account.</p>
    ${btn('Continue with Google', { size: 'lg', cls: 'btn-block', act: 'au-google', loading: f.busy === 'google', disabled: f.busy === 'pw', aria: '' }).replace('<span>', `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.3 14.6 2.3 12 2.3 6.6 2.3 2.3 6.6 2.3 12s4.3 9.7 9.7 9.7c5.6 0 9.3-3.9 9.3-9.5 0-.6-.1-1.1-.2-1.6H12z"/></svg><span>`)}
    <div class="or">or</div>
    ${field({ id: 'au-email', label: 'Work email', error: e.email, control: input({ id: 'au-email', bind: 'signin.email', value: f.email, type: 'email', placeholder: 'name@company.com', blur: 'au-validate', onEnter: 'au-submit', attrs: e.email ? 'aria-invalid="true" aria-describedby="au-email-err"' : '' }) })}
    ${field({ id: 'au-pw', label: 'Password', error: e.password, control: `<div class="input-wrap">${input({ id: 'au-pw', bind: 'signin.password', value: f.password, type: f.show ? 'text' : 'password', onEnter: 'au-submit', attrs: (e.password ? 'aria-invalid="true" aria-describedby="au-pw-err" ' : '') + 'style="padding-left:12px;padding-right:40px"' })}<button type="button" class="btn btn-ghost btn-sm btn-icon clear" data-act="au-show" aria-label="${f.show ? 'Hide' : 'Show'} password" style="--h:28px">${ic(f.show ? 'eye' : 'eye')}</button></div>` })}
    ${e.form ? `<div style="margin:-4px 0 16px">${callout('err', '', esc(e.form))}</div>` : ''}
    ${btn('Sign in', { v: 'primary', size: 'lg', cls: 'btn-block', act: 'au-submit', loading: f.busy === 'pw', disabled: f.busy === 'google' })}
    <p class="faint" style="font-size:13px;margin-top:16px;text-align:center">New to BoMesh? <a href="#/signup">Create an account</a></p>
    <p class="faint" style="font-size:12.5px;margin-top:28px;text-align:center">Trouble signing in? Contact your IT admin.</p>
  </form></main></div>`;
};
A.noop = () => { };
A['au-show'] = () => { ui('signin').show = !ui('signin').show; refresh(); };
function auValidate(f, all) {
  const e = {}; const em = f.email.trim();
  if (!em) e.email = 'Enter your work email.'; else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) e.email = 'Enter an email like name@company.com.';
  if (all && !f.password) e.password = 'Enter your password.';
  return e;
}
A['au-validate'] = () => { const f = ui('signin'); if (!f.email) return; const e = auValidate(f, false); if (e.email !== f.errors.email) { f.errors = { ...f.errors, email: e.email }; refresh(); } };
async function auEnter() { S.signedIn = true; ui('signin').busy = ''; ui('signin').password = ''; const multi = S.persona !== 'member'; go(multi ? '/workspaces' : '/chat'); if (!multi) toast(`Signed in to ${curWs().name}`, { tone: 'info' }); }
A['au-submit'] = async () => {
  const f = ui('signin'); f.errors = auValidate(f, true); refresh();
  if (f.errors.email) return $('#au-email')?.focus(); if (f.errors.password) return $('#au-pw')?.focus();
  f.busy = 'pw'; refresh(); await sleep(900);
  if (f.password === 'wrong' || S.pageState === 'error') { f.busy = ''; f.errors = { form: 'That email and password don’t match. Check them and try again.' }; f.password = ''; refresh(); $('#au-pw')?.focus(); return; }
  auEnter();
};
A['au-google'] = async () => { const f = ui('signin'); f.busy = 'google'; f.errors = {}; refresh(); await sleep(1200); auEnter(); };

P.signup = () => {
  const f = ui('signup', { name: '', email: '', password: '', errors: {}, busy: false });
  const pw = f.password; const rules = [[pw.length >= 8, 'At least 8 characters'], [/[A-Za-z]/.test(pw) && /\d/.test(pw), 'Letters and numbers']];
  return `<div class="auth-wrap">${authArt()}<main class="auth-form"><div class="auth-card">
    <h1 class="au-title">Create your account</h1><p class="muted" style="margin:6px 0 24px">Your workspace admin adds you to a workspace after this.</p>
    ${field({ id: 'su-name', label: 'Full name', error: f.errors.name, control: input({ id: 'su-name', bind: 'signup.name', value: f.name, placeholder: 'Kevin Ng', autofocus: true }) })}
    ${field({ id: 'su-email', label: 'Work email', error: f.errors.email, control: input({ id: 'su-email', bind: 'signup.email', value: f.email, type: 'email', placeholder: 'name@company.com' }) })}
    ${field({ id: 'su-pw', label: 'Password', error: f.errors.password, control: input({ id: 'su-pw', bind: 'signup.password', value: f.password, type: 'password', attrs: 'data-live', onEnter: 'su-submit' }) + `<div class="au-pw-rules" aria-live="polite">${rules.map(([ok, l]) => `<span class="${ok ? 'ok' : ''}">${ic(ok ? 'check-circle' : 'info', 'i-xs')}${l}</span>`).join('')}</div>` })}
    ${btn('Create account', { v: 'primary', size: 'lg', cls: 'btn-block', act: 'su-submit', loading: f.busy })}
    <p class="faint" style="font-size:13px;margin-top:16px;text-align:center">Already have an account? <a href="#/signin">Sign in</a></p>
  </div></main></div>`;
};
A['su-submit'] = async () => {
  const f = ui('signup'); const e = {};
  if (!f.name.trim()) e.name = 'Enter your name.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) e.email = 'Enter an email like name@company.com.';
  else if (D.members.some(m => m.email === f.email.trim().toLowerCase())) e.email = 'An account already uses this email. Sign in instead.';
  if (f.password.length < 8 || !/\d/.test(f.password) || !/[A-Za-z]/.test(f.password)) e.password = 'Use at least 8 characters with letters and numbers.';
  f.errors = e; refresh(); if (Object.keys(e).length) { $('#' + (e.name ? 'su-name' : e.email ? 'su-email' : 'su-pw'))?.focus(); return; }
  f.busy = true; refresh(); await sleep(1000); f.busy = false; ui('wsPick').fresh = true; ui('wsPick').checks = 0; go('/workspaces'); toast('Account created');
};
P.workspaces = () => {
  const w = ui('wsPick', { fresh: false, checks: 0, busy: false });
  const email = w.fresh ? (ui('signup').email || 'you@company.com') : me().email;
  const list = w.fresh ? [] : (S.persona === 'member' ? D.workspaces.slice(0, 1) : D.workspaces);
  const body = list.length ? `<h1 class="au-title">Choose a workspace</h1><p class="muted" style="margin:6px 0 20px">You can switch any time from the sidebar.</p>${list.map(ws => `<button class="ws-pick" data-act="ws-enter" data-id="${ws.id}">${wsMark(ws, 40)}<span class="grow"><span style="font-weight:600;display:block">${esc(ws.name)}</span><span class="faint" style="font-size:13px">${esc(ws.id === 'ws-northwind' ? me().role : 'Member')} · ${plural(ws.members, 'member')}</span></span>${ic('chevron-right', 'faint')}</button>`).join('')}`
    : empty({ icon: 'building', title: 'You’re not in a workspace yet', body: `Ask your workspace admin to add <b>${esc(email)}</b>. It appears here as soon as they do.`, actions: btn('Check again', { v: 'primary', act: 'ws-check', loading: w.busy, icon: 'refresh' }) + btn('Sign out', { href: '/signin' }) });
  return `<main class="auth-form" style="min-height:100%;background:var(--canvas)"><div class="auth-card" style="max-width:460px"><div class="brand-mark" style="margin-bottom:28px"><span class="brand-glyph" style="color:#fff">${ic('layers', 'i-sm')}</span>BoMesh</div>${body}<p class="faint" style="font-size:12.5px;margin-top:24px">Signed in as ${esc(email)} · <a href="#/signin">Sign out</a></p></div></main>`;
};
A['ws-enter'] = el => { S.ws = el.dataset.id; ui('wsPick').fresh = false; go('/chat'); toast(`Signed in to ${curWs().name}`, { tone: 'info' }); };
A['ws-check'] = async () => { const w = ui('wsPick'); w.busy = true; refresh(); await sleep(900); w.busy = false; w.checks++; if (w.checks >= 2) { w.fresh = false; S.persona = 'member'; toast('You were added to Northwind Group'); } else toast('No workspaces yet. Your admin hasn’t added you.', { tone: 'info' }); refresh(); };

/* ═══════════════════════════ Review index ═══════════════════════════ */
P.review = () => {
  const roleTag = r => badge(r === 'member' ? 'neu' : r === 'admin' ? 'accent' : 'outline', PERSONA_LABEL[r], { dot: false });
  return `<div class="page" style="max-width:1120px">
  <div class="rv-hero"><div><div class="brand-mark"><span class="brand-glyph" style="color:#fff">${ic('layers', 'i-sm')}</span>BoMesh · UX/UI review</div>
    <h1 style="margin-top:20px">One product for asking, governing and running company knowledge.</h1>
    <p>A clickable prototype of the full web experience for members, workspace admins and platform operators. Use the bar at the bottom to switch role, force loading, empty and error states, or view at tablet width.</p></div>
    <div class="btn-group wrap">${btn('Start at sign-in', { v: 'primary', size: 'lg', act: 'rv-start', data: { p: 'member', to: '/signin' }, iconRight: 'arrow-right' })}${btn('Open as admin', { size: 'lg', act: 'rv-start', data: { p: 'admin', to: '/overview' } })}</div></div>

  <div class="section-head"><h2 class="section-title">End-to-end journeys</h2><span class="faint" style="font-size:13px">Each starts where the user would</span></div>
  <div class="grid g2">${JOURNEYS.map(j => `<div class="card rv-j"><div class="grow"><div class="row gap-8 wrap"><span class="t">${esc(j.title)}</span>${roleTag(j.who)}</div><div class="d">${esc(j.desc)}</div></div>${btn('Start', { size: 'sm', act: 'rv-journey', data: { id: j.id }, iconRight: 'arrow-right' })}</div>`).join('')}</div>

  <div class="section-head" style="margin-top:40px"><h2 class="section-title">Information architecture</h2></div>
  <div class="rv-ia">
    <div class="card card-pad"><div class="row between" style="margin-bottom:10px"><b>Before</b>${badge('neu', 'Three rails', { dot: false })}</div><div class="ia-tree">
      <div class="lvl1">Workspace</div><div class="lvl2">New chat · Search (document finder) · Library (personal files)</div>
      <div class="lvl1">Workspace control <span class="faint" style="font-weight:400">— separate rail, behind the account menu</span></div><div class="lvl2">Overview · Knowledge · Ingestion (Sources, Runs, Schedules)</div><div class="lvl2">Access · Activity · Settings</div><div class="lvl2 gone">Agent · Experience (placeholders)</div>
      <div class="lvl1">Platform control <span class="faint" style="font-weight:400">— third rail</span></div><div class="lvl2">Tenants · Users · Connectors · Audit · System</div><div class="lvl2 gone">Models &amp; capabilities · Usage (placeholders)</div></div></div>
    <div class="card card-pad" style="border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)"><div class="row between" style="margin-bottom:10px"><b>After</b>${badge('accent', 'One sidebar', { dot: false })}</div><div class="ia-tree">
      <div class="lvl1">Everyone</div><div class="lvl2">New chat · Search ⌘K (chats, knowledge, documents, people, pages)</div><div class="lvl2">Knowledge (My files + shared knowledge bases) · Recent chats</div>
      <div class="lvl1">Manage <span class="faint" style="font-weight:400">— same sidebar, shown by permission</span></div><div class="lvl2">Overview · Sources (Sources, Sync history, Accounts)</div><div class="lvl2">People &amp; access (Members, Groups, Roles, Requests)</div><div class="lvl2">Assistant setup (Behavior, Home screen) · Activity · Settings</div>
      <div class="lvl1">Platform console <span class="faint" style="font-weight:400">— operators, from the workspace menu</span></div><div class="lvl2">Workspaces · Users · Connectors · AI capabilities · Usage · Audit log · System health</div></div></div>
  </div>

  <div class="section-head" style="margin-top:40px"><h2 class="section-title">Key decisions</h2>${btn('Design system', { size: 'sm', href: '/design', icon: 'palette' })}</div>
  <div class="rv-dec">${[
    ['One shell, one sidebar', 'Admin sections appear in the sidebar by permission, instead of a separate rail reached through the account menu.'],
    ['Library and Knowledge merged', 'My files is a private knowledge base. One document table and one viewer serve every place documents appear.'],
    ['Fix problems where they appear', 'Failed documents retry inside their knowledge base. A failed sync is fixed from its row, the overview, or the sidebar badge.'],
    ['Evidence is the signature', 'Amber means cited evidence and nothing else: citation chips in answers and highlighted passages in documents.'],
    ['No dead ends', 'Placeholder pages became real, scoped pages: Agent + Experience → Assistant setup; Models → AI capabilities; Usage got data.'],
    ['Plain language', 'Tenant → workspace, ingestion run → sync, permission codes → sentences. Technical detail only where operators need it.'],
    ['One search', '⌘K searches chats, knowledge bases, documents, people and pages, and can hand the query to the assistant.'],
    ['Honest flows', 'Adding a member requires an existing account, as the backend does — the UI says so instead of faking invite emails.'],
  ].map(([t, d]) => `<div class="card"><b>${t}</b><p>${d}</p></div>`).join('')}</div>
  <div style="height:24px"></div></div>`;
};
A['rv-start'] = el => { setPersona(el.dataset.p); go(el.dataset.to); };
A['rv-journey'] = el => JOURNEYS.find(j => j.id === el.dataset.id)?.start();

/* ═══════════════════════════ Design system ═══════════════════════════ */
P.design = () => {
  const sw = (name, varName, note = '') => `<div class="swatch"><div style="background:var(${varName})"></div><div><b style="font-weight:500">${name}</b><div class="faint mono" style="font-size:11.5px">${varName}${note ? ' · ' + note : ''}</div></div></div>`;
  const row = (label, html) => `<div class="ds-row"><div class="ds-label">${label}</div>${html}</div>`;
  const d = ui('ds', { sw: true, seg: 'week', check: true, radio: 'a', name: '' });
  return `<div class="page" style="max-width:1120px">${pageHead({ title: 'Design system', sub: 'Tokens and components used by every screen in the prototype.', crumbs: [{ label: 'UX review', to: '/review' }], actions: btn(S.theme === 'dark' ? 'Light theme' : 'Dark theme', { icon: S.theme === 'dark' ? 'sun' : 'moon', act: 'pref-theme', data: { value: S.theme === 'dark' ? 'light' : 'dark' } }) })}
  <section class="ds-sec"><h2>Color</h2><p>Surfaces stack canvas → sheet → raised. One primary for actions and selection. Amber is reserved for evidence.</p>

    <div class="grid g2" style="gap:16px"><div><div class="docv-k">Updated</div><div class="docv-v" title="${esc(fmtDateTime(doc.updated))}">${rel(doc.updated)}</div></div><div><div class="docv-k">Size</div><div class="docv-v">${fmtSize(doc.size)}</div></div><div><div class="docv-k">Pages</div><div class="docv-v">${fmtNum(doc.pages)}</div></div><div><div class="docv-k">Type</div><div class="docv-v">${esc(doc.type.toUpperCase())}</div></div></div>
    <div class="divider" style="margin:0"></div>
    <div><div class="docv-k">Who can see this</div><div class="docv-v">${ic(who.icon, 'i-sm')}<span>${esc(who.label)}</span></div>${who.detail ? `<div class="docv-who">${esc(who.detail)}</div>` : ''}${editor && !kb.personal ? `<div style="margin-top:8px">${btn('Manage access', { v: 'link', href: `/knowledge/${kb.id}?tab=access` })}</div>` : ''}</div>
  </div></aside>`;
  return `<div class="${cx('docv', !outline && 'docv-noout')}">${head}${banner}<div class="viewer">${outline}<div class="viewer-canvas" id="doc-scroll" data-ks>${canvas}</div>${info}</div></div>`;
};
AFTER.docViewer = ({ query, changed }) => {
  const sc = $('#doc-scroll'); if (!sc) return;
  const key = S.cur.full;
  if (changed) chat_docFocusKey = null;
  const mk = $('#docv-focus');
  if (query.cite && mk && chat_docFocusKey !== key) {
    chat_docFocusKey = key;
    requestAnimationFrame(() => { const m = $('#docv-focus'); if (!m) return; sc.scrollTo({ top: sc.scrollTop + m.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight / 3, behavior: 'smooth' }); });
  }
  const links = $$('.viewer-outline a[data-h]');
  const track = () => { const hs = links.map(a => document.getElementById(a.dataset.h)).filter(Boolean); const top = sc.getBoundingClientRect().top + sc.clientHeight / 3; let on = 0; hs.forEach((h, i) => { if (h.getBoundingClientRect().top <= top) on = i; }); links.forEach((a, i) => a.classList.toggle('is-on', i === on)); };
  sc.onscroll = track; track();
};
A['docv-jump'] = el => { const sc = $('#doc-scroll'), h = document.getElementById(el.dataset.h); if (!sc || !h) return; sc.scrollTo({ top: sc.scrollTop + h.getBoundingClientRect().top - sc.getBoundingClientRect().top - 24, behavior: 'smooth' }); };
A['docv-dl'] = el => { const d = docById(el.dataset.id); if (d) toast(`Downloaded ${d.name}`); };
A['docv-retry'] = async el => {
  if (A['doc-retry']) { A['doc-retry'](el); return; }
  const d = docById(el.dataset.id); if (!d) return;
  d.status = 'processing'; d.error = ''; refresh(); toast(`Retrying ${d.name}`, { tone: 'info' });
  await sleep(2600); d.status = 'ready'; refresh(); toast(`${d.name} is ready`);
};
MENUS['docv-more'] = el => {
  const id = el.dataset.id;
  return [{ label: 'Details', icon: 'info', disabled: !A['doc-details'], run: () => A['doc-details']?.({ dataset: { id } }) },
    { label: 'Copy link', icon: 'link', run: () => { navigator.clipboard?.writeText(location.href.split('#')[0] + '#/doc/' + id).catch(() => { }); toast('Link copied'); } }];
};
</script>

<script>
'use strict';
/* ═══════════════════════════ Knowledge — list, knowledge base, documents, upload, access, settings ═══════════════════════════ */
const KBM_STATUS_OPTS = [['ready', 'Ready'], ['processing', 'Processing'], ['pending', 'Waiting'], ['outdated', 'Needs update'], ['failed', 'Failed'], ['unsupported', 'Not searchable']];
const KBM_TYPE_OPTS = [['pdf', 'PDF'], ['word', 'Word'], ['excel', 'Excel'], ['ppt', 'PowerPoint'], ['text', 'Text']];
const KBM_TYPE_GROUP = { pdf: 'pdf', doc: 'word', docx: 'word', xls: 'excel', xlsx: 'excel', csv: 'excel', ppt: 'ppt', pptx: 'ppt', md: 'text', txt: 'text', html: 'text', json: 'text' };
const KBM_ACCESS_OPTS = [['workspace', 'Everyone in workspace'], ['restricted', 'Restricted'], ['me', 'Only me']];
const KBM_SORTS = { updated: 'Recently updated', name: 'Name', docs: 'Most documents' };
const KBM_ROLES = [['owner', 'Owner'], ['editor', 'Editor'], ['viewer', 'Viewer']];
const KBM_ROLE_LABEL = { owner: 'Owner', editor: 'Editor', viewer: 'Viewer' };
const KBM_ROLE_RANK = { viewer: 1, editor: 2, owner: 3 };
const KBM_UPLOAD_OK = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'csv', 'ppt', 'pptx', 'txt', 'md', 'html', 'zip'];
const KBM_MAX_BYTES = 100 * 1048576;
const KBM_SAMPLES = [
  { name: 'Q4 Sales Kickoff.pptx', size: 8.4 * 1048576 }, { name: 'Pricing FAQ.docx', size: 214e3 }, { name: 'Archive 2025.zip', size: 46.2 * 1048576 },
  { name: 'video.mov', size: 182 * 1048576 }, { name: 'Meeting notes.txt', size: 12e3 },
];

/* ── Small helpers ── */
const kbmWs = () => curWs().name;
const kbmRel = ts => { const r = rel(ts); return r === 'Just now' || r === 'Yesterday' ? r.toLowerCase() : r; };
const kbmDocsKey = kbId => 'kbdocs-' + kbId;
const kbmKeyToShare = key => { const [kind, id] = key.split(':'); return { kind, id }; };
const kbmFindShare = (kb, key) => kb.shares.find(s => s.kind + ':' + s.id === key);
const kbmShareName = s => s.kind === 'group' ? (groupById(s.id)?.name || 'Group') : (memberById(s.id)?.name || 'Someone');
const kbmCovers = (s, userId) => s.kind === 'user' ? s.id === userId : !!memberById(userId)?.groups.includes(s.id);
const kbmMyRequest = kb => D.requests.find(r => r.kb === kb.id && r.user === me().id && r.status === 'pending');
const kbmSelected = kbId => { const ids = new Set(docsIn(kbId).map(d => d.id)); return selIds(kbmDocsKey(kbId)).filter(id => ids.has(id)); };
function kbmAccess(kb) {
  if (kb.personal) return { key: 'me', icon: 'user', label: 'Only you', long: 'Only you can see this' };
  if (kb.general === 'workspace') return { key: 'workspace', icon: 'globe', label: 'Everyone', long: `Everyone in ${kbmWs()} can view` };
  const onlyMe = kb.shares.length > 0 && kb.shares.every(s => s.kind === 'user' && s.id === me().id);
  return onlyMe ? { key: 'me', icon: 'lock', label: 'Only you', long: 'Only you can see this' } : { key: 'restricted', icon: 'lock', label: 'Restricted', long: 'Only people added can view' };
}
function kbmMark(kb, size = 36, locked = false) {
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px;border-radius:${Math.round(size * 0.25)}px`;
  const icls = size < 26 ? 'i-xs' : size < 34 ? 'i-sm' : '';
  if (locked) return `<span class="kbm-mark is-locked" style="${st}" aria-hidden="true">${ic('lock', icls)}</span>`;
  if (kb.personal) return `<span class="kbm-mark is-me" style="${st}" aria-hidden="true">${ic('user', icls)}</span>`;
  return `<span class="kbm-mark" style="${st};background:${kb.color}" aria-hidden="true">${esc((kb.name.trim()[0] || 'K').toUpperCase())}</span>`;
}
function kbmOwnersLabel(kb) {
  const o = kb.shares.filter(s => s.role === 'owner').map(kbmShareName);
  return o.length ? 'Owned by ' + o.slice(0, 2).join(', ') + (o.length > 2 ? ` and ${o.length - 2} more` : '') : 'Owned by workspace admins';
}
function kbmShareAvatar(s, size = 32) {
  return s.kind === 'group' ? `<span class="av-group" style="width:${size}px;height:${size}px">${ic('users', size < 28 ? 'i-xs' : 'i-sm')}</span>` : avatar(kbmShareName(s), size);
}
function kbmAudit(action, target) {
  D.audit.unshift({ id: uid('ev'), at: Date.now(), actor: me().id, action, type: 'Knowledge', target, outcome: 'success', ip: '10.4.12.30', device: 'Chrome on macOS' });
}
function kbmDocSub(d) {
  const src = d.source !== 'upload' ? srcById(d.source) : null;
  return src ? src.name : `Uploaded by ${d.addedBy === "You" || d.addedBy === me().name ? "you" : d.addedBy}`;
}
function kbmNameError(name, selfId) {
  const n = (name || '').trim();
  if (!n) return 'Enter a name.';
  if (n.length > 60) return 'Use 60 characters or fewer.';
  const dup = D.kbs.find(k => !k.archived && k.id !== selfId && k.name.trim().toLowerCase() === n.toLowerCase());
  return dup ? `“${dup.name}” already exists. Choose a different name.` : '';
}
function kbmChoice(name, value, cur, title, desc, act) {
  const on = value === cur;
  return `<label class="${cx('choice', on && 'is-on')}"><input type="radio" class="radio" name="${name}" value="${esc(value)}" ${on ? 'checked' : ''} data-change="${act}"><span class="grow"><span class="choice-title" style="display:block">${esc(title)}</span><span class="choice-desc" style="display:block">${esc(desc)}</span></span></label>`;
}
function kbmLine(icon, tone, html) {
  const color = { ok: 'var(--ok)', warn: 'var(--warn)', err: 'var(--err)', info: 'var(--info)' }[tone] || 'var(--text-3)';
  return `<div class="kbm-line"><span style="color:${color};display:inline-flex">${ic(icon, icon === 'loader' ? 'spin' : '')}</span><span>${html}</span></div>`;
}
/** Re-render after the pointer is released, so blur validation never swallows the click that caused the blur. */
let kbmPointerDown = false, kbmDeferred = null;
document.addEventListener('pointerdown', () => { kbmPointerDown = true; }, true);
document.addEventListener('pointerup', () => setTimeout(() => { kbmPointerDown = false; const f = kbmDeferred; kbmDeferred = null; f?.(); }, 0), true);
const kbmAfterPointer = fn => { if (kbmPointerDown) kbmDeferred = fn; else fn(); };
/** Keep the Member persona's role consistent when a sharing change involves them. */
function kbmSyncMember(kb, s) {
  const mid = PERSONAS.member.id;
  if (kb.personal || (s && !kbmCovers(s, mid))) return;
  const best = kb.shares.filter(x => kbmCovers(x, mid)).sort((a, b) => KBM_ROLE_RANK[b.role] - KBM_ROLE_RANK[a.role])[0];
  kb.memberRole = best ? best.role : kb.general === 'workspace' ? 'viewer' : (kb.memberRole === null ? null : 'none');
}

/* ═══════════════════════════ Knowledge list ═══════════════════════════ */
function kbmSortKbs(list, by) {
  const g = { updated: k => -k.updated, name: k => k.name.toLowerCase(), docs: k => -docsIn(k.id).length }[by] || (k => -k.updated);
  return [...list].sort((a, b) => (b.personal ? 1 : 0) - (a.personal ? 1 : 0) || (by === 'name' ? g(a).localeCompare(g(b)) : g(a) - g(b)));
}
function kbmRequestCta(kb, size = 'sm') {
  if (kbmMyRequest(kb)) return `<span class="row gap-8">${btn('Access requested', { size, icon: 'clock', disabled: true })}${status('request', 'pending')}</span>`;
  return btn('Request access', { size, icon: 'lock', act: 'kb-request', data: { kb: kb.id } });
}
function kbmCard(kb) {
  const locked = kbRole(kb) === 'none', acc = kbmAccess(kb);
  const top = `<div class="kbm-card-top">${kbmMark(kb, 36, locked)}<span class="kbm-access">${ic(acc.icon)}${esc(acc.label)}</span></div>`;
  const text = `<div><div class="kbm-name ellipsis">${esc(kb.name)}</div><div class="kbm-desc">${esc(kb.desc || 'No description yet.')}</div></div>`;
  if (locked) {
    return `<div class="card card-link kbm-card is-locked" role="link" tabindex="0" data-act="go" data-to="/knowledge/${kb.id}" aria-label="${esc(kb.name)}, you don’t have access">${top}${text}<div class="kbm-meta ellipsis">${esc(kbmOwnersLabel(kb))}</div><div class="kbm-foot">${kbmRequestCta(kb)}</div></div>`;
  }
  return `<a class="card card-link kbm-card" href="#/knowledge/${kb.id}">${top}${text}<div class="kbm-foot"><span class="kbm-meta ellipsis">${plural(docsIn(kb.id).length, 'document')} · Updated ${kbmRel(kb.updated)}</span></div></a>`;
}
function kbmListTable(rows) {
  const row = kb => {
    const locked = kbRole(kb) === 'none', acc = kbmAccess(kb);
    return `<tr class="clickable" data-act="go" data-to="/knowledge/${kb.id}" tabindex="0">
      <td><div class="cell-main">${kbmMark(kb, 32, locked)}<div class="grow"><div class="ellipsis">${esc(kb.name)}</div><div class="cell-sub ellipsis" style="font-weight:400">${esc(locked ? kbmOwnersLabel(kb) : kb.desc || '')}</div></div></div></td>
      <td><span class="kbm-access">${ic(acc.icon)}${esc(acc.label)}</span></td>
      <td class="c-num opt-md">${locked ? '<span class="faint">—</span>' : fmtNum(docsIn(kb.id).length)}</td>
      <td class="opt-md muted" style="white-space:nowrap">${locked ? '<span class="faint">—</span>' : rel(kb.updated)}</td>
      <td class="kbm-c-cta">${locked ? `<div class="row end">${kbmRequestCta(kb)}</div>` : ''}</td></tr>`;
  };
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Access</th><th class="c-num opt-md">Documents</th><th class="opt-md">Updated</th><th class="kbm-c-cta"><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows.map(row).join('')}</tbody></table></div>`;
}
function kbmListEmpty(canCreate) {
  return canCreate
    ? empty({ icon: 'book', title: 'Create your first knowledge base', body: 'Group documents by team or topic, then add files or connect a source.', actions: btn('Create knowledge base', { v: 'primary', icon: 'plus', act: 'kb-create' }), boxed: true })
    : empty({ icon: 'book', title: 'No knowledge has been shared with you yet', body: 'Upload your own files to ask about them. Only you can see My files.', actions: btn('Upload to My files', { v: 'primary', icon: 'upload', act: 'kb-upload', data: { kb: 'kb-mine' } }), boxed: true });
}
P.kbList = () => {
  const u = ui('kbList', { q: '', access: '', sort: 'updated', view: 'grid' });
  const canCreate = can('knowledge.manage'), emptyMode = isEmptyState();
  const head = pageHead({ title: 'Knowledge', sub: 'Everything the assistant can answer from.', actions: canCreate && !emptyMode ? btn('Create knowledge base', { v: 'primary', icon: 'plus', act: 'kb-create' }) : '' });
  const rows = kbmSortKbs(visibleKbs().filter(k => matchesQ('kbList', k.name, k.desc) && (!u.access || kbmAccess(k).key === u.access)), u.sort);
  const toolbar = emptyMode ? '' : `<div class="toolbar">${searchBox({ uiKey: 'kbList', placeholder: 'Search knowledge' })}${filterChip('Access', 'kbList', 'access', KBM_ACCESS_OPTS)}${clearFilters('kbList', ['access'])}<span class="spacer"></span>${btn(KBM_SORTS[u.sort], { v: 'ghost', size: 'sm', icon: 'sort', iconRight: 'chevron-down', menu: 'kbm-sort', aria: `aria-label="Sort: ${esc(KBM_SORTS[u.sort])}"` })}${seg({ value: u.view, options: [['grid', 'Grid'], ['list', 'List']], act: 'kbm-view', label: 'Layout' })}</div>`;
  const body = gate({
    loading: () => u.view === 'list' ? skelRows(6, 4) : skelCards(6),
    error: () => errorState({ title: 'Knowledge didn’t load' }),
    empty: () => kbmListEmpty(canCreate),
    ok: () => !rows.length
      ? empty({ icon: 'search', title: 'No knowledge bases match', body: 'Try another word or clear the filters.', actions: btn('Clear filters', { act: 'ui-clear', data: { ui: 'kbList', fields: 'access' } }), boxed: true })
      : u.view === 'list' ? kbmListTable(rows) : `<div class="grid g3">${rows.map(kbmCard).join('')}</div>`,
  });
  return `<div class="page">${head}${toolbar}${body}</div>`;
};
MENUS['kbm-sort'] = () => [{ header: 'Sort by' }, ...Object.entries(KBM_SORTS).map(([v, l]) => ({ label: l, checked: ui('kbList').sort === v, run: () => { ui('kbList').sort = v; refresh(); } }))];
A['kbm-view'] = el => { ui('kbList').view = el.dataset.value; refresh(); };

/* ── Create knowledge base ── */
A['kb-create'] = () => { S.ui.kbCreate = { name: '', desc: '', access: 'workspace', touched: false, busy: false }; openModal('kbm-create', {}); };
M['kbm-create'] = () => {
  const f = ui('kbCreate'); const err = kbmNameError(f.name);
  const isDup = !!err && !!f.name.trim() && !err.startsWith('Use') && !err.startsWith('Enter');
  const shown = (f.touched || isDup) ? err : '';
  const body = field({ id: 'kbc-name', label: 'Name', required: true, error: shown, counter: `<span class="counter">${f.name.length}/60</span>`,
      control: input({ id: 'kbc-name', bind: 'kbCreate.name', value: f.name, placeholder: 'e.g. Customer Support', autofocus: true, onEnter: 'kbm-create-submit', blur: 'kbm-create-blur', attrs: `data-live maxlength="60" aria-required="true" ${f.busy ? 'disabled' : ''} ${shown ? 'aria-invalid="true" aria-describedby="kbc-name-err"' : ''}` }) })
    + field({ id: 'kbc-desc', label: 'Description', optional: true, hint: 'Tells people what they can ask about.', counter: `<span class="counter">${f.desc.length}/200</span>`,
      control: textarea({ id: 'kbc-desc', bind: 'kbCreate.desc', value: f.desc, rows: 2, attrs: `data-live maxlength="200" ${f.busy ? 'disabled' : ''}` }) })
    + `<div class="field" role="radiogroup" aria-labelledby="kbc-access-l"><span class="label" id="kbc-access-l">Who can see it</span><div class="stack gap-8">${kbmChoice('kbc-access', 'workspace', f.access, `Everyone in ${kbmWs()}`, 'Anyone in the workspace can find it and ask about it.', 'kbm-create-access')}${kbmChoice('kbc-access', 'restricted', f.access, 'Only people I add', 'You choose who can see it after it’s created.', 'kbm-create-access')}</div></div>`;
  return { size: 'sm', title: 'Create knowledge base', body, foot: btn('Cancel', { act: 'close-modal', disabled: f.busy }) + btn('Create knowledge base', { v: 'primary', act: 'kbm-create-submit', disabled: !!err && !f.busy, loading: f.busy, id: 'kbc-submit' }) };
};
A['kbm-create-access'] = el => { ui('kbCreate').access = el.value; refreshLayer(); };
A['kbm-create-blur'] = () => kbmAfterPointer(() => {
  const f = S.ui.kbCreate; if (!f || S.modal?.name !== 'kbm-create' || f.touched || f.busy) return;
  f.touched = true; refreshLayer();
});
A['kbm-create-submit'] = async () => {
  const f = ui('kbCreate'); if (f.busy) return;
  f.touched = true; const err = kbmNameError(f.name);
  if (err) { refreshLayer(); $('#kbc-name')?.focus(); return; }
  f.busy = true; S.modal.props.guard = true; refreshLayer();
  await sleep(900);
  const name = f.name.trim(), restricted = f.access === 'restricted';
  const kb = { id: uid('kb'), name, desc: f.desc.trim(), color: AV_COLORS[(D.kbs.length * 3) % AV_COLORS.length], memberRole: restricted ? null : 'viewer', general: restricted ? 'restricted' : 'workspace', shares: [{ kind: 'user', id: me().id, role: 'owner' }], updated: Date.now(), created: Date.now() };

};
A['kbm-req-role'] = el => { ui('kbReq').role = el.value; refreshLayer(); };
A['kbm-req-blur'] = () => kbmAfterPointer(() => { const f = S.ui.kbReq; if (f && S.modal?.name === 'kbm-request' && !f.touched && !f.busy && f.note.trim()) { f.touched = true; refreshLayer(); } });
A['kbm-req-send'] = async () => {
  const f = ui('kbReq'), kb = kbById(f.kb); if (f.busy) return;
  f.touched = true;
  if (kbmReqError(f.note)) { refreshLayer(); $('#kbr-note')?.focus(); return; }

const SRC_TREE = {

      { id: 'g-legal', name: 'Legal', kids: [{ id: 'g-legal-exec', name: 'Executed contracts', docs: 10 }, { id: 'g-legal-tpl', name: 'Templates', docs: 14 }] },

    { id: 'c-pd', name: 'Product Docs', space: true, kids: [{ id: 'c-pd-rn', name: 'Release notes', docs: 16 }, { id: 'c-pd-api', name: 'API reference', docs: 9 }, { id: 'c-pd-guides', name: 'Guides', docs: 12 }] },

    { id: 'c-fin', name: 'Finance', space: true, kids: [{ id: 'c-fin-proc', name: 'Procurement', docs: 9 }, { id: 'c-fin-exp', name: 'Expenses', docs: 6 }] },
  ],
};

/* ── Seed: older sync history so paging and filters are meaningful ── */
(function srcSeedHistory() {
  const base = [['src-hr', 'kb-hr'], ['src-product', 'kb-product'], ['src-sales', 'kb-sales'], ['src-legal', 'kb-legal']];
  for (let i = 0; i < 14; i++) {
    let [source, kb] = base[i % 4]; let trigger = i % 5 === 2 ? 'Manual' : 'Scheduled'; let by = trigger === 'Manual' ? ['Linh Tran', 'An Nguyen', 'Ben Walker'][i % 3] : 'Schedule';
    if (source === 'src-legal') { trigger = 'Manual'; by = 'Sara Lopez'; }
    if (i % 6 === 4) { source = null; kb = 'kb-hr'; trigger = 'Upload'; by = 'Chi Bui'; }
    const total = 3 + (i * 7) % 15; const cancelled = i === 6;
    D.runs.push({ id: 'run-' + (1038 - i), source, kb, trigger, status: cancelled ? 'cancelled' : 'completed', started: ago((13 + i * 1.5) * DAY + (i % 3) * HOUR), dur: (40 + (i * 23) % 400) * 1000, counts: { total, ok: cancelled ? Math.floor(total / 2) : total, failed: 0, skipped: cancelled ? total - Math.floor(total / 2) : 0 }, by });
  }
  const r47 = D.runs.find(r => r.id === 'run-1047'); if (r47) { r47.added = 3; r47.updated = 5; }
  const r44 = D.runs.find(r => r.id === 'run-1044'); if (r44) { r44.added = 2; r44.updated = 12; }
  D.runs.forEach(r => { const s = srcById(r.source); r.srcName = r.srcName || s?.name || null; r.app = r.app || s?.app || 'upload'; });
})();

/* ── Formatting ── */
const srcTzShort = tz => (SRC_TZ.find(t => t[0] === tz)?.[1] || tz).replace(/ \(.*\)$/, '');
function srcSchedText(s) { if (!s || s.freq === 'manual') return 'Manual'; if (s.freq === 'daily') return `Daily at ${s.time}`; return `Weekly on ${s.day} at ${s.time}`; }
function srcNextAt(s) {
  if (!s || s.freq === 'manual' || !s.time) return null;
  const [h, m] = s.time.split(':').map(Number); const d = new Date(Date.now()); d.setHours(h, m, 0, 0);
  if (s.freq === 'daily') { if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1); return d.getTime(); }
  const want = SRC_DAYS.findIndex(x => x[0] === s.day); const cur = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() + (want - cur + 7) % 7); if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 7); return d.getTime();
}
function srcIn(ts) { const d = ts - Date.now(); if (d < HOUR) return 'in ' + plural(Math.max(1, Math.round(d / MIN)), 'minute'); if (d < DAY) return 'in ' + plural(Math.round(d / HOUR), 'hour'); return 'in ' + plural(Math.round(d / DAY), 'day'); }
const srcScopeSummary = s => !s.scope?.length ? 'Everything' : s.scope[0] + (s.scope.length > 1 ? ` +${s.scope.length - 1}` : '');
const srcRunsOf = id => D.runs.filter(r => r.source === id).sort((a, b) => b.started - a.started);
const srcRunById = id => D.runs.find(r => r.id === id);
const srcCan = () => can('source.manage');
function srcRunDelta(r) { const ok = r.counts.ok; const added = r.added ?? Math.round(ok * 0.3); return { added, updated: r.updated ?? (ok - added), failed: r.counts.failed }; }
function srcDeltaText(r) {
  if (r.status === 'running' || r.status === 'queued') return `${r.counts.ok + r.counts.failed} of ${plural(r.counts.total, 'document')}`;
  if (r.status === 'failed' && !r.counts.total) return 'Nothing synced';
  const d = srcRunDelta(r); const p = [];
  if (d.added) p.push(`+${d.added} added`); if (d.updated) p.push(`${d.updated} updated`); if (d.failed) p.push(`${d.failed} failed`); if (r.counts.skipped) p.push(`${r.counts.skipped} skipped`);
  return p.join(' · ') || 'No changes';
}
const srcChangeText = p => [p.added && `${p.added} added`, p.updated && `${p.updated} updated`].filter(Boolean).join(', ') || 'no changes';
function srcResIcon(res) {
  const m = { completed: ['check-circle', 'src-ok', 'Completed'], partial: ['alert', 'src-warn', 'Completed with issues'], failed: ['x-circle', 'src-err', 'Failed'], cancelled: ['stop', 'faint', 'Stopped'] }[res];
  return m ? `<span class="${m[1]}" title="${m[2]}">${ic(m[0], 'i-sm')}<span class="sr-only">${m[2]}</span></span>` : '';
}
const srcKbLink = kb => kb ? `<a href="#/knowledge/${kb.id}" class="src-kb" data-act="go" data-to="/knowledge/${kb.id}"><span class="src-dot" style="background:${kb.color}"></span><span>${esc(kb.name)}</span></a>` : '<span class="faint">Removed</span>';
const srcWaitHtml = (title, sub) => `<div class="src-wait" role="status">${ic('loader', 'spin i-lg')}<div class="state-title">${esc(title)}</div><div class="muted" style="font-size:13.5px;max-width:340px">${esc(sub)}</div></div>`;
function srcProvBtn(app, label, act, { loading, data, v = 'primary' } = {}) {
  const g = app === 'gdrive' ? SRC_G : APPS.confluence.glyph(14);
  return `<button type="button" class="${cx('btn', 'btn-' + v, loading && 'is-loading')}" data-act="${act}" ${dataAttrs(data)}><span class="src-g">${g}</span><span>${esc(label)}</span></button>`;
}
const srcProv = app => app === 'gdrive' ? 'Google' : 'Atlassian';
function srcAudit(action, target, outcome = 'success') { D.audit.unshift({ id: uid('ev'), at: Date.now(), actor: me().id, action, type: 'Sources', target, outcome, ip: '10.4.12.30', device: 'Chrome on macOS' }); }

/* ═══════════════════════════ Sync engine (simulated) ═══════════════════════════ */
function srcRerender(full) {
  const selOpen = document.activeElement?.tagName === 'SELECT';
  if (full) { if (['sources', 'kbDetail', 'kbList', 'overview'].includes(S.cur?.r.page)) refresh(); else refreshLayer(); return; }
  if (selOpen) return;
  if (S.cur?.r.page === 'sources') refresh();
  else if (['source', 'run'].includes(S.drawer?.name) || ['srcWizard', 'srcReconnect'].includes(S.modal?.name)) refreshLayer();
}
function srcStartSync(src, o = {}) {
  if (!src || src.status === 'syncing') return null;
  const failing = D.docs.filter(d => d.source === src.id && d.status === 'failed').length;
  const plan = o.plan || { added: 1 + Math.floor(rnd() * 3), updated: 2 + Math.floor(rnd() * 4) + failing, failed: 0 };
  const total = plan.added + plan.updated + plan.failed;
  const run = { id: 'run-' + (SRCM.seq++), source: src.id, srcName: src.name, app: src.app, kb: src.kb, trigger: o.trigger || 'Manual', status: 'running', started: Date.now(), counts: { total, ok: 0, failed: 0, skipped: 0 }, by: o.by || me().name, plan, retry: !!o.retry };
  D.runs.unshift(run);
  src.prevStatus = src.status; src.status = 'syncing'; src.progress = { done: 0, total }; src.runId = run.id;

}
function srcDrive(src, run, { every = 600, inc = 1, quiet = false }) {
  clearInterval(SRCM.timers[run.id]);
  SRCM.timers[run.id] = setInterval(() => {
    if (run.status !== 'running') { clearInterval(SRCM.timers[run.id]); delete SRCM.timers[run.id]; return; }
    const c = run.counts; const done = Math.min(c.total, c.ok + c.failed + inc); c.ok = done;

    if (done >= c.total) srcFinishRun(src, run, quiet); else srcRerender();
  }, every);
}
function srcDocName(app) { const pool = SRC_POOL[app] || SRC_POOL.gdrive; const i = SRCM.docN[app] = (SRCM.docN[app] || 0) + 1; const n = pool[(i - 1) % pool.length]; const k = Math.floor((i - 1) / pool.length); return k ? n.replace(/(\.\w+)$/, ` ${k + 1}$1`) : n; }

  clearInterval(SRCM.timers[run.id]); delete SRCM.timers[run.id];
  const p = run.plan || { added: 0, updated: run.counts.total, failed: 0 };
  run.counts.failed = p.failed; run.counts.ok = run.counts.total - p.failed;
  run.status = p.failed ? 'partial' : 'completed'; run.dur = Date.now() - run.started; run.added = p.added; run.updated = p.updated;
  if (src && D.sources.includes(src)) {
    src.status = src.prevStatus === 'paused' ? 'paused' : 'healthy'; src.progress = null; src.runId = null;
    src.last = { at: Date.now(), result: run.status, added: p.added, updated: p.updated, removed: 0, failed: p.failed };
    src.next = src.status === 'paused' ? null : srcNextAt(src.schedule);
    D.docs.forEach(d => { if (d.source === src.id && ['failed', 'processing', 'pending', 'outdated'].includes(d.status)) { d.status = 'ready'; d.error = ''; d.updated = Date.now(); } });
    for (let i = 0; i < p.added; i++) D.docs.push(mkDoc(src.kb, uid('d'), srcDocName(src.app), { source: src.id, addedBy: src.name, updated: Date.now() }));
    const kb = kbById(src.kb); if (kb) kb.updated = Date.now();
    if (!quiet || S.cur?.r.page === 'sources') toast(`${src.name} is up to date — ${srcChangeText(p)}`);
  }
  srcRerender(true);
}
function srcStopRun(run) {
  const src = srcById(run.source); clearInterval(SRCM.timers[run.id]); delete SRCM.timers[run.id];
  run.status = 'cancelled'; run.dur = Date.now() - run.started; run.counts.skipped = Math.max(0, run.counts.total - run.counts.ok - run.counts.failed);
  if (src) { src.status = src.prevStatus === 'paused' ? 'paused' : 'healthy'; src.progress = null; src.runId = null; src.last = { at: Date.now(), result: 'cancelled', added: 0, updated: run.counts.ok, removed: 0, failed: 0 }; src.next = src.status === 'paused' ? null : srcNextAt(src.schedule); }
  srcAudit('Stopped a sync', src?.name || 'File upload');
}
/** The scheduled sync already running in the mock data advances and finishes ~10 s after first use. */
function srcBoot() {
  if (SRCM.booted) return; SRCM.booted = true;
  D.runs.filter(r => r.status === 'running').forEach(r => {
    const s = srcById(r.source); const left = Math.max(1, r.counts.total - r.counts.ok);
    r.plan = r.plan || { added: 4, updated: r.counts.total - 4, failed: 0 };
    if (s) { s.runId = r.id; s.progress = { done: r.counts.ok, total: r.counts.total }; }
    srcDrive(s, r, { every: Math.max(600, Math.round(10000 / left)), inc: 1, quiet: true });
  });
}
/** Account sign-in fixed: sources waiting on it go back to healthy and start syncing. */
function srcReconnectAcc(acc, firstId) {
  acc.status = 'connected'; acc.checked = Date.now();
  const fixed = D.sources.filter(s => s.account === acc.id && s.status === 'reconnect');
  fixed.forEach(s => { s.status = 'healthy'; s.next = srcNextAt(s.schedule); });
  fixed.sort((a, b) => (b.id === firstId) - (a.id === firstId));
  srcAudit('Reconnected an account', acc.label);
  fixed.forEach(s => srcStartSync(s, { trigger: 'Manual', plan: s.id === 'src-sales' ? { added: 3, updated: 5, failed: 0 } : undefined }));
  return fixed;
}
function srcReconnectMsg(acc, synced) {
  const app = APPS[acc.app].name; if (!synced.length) return `${app} reconnected`;
  return `${app} reconnected. Syncing ${synced[0].name}${synced.length > 1 ? ` and ${synced.length - 1} more` : ''}…`;
}

/* ═══════════════════════════ Page ═══════════════════════════ */
P.sources = ({ query }) => {
  srcBoot();

</style>
<script>
'use strict';
/* ═══════════════════════════ AdminModule — shared helpers ═══════════════════════════ */
const ADM_VERB = { viewer: 'view', editor: 'edit', owner: 'manage' };
const ADM_CAN = { viewer: 'Can view', editor: 'Can edit', owner: 'Can manage' };
const ADM_EMAIL_RE = /^[^\s@,;]+@[^\s@,;]+\.[a-z]{2,}$/i;
const admNew = new Set();
const admFirst = n => String(n || '').split(' ')[0];
const admLc = s => (s ? s[0].toLowerCase() + s.slice(1) : '');
const admNames = a => (a.length <= 2 ? a.join(' and ') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`);
const admBlurToButton = e => !!e?.relatedTarget?.closest?.('button,a');
const admFull = ts => new Date(ts).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
function admAgo(ts) { const d = NOW - ts; if (d < DAY) return admLc(rel(ts)); const n = Math.floor(d / DAY); return `${n} ${n === 1 ? 'day' : 'days'} ago`; }
function admMarkNew(ids) { ids.forEach(id => admNew.add(id)); setTimeout(() => ids.forEach(id => admNew.delete(id)), 2600); }
function admLog(action, type, target, outcome = 'success') { const ev = { id: uid('ev'), at: Date.now(), actor: me().id, action, type, target, outcome, ip: '10.4.12.31', device: 'Chrome on macOS' }; D.audit.unshift(ev); return ev; }
/** Undo also takes the event back out of the activity log. */
function admUnlog(...evs) { evs.flat().forEach(ev => { const i = D.audit.indexOf(ev); if (i >= 0) D.audit.splice(i, 1); }); }
const admTone = (tone, icon) => `<span class="adm-ic adm-ic-${tone}" aria-hidden="true">${ic(icon, 'i-sm')}</span>`;
const admActorAv = (id, size = 28) => id === 'system' ? `<span class="av-group adm-sys" style="width:${size}px;height:${size}px" aria-hidden="true">${ic('zap', 'i-xs')}</span>` : avatar(actorName(id), size);
const admSecHead = (title, extra = '') => `<div class="section-head"><h2 class="section-title">${esc(title)}</h2>${extra}</div>`;
const admKbs = () => D.kbs.filter(k => !k.personal && !k.archived);
function admNameFromEmail(e) { return e.split('@')[0].split(/[._-]+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' '); }
A['adm-noop'] = () => { };

/* History so "Recently decided" has context (not the Member persona, so no member-side effects). */
if (!D.requests.some(r => r.id === 'req-h1')) D.requests.push(
  { id: 'req-h1', user: 'u-james', kb: 'kb-fin', role: 'viewer', note: 'Quarterly audit of vendor approvals.', at: ago(2 * DAY + 3 * HOUR), status: 'approved', decidedAt: ago(2 * DAY), decidedBy: 'u-mai' },
  { id: 'req-h2', user: 'u-chi', kb: 'kb-legal', role: 'viewer', note: 'Looking for the standard NDA template.', at: ago(6 * DAY), status: 'denied', decidedAt: ago(5 * DAY), decidedBy: 'u-linh', reason: 'The NDA template is in HR Policies.' },
);

/* ═══════════════════════════ Overview ═══════════════════════════ */
function admAttention() {
  const items = [];
  attentionSources().forEach(s => {
    const acc = accById(s.account); const app = APPS[s.app]?.name || 'The app'; const kb = kbById(s.kb);
    if (s.status === 'reconnect' || acc?.status === 'expired') items.push({ tone: 'err', icon: 'plug', title: `${s.name} stopped syncing`, detail: `${app} access expired ${admAgo(acc?.checked || s.last?.at || NOW)}${kb ? ` · ${kb.name} isn’t getting updates` : ''}`, label: 'Reconnect', act: 'adm-attn-reconnect', id: s.id });
    else items.push({ tone: 'err', icon: 'alert-circle', title: `${s.name} couldn’t sync`, detail: s.last?.error || 'The last sync failed.', label: 'Review', act: 'adm-attn-source', id: s.id });
  });
  const reqs = pendingRequests();
  if (reqs.length) {
    const people = new Set(reqs.map(r => r.user)).size;
    const kbNames = [...new Set(reqs.map(r => kbById(r.kb)?.name).filter(Boolean))];
    items.push({ tone: 'info', icon: 'user-plus', title: people === 1 ? `${actorName(reqs[0].user)} is waiting for access` : `${people} people are waiting for access`, detail: `To ${admNames(kbNames)}`, label: 'Review', act: 'go', to: '/access?tab=requests' });
  }
  admKbs().forEach(kb => {
    const failed = docsIn(kb.id).filter(d => d.status === 'failed');
    if (failed.length) items.push({ tone: 'warn', icon: 'file-text', title: `${plural(failed.length, 'document')} in ${kb.name} couldn’t be processed`, detail: failed.slice(0, 2).map(d => d.name).join(', ') + (failed.length > 2 ? ` and ${failed.length - 2} more` : ''), label: 'Review', act: 'go', to: `/knowledge/${kb.id}?tab=documents` });
  });
  return items;
}
function admAttentionHtml() {
  const items = admAttention();
  if (!items.length) return `<div class="list"><div class="list-row">${admTone('ok', 'check')}<div class="grow"><div class="adm-t">Everything is running smoothly</div><div class="cell-sub">Sources are syncing and no one is waiting on you.</div></div></div></div>`;
  return `<div class="list">${items.map((it, i) => `<div class="list-row adm-attn">${admTone(it.tone, it.icon)}<div class="grow"><div class="adm-t ellipsis">${esc(it.title)}</div><div class="cell-sub ellipsis">${esc(it.detail)}</div></div>${btn(it.label, { v: i === 0 ? 'primary' : 'secondary', size: 'sm', act: it.act, data: { id: it.id, to: it.to } })}</div>`).join('')}</div>`;
}
A['adm-attn-reconnect'] = el => { if (A['src-reconnect']) A['src-reconnect']({ dataset: { id: el.dataset.id } }); else go('/sources'); };
A['adm-attn-source'] = el => { const id = el.dataset.id; go('/sources'); setTimeout(() => A['src-open']?.({ dataset: { id } }), 120); };

function admWeekHtml() {
  const u = D.usage; const pct = (a, b) => Math.round(((a - b) / b) * 100);
  const delta = d => `<span class="${cx('adm-delta', d < 0 && 'is-down')}">${d >= 0 ? '+' : '−'}${Math.abs(d)}%</span> vs last week`;
  const kbs = admKbs().filter(canReadKb).map(k => k.id);
  const docs = D.docs.filter(d => !d.archived && kbs.includes(d.kb)); const ready = docs.filter(d => d.status === 'ready').length;
  const stat = (label, val, foot) => `<div class="card adm-stat"><div class="adm-stat-label">${label}</div><div class="adm-stat-val">${val}</div><div class="adm-stat-foot">${foot}</div></div>`;
  const q = u.questions; const days = q.map((_, i) => NOW - (q.length - 1 - i) * DAY); const total = q.reduce((a, b) => a + b, 0);
  return `<div class="adm-week"><div class="adm-stats">
      ${stat('Questions asked', fmtNum(u.questions7), delta(pct(u.questions7, u.questions7Prev)))}
      ${stat('Active people', fmtNum(u.active), delta(pct(u.active, u.activePrev)))}
      ${stat('Documents ready', fmtNum(ready), `of ${fmtNum(docs.length)} · ${docs.length ? Math.round((ready / docs.length) * 100) : 0}% searchable`)}
    </div>
    <div class="card adm-chart"><div class="adm-stat-label">Questions, last 30 days</div><div class="adm-stat-val">${fmtNum(total)}</div>
      <div class="adm-chart-plot">${bars(q, { height: 150, labels: days.map(fmtDate) })}<div class="row between adm-axis"><span>${fmtDate(days[0])}</span><span>Today</span></div></div></div></div>`;
}
const ADM_HEALTH = [['ready', 'Ready', 'var(--ok)'], ['processing', 'Processing', 'var(--info)'], ['pending', 'Waiting', 'var(--border-strong)'], ['outdated', 'Needs update', 'var(--warn)'], ['failed', 'Failed', 'var(--err)']];
function admHealthHtml() {
  const kbs = admKbs(); const ids = kbs.map(k => k.id);
  const docs = D.docs.filter(d => !d.archived && ids.includes(d.kb));
  const counts = Object.fromEntries(ADM_HEALTH.map(([k]) => [k, docs.filter(d => d.status === k).length]));
  const total = ADM_HEALTH.reduce((a, [k]) => a + counts[k], 0) || 1;
  return `<div class="card adm-health"><div class="adm-health-top"><span class="adm-stat-val" style="margin:0">${Math.round((counts.ready / total) * 100)}%</span><span class="muted">of ${plural(docs.length, 'document')} in ${plural(kbs.length, 'knowledge base')} are ready to answer questions</span></div>
    <div class="meter" role="img" aria-label="${esc(ADM_HEALTH.map(([k, l]) => `${l} ${counts[k]}`).join(', '))}">${ADM_HEALTH.filter(([k]) => counts[k]).map(([k, l, c]) => `<span style="width:${(counts[k] / total) * 100}%;background:${c}" title="${esc(l)}: ${counts[k]}"></span>`).join('')}</div>
    <div class="legend adm-legend">${ADM_HEALTH.map(([k, l, c]) => `<span><i style="background:${c}"></i>${esc(l)}<b>${fmtNum(counts[k])}</b></span>`).join('')}</div></div>`;
}
function admEvLine(ev) {
  const who = `<strong>${esc(actorName(ev.actor))}</strong>`;
  if (ev.type === 'Sign-in') return ev.outcome === 'failure' ? `${who} was blocked from signing in` : `${who} signed in with ${esc(ev.target)}`;
  return `${who} ${esc(admLc(ev.action))} <span class="adm-evtarget">· ${esc(ev.target)}</span>`;
}
function admRecentHtml() {
  const evs = [...D.audit].sort((a, b) => b.at - a.at).slice(0, 5);
  return `<div class="list">${evs.map(ev => `<div class="list-row adm-evrow clickable" data-act="adm-ev-open" data-id="${ev.id}" tabindex="0">${admActorAv(ev.actor, 26)}<div class="grow ellipsis">${admEvLine(ev)}</div><span class="faint num" style="font-size:12.5px;white-space:nowrap" title="${esc(admFull(ev.at))}">${rel(ev.at)}</span></div>`).join('')}</div>`;
}
function admSetupHtml() {
  const ws = curWs();
  const steps = [
    { title: 'Create a knowledge base', desc: 'A home for one team’s or topic’s documents.', label: 'Create knowledge base', done: true, run: 'adm-setup-kb' },
    { title: 'Add documents or connect a source', desc: 'Upload files, or keep Google Drive and Confluence in sync.', label: 'Add content', run: 'adm-setup-src' },
    { title: 'Add your team', desc: 'People need a BoMesh account before you add them.', label: 'Add members', run: 'member-add' },
    { title: 'Customize the assistant', desc: 'Set its instructions and the starters people see first.', label: 'Customize', run: 'adm-setup-asst' },
  ];
  const done = steps.filter(s => s.done).length; const firstTodo = steps.findIndex(s => !s.done);
  return `<div class="card adm-setup"><div class="adm-setup-head"><h2 class="section-title">Set up ${esc(ws.name)}</h2><div class="row gap-12" style="margin-top:10px"><div class="grow">${progress((done / steps.length) * 100)}</div><span class="faint num" style="font-size:13px;white-space:nowrap">${done} of ${steps.length} done</span></div></div>
    ${steps.map((s, i) => `<div class="${cx('adm-step', s.done && 'is-done')}"><span class="adm-step-mark" aria-hidden="true">${s.done ? ic('check', 'i-xs') : ''}</span><div class="grow"><div class="adm-t">${esc(s.title)}${s.done ? '<span class="sr-only"> (done)</span>' : ''}</div><div class="cell-sub">${esc(s.desc)}</div></div>${s.done ? btn('View', { v: 'ghost', size: 'sm', href: '/knowledge' }) : btn(s.label, { v: i === firstTodo ? 'primary' : 'secondary', size: 'sm', act: s.run })}</div>`).join('')}</div>`;
}
A['adm-setup-kb'] = () => { if (A['kb-create']) A['kb-create'](); else go('/knowledge'); };
A['adm-setup-src'] = () => { if (A['src-connect']) A['src-connect']({ dataset: {} }); else go('/sources'); };
A['adm-setup-asst'] = () => go('/assistant');

P.overview = () => {
  const h = new Date().getHours(); const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const head = pageHead({ title: `${greet}, ${admFirst(me().name)}`, sub: esc(curWs().name) });
  const body = gate({
    loading: () => `${admSecHead('Needs attention')}${skelRows(2, 2)}${admSecHead('This week')}${skelCards(3)}`,
    error: () => errorState({ title: 'The overview didn’t load' }),
    empty: () => admSetupHtml(),
    ok: () => `${admSecHead('Needs attention')}${admAttentionHtml()}
      <div class="adm-sec">${admSecHead('This week')}${admWeekHtml()}</div>
      <div class="adm-sec">${admSecHead('Knowledge health', btn('View knowledge', { v: 'link', href: '/knowledge' }))}${admHealthHtml()}</div>
      ${can('audit.read') ? `<div class="adm-sec">${admSecHead('Recent activity', btn('View all activity', { v: 'link', href: '/activity' }))}${admRecentHtml()}</div>` : ''}`,
  });
  return `<div class="page adm-ov">${head}${body}</div>`;
};

/* ═══════════════════════════ People & access ═══════════════════════════ */
const ADM_TABS = ['members', 'groups', 'roles', 'requests'];
P.access = ({ query }) => {
  const tab = ADM_TABS.includes(query.tab) ? query.tab : 'members';
  const actions = {
    members: can('user.manage') ? btn('Add member', { v: 'primary', icon: 'user-plus', act: 'member-add' }) : '',
    groups: can('group.manage') ? btn('Create group', { v: 'primary', icon: 'plus', act: 'adm-group-create' }) : '',
    roles: can('role.manage') ? btn('Create role', { v: admRoleDirty() ? 'secondary' : 'primary', icon: 'plus', act: 'adm-role-create' }) : '',
    requests: '',
  }[tab];
  const head = pageHead({ title: 'People & access', sub: 'Who can use this workspace and what they can do.', actions });
  const t = tabs([
    { id: 'members', label: 'Members', count: D.members.length }, { id: 'groups', label: 'Groups', count: D.groups.length },
    { id: 'roles', label: 'Roles', count: D.roles.length }, { id: 'requests', label: 'Requests', count: pendingRequests().length || null },
  ], tab, '/access');
  const body = { members: admMembersTab, groups: admGroupsTab, roles: admRolesTab, requests: admRequestsTab }[tab]();
  return `<div class="page">${head}${t}${body}</div>`;
};

/* ── Members ── */
function admRoleSelect(m) {
  return select({ id: 'mrole-' + m.id, value: m.roleId, options: D.roles.map(r => [r.id, r.name]), cls: 'select-sm adm-rsel', change: 'adm-role-change', attrs: `data-act="adm-noop" data-id="${m.id}" aria-label="Role for ${esc(m.name)}"` });
}
function admGroupTags(ids, max = 2) {
  const gs = ids.map(groupById).filter(Boolean);
  if (!gs.length) return '<span class="faint">—</span>';
  return `<div class="row gap-4">${gs.slice(0, max).map(g => `<span class="tag">${esc(g.name)}</span>`).join('')}${gs.length > max ? `<span class="tag" title="${esc(gs.slice(max).map(g => g.name).join(', '))}">+${gs.length - max}</span>` : ''}</div>`;
}
function admMembersRows() {
  const u = ui('admM');
  const rows = D.members.filter(m => (!u.role || m.roleId === u.role) && (!u.group || m.groups.includes(u.group)) && (!u.status || m.status === u.status) && matchesQ('admM', m.name, m.email));
  return applySort(rows, 'admM', { name: m => m.name, role: m => roleById(m.roleId)?.name || '', lastActive: m => m.lastActive || 0 });
}
function admMembersTab() {
  const u = ui('admM', { q: '', role: '', group: '', status: '', sel: {}, page: 1 });
  const rows = admMembersRows();
  const live = !S.navLoading && S.pageState === 'live';
  const toolbar = `<div class="toolbar">${searchBox({ uiKey: 'admM', placeholder: 'Search people' })}${filterChip('Role', 'admM', 'role', D.roles.map(r => [r.id, r.name]))}${filterChip('Group', 'admM', 'group', D.groups.map(g => [g.id, g.name]))}${filterChip('Status', 'admM', 'status', [['active', 'Active'], ['suspended', 'Suspended']])}${clearFilters('admM', ['role', 'group', 'status'])}<span class="spacer"></span>${live ? `<span class="result-meta">${plural(rows.length, 'person', 'people')}</span>` : ''}</div>`;

<script>

const pf_hash = s => [...String(s)].reduce((a, c) => (Math.imul(a, 31) + c.charCodeAt(0)) >>> 0, 7);

const PF_CODE_RE = /^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/;
const PF_NAMES = ['Grace Lee', 'Kevin Ng', 'Rosa Diaz', 'Nam Tran', 'Ivy Chen', 'Tom Becker', 'Ana Silva', 'Luca Rossi', 'Dara Okafor', 'Mia Novak'];
const PF_DEVICES = ['Chrome on macOS', 'Edge on Windows', 'Safari on macOS', 'Chrome on Windows', 'Firefox on Linux', 'Safari on iPad'];

function pf_userByName(name) { return D.pUsers.find(u => u.name === name); }

const pf_email = (name, dom) => name.toLowerCase().replace(/\s+/g, '.') + '@' + dom;
function pf_knownEmail(email) { const e = email.trim().toLowerCase(); return D.pUsers.some(u => u.email === e) || D.members.some(m => m.email === e) || D.knownAccounts.includes(e); }
function pf_nameFromEmail(email) {
  const e = email.trim().toLowerCase(); const k = D.pUsers.find(u => u.email === e) || D.members.find(m => m.email === e); if (k) return k.name;
  return e.split('@')[0].split(/[._-]+/).filter(Boolean).map(s => s[0].toUpperCase() + s.slice(1)).join(' ') || e;

function pf_slug(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, ''); }
/** Daily series of n values summing to total, weekends quieter. Deterministic from seed. */
function pf_series(seed, n, total) {
  const w = Array.from({ length: n }, (_, i) => { const d = new Date(NOW - (n - 1 - i) * DAY).getDay(); return (0.78 + 0.22 * Math.sin(i / 3.1 + seed % 7) + 0.2 * pf_r(seed, i)) * (d === 0 || d === 6 ? 0.42 : 1); });

/* ── Create workspace ── */
const pf_newForm = () => ui('pwsNew', { name: '', code: '', email: '', codeEdited: false, touched: {}, submitted: false, busy: false });

      <div class="card" style="margin-top:12px"><div class="card-head"><div class="section-title">Questions per day</div><span class="faint num" style="font-size:13px">${fmtNum(Q)} in ${winLabel}</span></div>

  };
  return `<div class="page">${head}${gate({ ok, loading: () => `<div class="pf-stats">${Array.from({ length: 3 }, () => '<div class="card card-pad stack gap-8"><span class="sk sk-line" style="width:40%"></span><span class="sk" style="width:60%;height:28px"></span></div>').join('')}</div><div style="margin-top:12px">${skelRows(6, 5)}</div>`,
    empty: () => empty({ icon: 'chart', title: 'No usage yet', body: 'Usage appears once people start asking questions.', boxed: true }), error: () => errorState() })}</div>`;
};
A['pusage-win'] = el => { ui('pusage').win = el.dataset.value; refresh(); };

/* ═══════════════════════════ Audit log ═══════════════════════════ */
const pf_audit = (() => {
  const P_EV = [
    [26 * HOUR, null, 'Kenji Mori', 'Sign-in blocked — not a platform admin', 'Sign-in', 'Platform console', 'failure'],
    [2 * DAY + 3 * HOUR, 'ws-litware', 'Jordan Blake', 'Created workspace', 'Workspaces', 'Litware Labs', 'success'],
    [5 * DAY, null, 'Alex Rivera', 'Made platform admin', 'People & access', 'Jordan Blake', 'success'],
    [12 * DAY, null, 'Jordan Blake', 'Suspended account', 'People & access', 'Nora Quinn', 'success'],
    [18 * DAY, 'ws-adatum', 'Alex Rivera', 'Suspended workspace', 'Workspaces', 'Adatum Health', 'success'],
    [33 * DAY, null, 'Alex Rivera', 'Turned on connector', 'Connectors', 'Confluence', 'success'],
    [42 * DAY, null, 'Alex Rivera', 'Updated connector settings', 'Connectors', 'Google Drive', 'success'],
  ];
  const KB = ['Policies', 'Customer contracts', 'Product docs', 'Runbooks', 'Sales playbooks', 'Clinical guidelines', 'Branch procedures', 'Supplier specs'];
  const T = [
    ['Sign-in', 'Signed in', () => 'Google', 'success', 0],
    ['Knowledge', 'Uploaded 3 documents', k => k, 'success', 0],
    ['Sources', 'Sync failed', () => 'Shared drive — Operations', 'failure', 'sys'],
    ['People & access', 'Added member', (k, p) => p, 'success', 0],
    ['Sources', 'Connected a source', () => 'Google Drive — Shared drives', 'success', 0],
    ['People & access', 'Changed role to Workspace admin', (k, p) => p, 'success', 0],
    ['Sign-in', 'Sign-in blocked — wrong password', () => 'Password', 'failure', 1],
    ['Knowledge', 'Created knowledge base', k => k, 'success', 0],
    ['Settings', 'Updated assistant instructions', () => 'Assistant setup', 'success', 0],
    ['People & access', 'Approved access request', (k, p) => `${p} → ${k}`, 'success', 0],
    ['Sources', 'Paused a source', () => 'Confluence — Team space', 'success', 1],
    ['Knowledge', 'Archived document', () => 'Pricing 2025.pdf', 'success', 1],
  ];
  const act = D.pWorkspaces.filter(w => w.status !== 'new');
  const out = P_EV.map(([t, ws, actor, action, area, target, result], i) => ({ id: 'pev-p' + i, at: ago(t), ws, actor, action, area, target, result, ip: `10.0.${8 + i}.${21 + i * 9}`, device: PF_DEVICES[i % PF_DEVICES.length] }));
  for (let i = 0; i < 34; i++) {
    const t = (i + 1) * (i + 1) * 55 * MIN;
    let w = act[(i * 5 + 2) % act.length]; if (w.id === 'ws-adatum' && t < 18 * DAY) w = pf_ws('ws-woodgrove');
    const h = pf_hash(w.id); const [area, action, tgt, result, who] = T[i % T.length];
    const people = [w.owner, PF_NAMES[(h + i) % PF_NAMES.length], PF_NAMES[(h + i * 7 + 3) % PF_NAMES.length]];
    const actor = who === 'sys' ? 'BoMesh' : people[who ? 1 + (i % 2) : (i % 3 === 2 ? 1 : 0)];
    out.push({ id: 'pev-' + i, at: ago(t), ws: w.id, actor, action, area, target: tgt(KB[(h + i) % KB.length], people[2]), result, ip: `10.${20 + h % 200}.${(i * 7) % 250}.${(i * 13 + 40) % 250}`, device: PF_DEVICES[(h + i) % PF_DEVICES.length] });
  }
  return out.sort((a, b) => b.at - a.at);
})();
const PF_AUD_WIN = [['1', '24 hours'], ['7', '7 days'], ['30', '30 days'], ['90', '90 days']];
const pf_wsCell = id => { const w = id && pf_ws(id); return w ? `<span class="row gap-8" style="min-width:0">${wsMark(w, 20)}<span class="ellipsis">${esc(w.name)}</span></span>` : `<span class="row gap-8"><span class="pf-plat">${ic('layers')}</span><span class="muted">Platform</span></span>`; };
function pf_auditRows() {
  const f = ui('paud', { q: '', ws: '', area: '', result: '', win: '30' });
  return pf_audit.filter(e => (NOW - e.at) <= +f.win * DAY && (!f.ws || (f.ws === 'platform' ? !e.ws : e.ws === f.ws)) && (!f.area || e.area === f.area) && (!f.result || e.result === f.result)
    && matchesQ('paud', e.actor, e.action, e.target, pf_ws(e.ws)?.name || 'Platform'));
}
P.pAudit = () => {
  const f = ui('paud', { q: '', ws: '', area: '', result: '', win: '30' });
  const areas = [...new Set(pf_audit.map(e => e.area))].sort().map(a => [a, a]);
  const toolbar = `<div class="toolbar">${searchBox({ uiKey: 'paud', placeholder: 'Search events' })}${filterChip('Workspace', 'paud', 'ws', [['platform', 'Platform'], ...D.pWorkspaces.map(w => [w.id, w.name])])}${filterChip('Area', 'paud', 'area', areas)}${filterChip('Result', 'paud', 'result', [['success', 'Succeeded'], ['failure', 'Failed']])}${clearFilters('paud', ['ws', 'area', 'result'])}<span class="spacer"></span>${seg({ value: f.win, options: PF_AUD_WIN, act: 'paud-win', label: 'Time window' })}</div>`;
  const table = () => {
    const rows = pf_auditRows();
    if (!rows.length) return pf_noMatch('paud', ['ws', 'area', 'result'], 'events');
    const page = paginate(rows, 'paud', 15);
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th class="opt-md">Person</th><th>Action</th><th>Workspace</th><th>Result</th></tr></thead><tbody>${page.map(e => `<tr class="clickable" data-act="paud-open" data-id="${e.id}" tabindex="0">
      <td class="muted" style="white-space:nowrap" title="${esc(fmtDateTime(e.at))}">${rel(e.at)}</td>
      <td class="opt-md"><span class="row gap-8">${avatar(e.actor, 22)}<span class="ellipsis">${esc(e.actor)}</span></span></td>
      <td><div style="font-weight:500">${esc(e.action)}</div><div class="cell-sub ellipsis" style="max-width:320px">${esc(e.target)}</div></td>
      <td style="max-width:200px">${pf_wsCell(e.ws)}</td><td>${status('outcome', e.result)}</td></tr>`).join('')}</tbody></table></div>${pager(rows.length, 'paud', 15)}`;
  };
  return `<div class="page">${pageHead({ title: 'Audit log', sub: 'Every recorded change across workspaces.', actions: btn('Export CSV', { icon: 'download', act: 'paud-export', loading: !!ui('paud').exporting }) })}
    ${gate({ ok: () => toolbar + table(), loading: () => toolbar + skelRows(8, 5), empty: () => empty({ icon: 'activity', title: 'No events recorded yet', body: 'Changes to workspaces, people and connectors appear here.', boxed: true }), error: () => errorState() })}</div>`;
};
A['paud-win'] = el => { const f = ui('paud'); f.win = el.dataset.value; f.page = 1; refresh(); };

A['paud-export'] = async () => {

DR.paud = ({ id }) => {

  };
};

/* ═══════════════════════════ System health ═══════════════════════════ */
const PF_INCIDENTS = [
  { id: 'inc-2', title: 'Answers were slow to start', service: 'assistant', at: ago(9 * DAY), dur: 38 * MIN, impact: 'The first words of answers took up to 12 seconds.' },
  { id: 'inc-1', title: 'Scheduled syncs were delayed', service: 'scheduler', at: ago(23 * DAY), dur: 72 * MIN, impact: 'Syncs ran late and caught up once service resumed.' },
];
function pf_strip(s) {
  const warn = new Set(s.status !== 'operational' ? [28, 29] : PF_INCIDENTS.filter(x => x.service === s.id).map(x => 29 - Math.round((NOW - x.at) / DAY)));
  return `<span class="pf-strip" role="img" aria-label="${warn.size ? `${warn.size} ${warn.size === 1 ? 'day' : 'days'} with issues in the last 30 days` : 'No issues in the last 30 days'}">${Array.from({ length: 30 }, (_, i) => `<i class="${warn.has(i) ? 'w' : ''}" title="${esc(fmtDate(NOW - (29 - i) * DAY))} · ${warn.has(i) ? 'Slower than usual' : 'No issues'}"></i>`).join('')}</span>`;
}
P.pHealth = () => {
  const u = ui('phealth', { inc: false, busy: false, updated: NOW });
  const bad = D.pServices.filter(s => s.status !== 'operational');
  const banner = bad.length
    ? callout('warn', 'Document processing is slower than usual', 'New documents wait about 9 minutes before they’re searchable. Answers and search aren’t affected.')
    : callout('ok', 'All systems operational', '');
  const table = () => `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Service</th><th class="opt-md">Last 30 days</th><th class="c-num">Uptime</th><th class="c-num">Response</th><th>Status</th></tr></thead><tbody>${D.pServices.map(s => `<tr>
      <td><div style="font-weight:500">${esc(s.name)}</div>${s.note ? `<div class="cell-sub" style="max-width:300px">${esc(s.note)}</div>` : ''}</td>
      <td class="opt-md">${pf_strip(s)}</td><td class="c-num">${s.uptime.toFixed(2).replace(/\.00$/, '')}%</td>
      <td class="c-num mono" style="font-size:12.5px;white-space:nowrap">${esc(s.latency)}</td><td>${status('service', s.status)}</td></tr>`).join('')}</tbody></table></div>`;
  const incidents = `<div class="section-head"><button class="pf-inc" data-act="phealth-inc" aria-expanded="${u.inc}">${ic(u.inc ? 'chevron-down' : 'chevron-right')}<span class="section-title">Recent incidents</span></button><span class="faint" style="font-size:13px">${PF_INCIDENTS.length} resolved in the last 30 days</span></div>
    ${u.inc ? `<div class="list">${PF_INCIDENTS.map(x => `<div class="list-row" style="align-items:flex-start"><span style="color:var(--ok);margin-top:2px">${ic('check-circle', 'i-sm')}</span><div class="grow"><div style="font-weight:500">${esc(x.title)}</div><div class="muted" style="font-size:13.5px">${esc(x.impact)}</div></div><div class="stack" style="align-items:flex-end;font-size:12.5px"><span class="muted">${fmtDate(x.at)}</span><span class="faint">Resolved in ${x.dur < HOUR ? Math.round(x.dur / MIN) + ' min' : Math.floor(x.dur / HOUR) + ' h ' + Math.round(x.dur % HOUR / MIN) + ' min'}</span></div></div>`).join('')}</div>` : ''}`;
  return `<div class="page">${pageHead({ title: 'System health', sub: `Updated ${rel(u.updated).toLowerCase()}`, actions: btn('Refresh', { icon: 'refresh', act: 'phealth-refresh', loading: u.busy }) })}
    ${gate({ ok: () => `<div style="margin-bottom:16px">${banner}</div>${table()}${incidents}`, loading: () => skelRows(7, 5), empty: () => empty({ icon: 'server', title: 'No services reporting', body: 'Status appears once the deployment reports in.', boxed: true }), error: () => errorState() })}</div>`;
};
A['phealth-inc'] = () => { const u = ui('phealth'); u.inc = !u.inc; refresh(); };
A['phealth-refresh'] = async () => { const u = ui('phealth'); if (u.busy) return; u.busy = true; refresh(); await sleep(700); u.busy = false; u.updated = NOW; refresh(); toast('Status refreshed'); };
