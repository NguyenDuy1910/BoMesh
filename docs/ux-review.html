MENUS['wk-ver'] = el => { const a = wk_art(el.dataset.id); const p = wk_p(); const l = wk_latest(a); return [{ header: 'Versions' }, ...[...a.revs].reverse().map(r => ({ html: `<span class="stack grow" style="min-width:0"><span>Version ${r.n}${r.n === l.n ? ' · latest' : ''}</span><span class="faint ellipsis" style="font-size:12px">${esc(r.summary)} · ${rel(r.at).toLowerCase()}</span></span>`, checked: p.rev === r.n, run: () => { p.rev = r.n; p.cell = null; if (p.tab === 'changes' && r.n === 1) p.tab = 'preview'; refresh(); } })), { sep: true }, { label: 'Compare with previous', icon: 'layers', disabled: wk_rev(a, p.rev).n === 1, run: () => { p.tab = 'changes'; refresh(); } }, { label: 'All versions', icon: 'history', run: () => { p.tab = 'history'; refresh(); } }]; };
MENUS['wk-dl'] = el => { const a = wk_art(el.dataset.id); const rev = wk_rev(a, el.dataset.rev); const base = a.file.replace(/\.[^.]+$/, ''); const dl = n => () => toast(`Downloaded ${n} (version ${rev.n})`); return WK_KIND(a.type) === 'sheet' ? [{ header: `Version ${rev.n}` }, { label: 'Excel workbook', icon: 'table', meta: '.xlsx', run: dl(base + '.xlsx') }, { label: 'Current sheet as CSV', icon: 'file-text', meta: '.csv', run: dl(base + '.csv') }, { label: 'PDF', icon: 'file', meta: '.pdf', run: dl(base + '.pdf') }] : [{ header: `Version ${rev.n}` }, { label: 'Word document', icon: 'file-text', meta: '.docx', run: dl(base + '.docx') }, { label: 'PDF', icon: 'file', meta: '.pdf', run: dl(base + '.pdf') }, { label: 'Markdown', icon: 'file', meta: '.md', run: dl(base + '.md') }]; };
MENUS['wk-file-more'] = el => { const a = wk_art(el.dataset.id); return [{ label: 'Save to knowledge…', icon: 'book', run: () => A['wk-publish']({ dataset: { id: a.id } }) }, { label: 'Rename', icon: 'pencil', run: () => { S.ui.wkRen = { id: a.id, v: a.title, err: '' }; openModal('wk-rename'); } }, { label: 'Copy link', icon: 'link', run: () => toast('Link copied. People in this chat can open it.') }, { sep: true }, { label: 'Show in the conversation', icon: 'message', run: () => { const m = convById(a.conv)?.messages.find(x => (x.artifacts || []).some(r => r.id === a.id)); document.getElementById('msg-' + m?.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }]; };
M['wk-rename'] = () => { const f = ui('wkRen'); return { size: 'sm', title: 'Rename file', body: field({ id: 'wk-ren', label: 'Name', error: f.err, control: input({ id: 'wk-ren', bind: 'wkRen.v', value: f.v, autofocus: true, onEnter: 'wk-ren-save' }) }), foot: btn('Cancel', { act: 'close-modal' }) + btn('Save', { v: 'primary', act: 'wk-ren-save' }) }; };
A['wk-ren-save'] = () => { const f = ui('wkRen'); const v = f.v.trim(); if (!v) { f.err = 'Enter a name.'; refreshLayer(); return; } const a = wk_art(f.id); a.title = v; closeModal(); refresh(); toast('Renamed'); };
A['wk-restore'] = el => { const p = wk_p(); const a = wk_art(p.art); const from = wk_rev(a, el.dataset.rev); confirmAction({ title: `Restore version ${from.n}?`, body: `This makes version ${a.revs.length + 1}, a copy of version ${from.n}. Every version stays in History.`, confirm: 'Restore', delay: 400, onConfirm: () => { const r = wk_addRev(a, { ...(from.sheets ? { sheets: wk_clone(from.sheets) } : { html: from.html }), by: 'you', summary: `Restored version ${from.n}` }); p.rev = r.n; p.tab = 'preview'; refresh(); toast(`Restored as version ${r.n}`); } }); };
/* Ask for changes → agent turn → new version */
A['wk-ask-quick'] = el => { ui('wkAsk').text = el.dataset.q; A['wk-ask-send'](); };
A['wk-ask-send'] = () => {
  if (chat_run) return; const f = ui('wkAsk'); const t = f.text.trim(); const p = wk_p(); const a = p && wk_art(p.art);
  if (!t) { $('#wk-ask-in')?.focus(); return; }
  const conv = convById(a.conv); const q = `Update “${a.title}”: ${t}`;
  conv.messages.push({ id: uid('m'), role: 'user', text: q });
  const am = { id: uid('m'), role: 'assistant', q, text: '', citations: [], state: 'streaming', phase: 'work' }; conv.messages.push(am);
  f.text = ''; conv.at = Date.now(); chat_stick = true; chat_stream(conv, am, S.pageState === 'error');
};
/* Edit in place (documents) */
A['wk-edit'] = () => { const p = wk_p(); p.edit = true; p.tab = 'preview'; p.draft = null; refresh(); requestAnimationFrame(() => $('#wk-editor')?.focus()); };
A['wk-edit-input'] = el => { const p = wk_p(); const first = p.draft == null; p.draft = el.innerHTML; if (first) { const foot = $('.wk-edit-foot'); if (foot) { foot.querySelector('.faint').textContent = 'Unsaved changes'; foot.querySelector('.btn-primary').disabled = false; } } };
function wk_leaveEdit(then) { const p = wk_p(); const a = wk_art(p.art); if (p.draft == null || p.draft === wk_rev(a, p.rev).html) { p.edit = false; p.draft = null; return true; } confirmAction({ title: 'Discard your edits?', body: 'Your changes to this document haven’t been saved as a version.', confirm: 'Discard edits', danger: true, delay: 0, onConfirm: () => { p.edit = false; p.draft = null; then?.(); refresh(); } }); return false; }
A['wk-edit-cancel'] = () => { if (wk_leaveEdit()) refresh(); };
A['wk-edit-save'] = () => { const p = wk_p(); const a = wk_art(p.art); const html = $('#wk-editor')?.innerHTML ?? p.draft; const r = wk_addRev(a, { html, by: 'you', summary: 'Edited by you' }); Object.assign(p, { edit: false, draft: null, rev: r.n, tab: 'changes' }); refresh(); toast(`Saved as version ${r.n}`, { action: { label: 'Undo', run: () => { a.revs.pop(); p.rev = wk_latest(a).n; p.tab = 'preview'; refresh(); } } }); };
document.addEventListener('mousedown', e => { const b = e.target.closest?.('[data-wk-cmd]'); if (!b) return; e.preventDefault(); const [cmd, arg] = b.dataset.wkCmd.split(':'); document.execCommand(cmd, false, arg ? `<${arg}>` : null); const ed = $('#wk-editor'); if (ed) A['wk-edit-input'](ed); });
const wk_prevEsc2 = A['esc-page'];
A['esc-page'] = () => { const p = wk_p(); if (p?.kind === 'file' && p.edit) { if (wk_leaveEdit()) refresh(); return true; } return wk_prevEsc2?.() || false; };
const wk_close0 = A['chat-panel-close'];
A['chat-panel-close'] = () => { const p = wk_p(); if (p?.kind === 'file' && p.edit && !wk_leaveEdit(() => { chat_ui().panel = null; refresh(); })) return; wk_close0(); };

/* Save to knowledge (publish a version into a knowledge base) */
A['wk-publish'] = el => { const a = wk_art(el.dataset.id); const kbs = visibleKbs().filter(canEditKb); S.ui.wkPub = { id: a.id, kb: el.dataset.kb || (a.published[0]?.kb) || (kbs.find(k => !k.personal) || kbs[0])?.id, name: a.file, busy: false }; openModal('wk-publish'); };
M['wk-publish'] = p => {
  const f = ui('wkPub'); const a = wk_art(f.id); const l = wk_latest(a); const kbs = visibleKbs().filter(canEditKb); const kb = kbById(f.kb); const existing = a.published.find(x => x.kb === f.kb);
  const who = kb?.personal ? 'Only you can find it.' : kb?.general === 'workspace' ? `Everyone in ${curWs().name} can find and cite it.` : `People with access to ${kb?.name} can find and cite it.`;
  return { title: existing ? 'Update the saved copy' : 'Save to knowledge', sub: `${esc(a.title)} · version ${l.n}`, body:
    field({ id: 'wk-pub-kb', label: 'Knowledge base', control: select({ id: 'wk-pub-kb', bind: 'wkPub.kb', value: f.kb, change: 'wk-pub-kb', options: kbs.map(k => [k.id, k.name]) }) }) +
    field({ id: 'wk-pub-name', label: 'Document name', control: input({ id: 'wk-pub-name', bind: 'wkPub.name', value: f.name }) }) +
    callout(existing ? 'info' : 'neu', existing ? `Replaces version ${existing.rev} in ${kb?.name}` : '', `${who} It will be processed for search in a few minutes.`),
    foot: btn('Cancel', { act: 'close-modal' }) + btn(existing ? `Update to version ${l.n}` : 'Save to knowledge', { v: 'primary', act: 'wk-pub-save', loading: f.busy, disabled: !kbs.length }) };
};
A['wk-pub-kb'] = () => refreshLayer();
A['wk-pub-save'] = async () => {
  const f = ui('wkPub'); const a = wk_art(f.id); const l = wk_latest(a); const kb = kbById(f.kb); if (!f.name.trim()) return;
  f.busy = true; S.modal.props.guard = true; refreshLayer(); await sleep(900);
  const ex = a.published.find(x => x.kb === f.kb);
  let doc = ex && docById(ex.doc);
  if (doc) Object.assign(doc, { status: 'processing', updated: Date.now(), name: f.name.trim() }); else { doc = mkDoc(f.kb, uid('d-pub'), f.name.trim(), { addedBy: me().name, updated: Date.now(), status: 'processing', size: l.size, pages: 2 }); D.docs.push(doc); }
  if (ex) Object.assign(ex, { rev: l.n, at: Date.now() }); else a.published.push({ kb: f.kb, rev: l.n, at: Date.now(), doc: doc.id });
  D.audit.unshift({ id: uid('ev'), at: Date.now(), actor: me().id, action: ex ? 'Updated a saved file' : 'Saved a file from chat', type: 'Knowledge', target: `${f.name.trim()} → ${kb.name}`, outcome: 'success', ip: '10.4.12.30', device: 'Chrome on macOS' });
  closeModal(); refresh();
  toast(ex ? `Updated in ${kb.name}` : `Saved to ${kb.name}`, { action: { label: 'Open', run: () => go('/knowledge/' + kb.id) } });
  setTimeout(() => { doc.status = 'ready'; if (S.cur?.r.page === 'kbDetail') refresh(); }, 3500);
};

const wk_after0 = AFTER.chatThread;
AFTER.chatThread = a => { wk_after0?.(a); const p = chat_ui().panel; if (p?.kind !== 'file') return; const key = p.art + ':' + p.rev + ':' + p.tab; if (p.scrolled === key) return; p.scrolled = key; const g = $('.wk-grid'); const c = g && (g.querySelector('thead th.add') || g.querySelector('td.chg')); if (g && c) g.scrollLeft = Math.max(0, c.offsetLeft - g.clientWidth + c.offsetWidth + 24); };
/* Prototype support: journey + review notes */
JOURNEYS.splice(2, 0, { id: 'j2b', title: 'Work with files: analyze, review and edit', who: 'member', desc: 'Attach files → watch the secure workspace run → review versions → ask for changes → save to knowledge.', start: () => { setPersona('member'); go('/chat/c10'); setTimeout(() => { const a = Object.values(D.artifacts).find(x => x.conv === 'c10' && x.type === 'xlsx'); if (a) wk_openFile(a.id, wk_latest(a).n, 'changes'); }, 160); } });
NOTES.chatThread.changes.push(
  'Files: attach from computer, drag and drop, or reference documents already in knowledge (read in place, not copied). Chips show upload progress, failures and access.',
  'Secure workspace: file work appears as one line (“Worked for 26s · Ran 3 commands, 1 failed · Created 2 files”) that opens into a timeline with each command, its output and status.',
  'Files the assistant makes are cards with versions. The file panel has Preview, Changes (added / changed / removed) and History, plus Restore — nothing is overwritten.',
  'Edit documents in place, or ask for changes in plain words; either creates a new version you can compare.',
  'Save to knowledge publishes a chosen version into a knowledge base and keeps the copy in sync with an Update action.',
  'Answers keep earlier attempts (‹ 1/2 ›), Retry offers More detail / Shorter, and editing a question replaces the answer after a confirmation.');
NOTES.chatThread.states = [...(NOTES.chatThread.states || []), 'Open “Vendor renewals needing review” and review the spreadsheet changes.', 'Edit the summary document and save it as a new version.', 'Set State → Error, then ask for a change: the file work fails safely.'];
NOTES.chatHome.changes.push('The + button adds files from your computer or from knowledge; video and app files are refused with a reason.');
</script>

  if (!location.hash) history.replaceState(null, '', '#/review');
  render();
