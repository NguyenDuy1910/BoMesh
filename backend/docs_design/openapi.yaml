            - FEATURED
          readOnly: true
        itemCount:
          type: integer
          format: int32
          description: Entries the caller can see.
          readOnly: true
        hiddenItemCount:
          type: integer
          format: int32
          description: Entries omitted because the caller cannot read their item.
          readOnly: true
        state:
