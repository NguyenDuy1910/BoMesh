          type: string
          description: '`workspaces/{workspace}/overview`.'
          readOnly: true
        window:
          type: string
          description: Window used.
          readOnly: true
        timeZone:
          type: string
          description: Time zone used.
          readOnly: true
        attentionItems:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - CONTRIBUTIONS_WAITING
                  - PUBLISH_FAILED
                  - REVERIFICATION_DUE
                  - SOURCE_FAILING
                  - CONNECTION_EXPIRED
                  - ACCESS_REQUESTS
                  - DOCUMENTS_WAITING_TO_PUBLISH
              itemCount:
                type: integer
                format: int32
