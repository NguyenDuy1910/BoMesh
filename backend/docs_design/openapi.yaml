      description: 'A request to add a document (or a new revision) to a collection. State machine: ANALYZING → IN_REVIEW (system); IN_REVIEW → APPROVED (approve) | CHANGES_REQUESTED (requestChanges) | REJECTED (reject) | WITHDRAWN (withdraw); CHANGES_REQUESTED → ANALYZING (resubmit) | WITHDRAWN (withdraw). APPROVED, REJECTED, WITHDRAWN are terminal. Any other transition → FAILED_PRECONDITION (400).'
      properties:
        name:
          type: string
          description: '`workspaces/{workspace}/contributions/{contribution}`.'
          readOnly: true
        kind:
          type: string
          enum:
            - NEW_DOCUMENT
            - NEW_REVISION
        origin:
          type: string
          enum:
            - MEMBER
            - SOURCE
          readOnly: true
        item:
          type: string
          description: "An Item name `workspaces/{workspace}/items/{item}`. The candidate DOCUMENT: for MEMBER it lives in the contributor's PERSONAL collection (shared for review without copying); for SOURCE it is UNPUBLISHED in the source's target collection. Must be ACTIVE with `contentState: AVAILABLE`. While the contribution is open the candidate cannot be moved, deleted or have its content changed (CONTRIBUTION_OPEN); a SOURCE candidate is source-managed through its contribution and cannot be moved."
        targetCollection:
          type: string
          description: 'Name of a COLLECTION item; any other item → INVALID_ARGUMENT (400). Empty = let the assistant suggest (NEW_DOCUMENT). NEW_REVISION: set by the server to the governing collection of `replacesItem`; a different value → INVALID_ARGUMENT.'
        replacesItem:
          type: string
          description: 'An Item name `workspaces/{workspace}/items/{item}`. NEW_REVISION only: the published DOCUMENT to revise.'
        contributor:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`. Empty for SOURCE origin.
          readOnly: true
        source:
          type: string
          description: Source name `workspaces/{workspace}/sources/{source}`; SOURCE origin only.
          readOnly: true
        externalVersion:
          type: string
          readOnly: true
          description: 'SOURCE NEW_REVISION only: the provider version under review.'
        note:
          type: string
        changeSummary:
          type: string
        suggestions:
          $ref: '#/components/schemas/ContributionSuggestions'
          readOnly: true
        flags:
          type: array
          items:
            $ref: '#/components/schemas/ContributionFlag'
          description: Every caller sees every flag kind; `relatedItem` is returned only when the caller can see that item under the visibility rule (reviewers too).
          readOnly: true
        audienceSummary:
          type: string
          readOnly: true
        state:
