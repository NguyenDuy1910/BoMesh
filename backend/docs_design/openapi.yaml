      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,62}$
    CollabRequestTypeId:
      name: requestTypeId
      in: query
      description: Optional client-chosen request type ID; `^[a-z][a-z0-9-]{0,62}$`. Taken → 409 ALREADY_EXISTS.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,62}$
  responses:
    BadRequest:
      description: INVALID_ARGUMENT, FAILED_PRECONDITION or OUT_OF_RANGE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing, expired or revoked access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PermissionDenied:
      description: PERMISSION_DENIED — returned whether or not the resource exists (AIP-211).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — the caller may read the parent but the resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: ALREADY_EXISTS or ABORTED (stale etag, concurrent change).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: RESOURCE_EXHAUSTED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Empty:
      description: Success with an empty body (google.protobuf.Empty).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Empty'
  schemas:
    Empty:
      type: object
      additionalProperties: false
      description: google.protobuf.Empty.
    View:
      type: string
      enum:
        - VIEW_UNSPECIFIED
        - BASIC
        - FULL
    Error:
      type: object
      description: HTTP/JSON representation of google.rpc.Status (AIP-193).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - status
            - details
          properties:
            code:
              type: integer
              description: HTTP status code.
            message:
              type: string
              description: Developer-facing English message.
            status:
              type: string
              enum:
                - INVALID_ARGUMENT
                - FAILED_PRECONDITION
                - OUT_OF_RANGE
                - UNAUTHENTICATED
                - PERMISSION_DENIED
                - NOT_FOUND
                - ALREADY_EXISTS
                - ABORTED
                - RESOURCE_EXHAUSTED
                - CANCELLED
                - INTERNAL
                - UNAVAILABLE
                - DEADLINE_EXCEEDED
                - UNIMPLEMENTED
            details:
              type: array
              description: Always contains one ErrorInfo; may add BadRequest, PreconditionFailure, LocalizedMessage, Help.
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
        - '@type'
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.ErrorInfo
        reason:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+[A-Z0-9]$
          description: ErrorInfo reason (UPPER_SNAKE_CASE).
        domain:
          type: string
          example: bomesh.app
        metadata:
          type: object
          additionalProperties:
            type: string
        locale:
          type: string
        message:
          type: string
      additionalProperties: true
    Operation:
      type: object
      description: "google.longrunning.Operation (AIP-151). `response` is set when done without error; its `@type` names the result message. `metadata` is exactly the method's typed metadata message from `x-operation-info` plus `@type` (prefix `type.googleapis.com/bomesh.v1.`); every typed metadata carries `createTime` and `progressPercent`. A cancelled operation is `done` with `error` CANCELLED; an operation whose server restarted before it finished is `done` with `error` UNAVAILABLE. Methods that complete within the request (CreateWorkspace, exports) return an Operation that is already `done`; clients must still handle the not-done case."
      required:
        - name
        - done
      properties:
        name:
          type: string
          example: operations/7c1f0e2a
          readOnly: true
        metadata:
          type: object
          additionalProperties: true
          description: 'The typed metadata message named by the method''s `x-operation-info`, with `@type`.'
        done:
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
        response:
          type: object
          additionalProperties: true
    Status:
      type: object
      description: google.rpc.Status (inside Operation.error).
      properties:
        code:
          type: integer
          description: google.rpc.Code numeric value.
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Policy:
      type: object
      description: IAM policy (google.iam.v1.Policy). Principals are `user:{userId}`, `group:{groupId}` or `workspaceMembers`.
      properties:
        version:
          type: integer
          format: int32
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        etag:
          type: string
          format: byte
    Binding:
      type: object
      required:
        - role
        - members
      properties:
        role:
          type: string
          example: roles/collectionViewer
          description: Predefined `roles/{role}` or custom `workspaces/{workspace}/roles/{role}`.
        members:
          type: array
          items:
            type: string
            example: user:0d6c2c4e
    GetIamPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        options:
          type: object
          properties:
            requestedPolicyVersion:
              type: integer
              format: int32
    SetIamPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - policy
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
        updateMask:
          type: string
    TestIamPermissionsRequest:
      type: object
      additionalProperties: false
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
            example: items.publish
    TestIamPermissionsResponse:
      type: object
      additionalProperties: false
      properties:
        permissions:
          type: array
          items:
            type: string
    Citation:
      type: object
      additionalProperties: false
      description: A grounded reference to a passage.
      required:
        - available
      properties:
        passage:
          type: string
          description: workspaces/{workspace}/items/{item}/passages/{passage}
        item:
          type: string
          description: Name of the cited DOCUMENT item, workspaces/{workspace}/items/{item}
        displayName:
          type: string
        pageNumber:
          type: integer
          format: int32
        excerpt:
          type: string
        available:
          type: boolean
          description: False when the reader can no longer open the document; then only `available` is set.
    ItemType:
      type: string
      description: COLLECTION holds other items and carries access policies; DOCUMENT holds content. Immutable.
      enum:
        - COLLECTION
        - DOCUMENT
    ItemState:
      type: string
      readOnly: true
      description: Item lifecycle (AIP-164). DELETED items are hidden unless showDeleted=true and are purged at purgeTime.
      enum:
        - ACTIVE
        - DELETED
    ContentState:
      type: string
      readOnly: true
      description: Availability of a Document's stored original. PENDING until the bytes are confirmed; FAILED when the stored object did not validate. Independent of publication and indexing.
      enum:
        - PENDING
        - AVAILABLE
        - FAILED
    PublicationState:
      type: string
      readOnly: true
      description: Who sees a Document in its governing collection. PUBLISHED = every reader; UNPUBLISHED = only holders of items.update there. Independent of review, content and indexing.
      enum:
        - PUBLISHED
        - UNPUBLISHED
    IndexingState:
      type: string
      readOnly: true
      description: Processing of a Document, independent of publication. OUTDATED = indexed with an older processing configuration; UNSUPPORTED = kept but never processed.
      enum:
        - PENDING
        - RUNNING
        - SUCCEEDED
        - FAILED
        - OUTDATED
        - UNSUPPORTED
    VerificationState:
      type: string
      readOnly: true
      description: Trust shown to readers. REVIEW_DUE = verification expired or the source changed after publication.
      enum:
        - VERIFIED
        - REVIEW_DUE
        - UNVERIFIED
    ItemAccess:
      type: string
      readOnly: true
      description: The caller's effective access to an item, from roles on its governing collections. LOCKED = a discoverable root collection the caller cannot read (only name, displayName, description and ownerSummary are returned; never counts).
      enum:
        - READER
        - EDITOR
        - OWNER
        - LOCKED
    ContributionState:
      type: string
      readOnly: true
      enum:
        - ANALYZING
        - IN_REVIEW
        - CHANGES_REQUESTED
        - APPROVED
        - REJECTED
        - WITHDRAWN
    User:
      type: object
      additionalProperties: false
      description: An account (`users/{user}`).
      required:
        - email
      properties:
        name:
          type: string
          readOnly: true
          description: Resource name `users/{user}`.
          example: users/8f2c1a
        email:
          type: string
          format: email
          description: Sign-in email; set on create, immutable afterwards.
        username:
          type: string
          description: Unique handle usable for password sign-in.
        displayName:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          description: Input only, on CreateUser.
        state:
          $ref: '#/components/schemas/UserState'
        platformRole:
          $ref: '#/components/schemas/UserPlatformRole'
        lastActiveTime:
          type: string
          format: date-time
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
    UserState:
      type: string
      readOnly: true
      enum:
        - ACTIVE
        - SUSPENDED
    UserPlatformRole:
      type: string
      description: Platform console role. Defaults to NONE; changeable only via UpdateUser with users.update.
      enum:
        - NONE
        - OPERATOR
        - ADMIN
    ListUsersResponse:
      type: object
      additionalProperties: false
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
    SuspendUserRequest:
      type: object
      additionalProperties: false
      description: Empty body; the user is named only by the path.
    ActivateUserRequest:
      type: object
      additionalProperties: false
      description: Empty body; the user is named only by the path.
    SendPasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - resetToken
        - newPassword
      properties:
        resetToken:
          type: string
          writeOnly: true
          description: Token from the reset email.
        newPassword:
          type: string
          format: password
          writeOnly: true
    UserPreferences:
      type: object
      additionalProperties: false
      description: Singleton `users/{user}/preferences`.
      properties:
        name:
          type: string
          readOnly: true
          example: users/8f2c1a/preferences
        languageCode:
          type: string
          description: BCP-47 UI language, e.g. `en` or `vi`.
        showWorkSteps:
          type: boolean
          description: Show the assistant's work steps.
        appearance:
          $ref: '#/components/schemas/UserAppearance'
        emailNotifications:
          $ref: '#/components/schemas/UserEmailNotifications'
        lastWorkspace:
          type: string
          description: Last opened workspace, `workspaces/{workspace}`.
    UserAppearance:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - SYSTEM
            - LIGHT
            - DARK
        theme:
          type: string
          description: Theme key.
        accentColor:
          type: string
          description: Accent colour, hex `#RRGGBB`.
          pattern: ^#[0-9A-Fa-f]{6}$
        backgroundTint:
          type: string
          description: Background tint key.
        cornerRadius:
          type: string
          enum:
            - SHARP
            - DEFAULT
            - ROUNDED
        font:
