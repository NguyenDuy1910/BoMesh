        topics:
          type: array
          items:
            type: string
            description: Topic name `workspaces/{workspace}/topics/{topic}`.
        summary:
          type: string
        languageCode:
          type: string
          description: BCP-47.
        owner:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`. Accountable for the content.
        contentState:
          $ref: '#/components/schemas/ContentState'
        publicationState:
          $ref: '#/components/schemas/PublicationState'
        indexingState:
          $ref: '#/components/schemas/IndexingState'
        indexingError:
          $ref: '#/components/schemas/Status'
          readOnly: true
        lastIngestionRun:
          type: string
          description: '`workspaces/{workspace}/ingestionRuns/{ingestionRun}`.'
          readOnly: true
        revision:
          type: string
          description: Current revision `workspaces/{workspace}/items/{item}/revisions/{revision}`.
          readOnly: true
        indexedRevision:
          type: string
          readOnly: true
