        sourceItems:
          type: array
          items:
            type: string
            description: 'Item name of a DOCUMENT (`workspaces/{workspace}/items/{item}`); only those readable to the caller are returned (see `hiddenSourceCount`). On create each must be readable by the caller (403 otherwise). "Readable" means the Item visibility rule: the item is ACTIVE, every ancestor is ACTIVE, the caller holds `items.get` on its governing collection, and it is PUBLISHED or the caller holds `items.update` there. The contribution-reviewer exception does not apply: a reviewer cannot use a candidate draft they may only review.'
        hiddenSourceCount:
          type: integer
          format: int32
          readOnly: true
          description: Source items withheld because the caller cannot read them now.
        evidenceReview:
          allOf:
            - $ref: '#/components/schemas/EvidenceReview'
          description: 'Evidence review (kind EVIDENCE_REVIEW). Filtered per reader on every read: cells and the synthesis citing items the caller cannot read now are replaced by placeholders (`available: false` / `synthesisAvailable: false`).'
        state:
          type: string
          enum:
            - GENERATING
            - ACTIVE
            - FAILED
            - DELETED
          readOnly: true
        revision:
          type: string
          readOnly: true
          description: Current revision name.
        etag:
          type: string
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        deleteTime:
          type: string
          format: date-time
          readOnly: true
        purgeTime:
          type: string
          format: date-time
          readOnly: true
