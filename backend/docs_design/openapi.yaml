          type: integer
          format: int32
          readOnly: true
        heightPixels:
          type: integer
          format: int32
          readOnly: true
        strength:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          default: 25
          description: How visible the image is, from 0 (a faint tint) to 100 (clearly visible). One value drives the wash, blur and saturation.
