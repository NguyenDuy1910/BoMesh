      summary: Publish an artifact into a collection as a new document.
      description: 'Renders the current revision and creates a new DOCUMENT item in `collection` (a COLLECTION item) exactly as CreateItem does; the result is that Item (Knowledge `Item` schema), returned here by name. The new document is PUBLISHED and the artifact itself is unchanged. Requires `items.create` on `collection`, otherwise 403 PERMISSION_DENIED; a contributor publishes into their own PERSONAL collection (always writable) and then calls CreateContribution. `collection` that is not a COLLECTION item is 400 INVALID_ARGUMENT; a collection the caller cannot read is 403 PERMISSION_DENIED. Before publishing, the audience check runs against the destination: if any source item of the artifact is not readable by every reader of `collection`, the call fails with 400 FAILED_PRECONDITION reason AUDIENCE_CANNOT_READ_SOURCES and nothing is created. The artifact must be ACTIVE, else 400 FAILED_PRECONDITION. A stale `etag` is 409 ABORTED.'
