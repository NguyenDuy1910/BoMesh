  /api/v1/workspaces/{workspace}/contributions/{contribution}:resubmit:
    post:
      tags:
        - Knowledge
      operationId: ResubmitContribution
      summary: Resubmit after changes were requested.
      description: "CHANGES_REQUESTED → ANALYZING; changes the contribution `etag` (a reviewer's stale approve then fails ABORTED). A replacement `item` must be ACTIVE with `contentState: AVAILABLE` (else FAILED_PRECONDITION). Stale etag → ABORTED (409). State machine: ANALYZING → IN_REVIEW (system); IN_REVIEW → APPROVED (approve) | CHANGES_REQUESTED (requestChanges) | REJECTED (reject) | WITHDRAWN (withdraw); CHANGES_REQUESTED → ANALYZING (resubmit) | WITHDRAWN (withdraw). APPROVED, REJECTED, WITHDRAWN are terminal. Any other transition → FAILED_PRECONDITION (400)."
      x-permission: contributions.resubmit
      x-authorization: contributor
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/PathContribution'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResubmitContributionRequest'
      responses:
