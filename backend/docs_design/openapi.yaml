        sizeBytes:
          type: string
          format: int64
          description: 'Size in bytes (int64 as string). Input on create only (mimeType required; sizeBytes required for the signed-upload flow); read-only afterwards: follows the current revision (approval of a NEW_REVISION and rollback update it).'
        purpose:
          type: string
          enum:
            - KNOWLEDGE
            - CONVERSATION_ATTACHMENT
          description: Immutable. CONVERSATION_ATTACHMENT only in the caller's PERSONAL collection.
