          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auditEvents:
    get:
      tags:
        - Operations
      operationId: ListPlatformAuditEvents
      summary: List platform-level audit events.
      description: "Platform-only: events not tied to a workspace (e.g. platform sign-ins, account changes). Filter `category`, `actor`, `outcome`, `action`, `target`, `createTime`; orderBy `createTime desc` (default). Workspace events are read via `workspaces/-/auditEvents`. Callers without `auditEvents.list` on the platform → 403.\n"
      x-permission: auditEvents.list
      x-authorization: platform roles only (platformAdmin, platformOperator)
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlatformAuditEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/auditEvents:export:
    post:
      tags:
        - Operations
      operationId: ExportPlatformAuditEvents
      summary: Export platform-level audit events as CSV.
      description: Platform-only counterpart of ExportAuditEvents for events not tied to a workspace; same filters as ListPlatformAuditEvents. Returns an Operation (metadata `WorkspaceExportMetadata` with `target` `auditEvents`, response `WorkspaceExportResponse` with CSV `downloadUri`); the export completes within the request, so the Operation is already `done` (clients must still handle the not-done case). Workspace events are exported with ExportAuditEvents on `workspaces/-`.
      x-permission: auditEvents.export
      x-authorization: platform roles only (platformAdmin, platformOperator)
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportAuditEventsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-operation-info:
        response:
          $ref: '#/components/schemas/WorkspaceExportResponse'
        metadata:
          $ref: '#/components/schemas/WorkspaceExportMetadata'
  /api/v1/auditEvents/{auditEvent}:
    get:
      tags:
        - Operations
      operationId: GetPlatformAuditEvent
      summary: Get a platform-level audit event.
      description: Platform-only. Returns the event; callers without `auditEvents.get` on the platform → 403.
      x-permission: auditEvents.get
      x-authorization: platform roles only (platformAdmin, platformOperator)
      parameters:
        - $ref: '#/components/parameters/PathPlatformAuditEvent'
      responses:
        '200':
          description: The audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAuditEvent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/components:
    get:
      tags:
        - Operations
      operationId: ListComponents
      summary: List platform components and their health.
      description: Services and AI models. Filter `kind`, `state`; orderBy `displayName`, `checkTime`.
      x-permission: components.list
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A page of components.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListComponentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/components/{component}:
    get:
      tags:
        - Operations
      operationId: GetComponent
      summary: Get a platform component.
      description: Returns the component's latest health check.
      x-permission: components.get
      parameters:
        - $ref: '#/components/parameters/PathComponent'
      responses:
        '200':
          description: The component.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/incidents:
    get:
      tags:
        - Operations
      operationId: ListIncidents
      summary: List platform incidents.
      description: Filter `component`, `state`, `errorCategory`, `startTime`; orderBy `startTime desc` (default).
      x-permission: incidents.list
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A page of incidents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIncidentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/incidents/{incident}:
    get:
      tags:
        - Operations
      operationId: GetIncident
      summary: Get a platform incident.
      description: Returns the incident.
      x-permission: incidents.get
      parameters:
        - $ref: '#/components/parameters/PathIncident'
      responses:
        '200':
          description: The incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/operations:
    get:
      tags:
        - Operations
      operationId: ListOperations
      summary: List the caller's long-running operations.
      description: Own operations only. Filter `done`, `metadata.verb` (the starting method's verb, e.g. `createArtifact`) and `metadata.target` (the resource name it acts on); these two are filter-only paths, not fields of the typed metadata. orderBy `metadata.createTime` (default `metadata.createTime desc`).
      x-permission: none
      x-authorization: own operations
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A page of operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOperationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/operations/{operation}:
    get:
      tags:
        - Operations
      operationId: GetOperation
      summary: Poll a long-running operation.
      description: Returns the operation; `response` holds the method's result when done. Operations started by others → 403.
      x-permission: none
      x-authorization: own (the caller started the operation)
      parameters:
        - $ref: '#/components/parameters/PathOperation'
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/operations/{operation}:cancel:
    post:
      tags:
        - Operations
      operationId: CancelOperation
      summary: Request cancellation of an operation.
      description: "Best effort; on success the operation ends with error CANCELLED. Already done → 400 FAILED_PRECONDITION. Not cancellable kind → 400 FAILED_PRECONDITION reason OPERATION_NOT_CANCELLABLE.\n"
      x-permission: none
      x-authorization: own (the caller started the operation)
      parameters:
        - $ref: '#/components/parameters/PathOperation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOperationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: Maximum results to return; default 50, maximum 1000 (larger values are coerced to 1000). Negative is INVALID_ARGUMENT.
      schema:
        type: integer
        format: int32
        minimum: 0
    PageToken:
      name: pageToken
      in: query
      description: Token from a previous response's `nextPageToken`. All other parameters must match the call that produced it.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      description: AIP-160 filter expression. Each List method documents the fields it accepts.
      schema:
        type: string
    OrderBy:
      name: orderBy
      in: query
      description: Comma-separated fields, ascending by default; append " desc" for descending (AIP-132). Each List method documents the fields it accepts.
      schema:
        type: string
    ShowDeleted:
      name: showDeleted
      in: query
      description: Include soft-deleted resources (AIP-164).
      schema:
        type: boolean
        default: false
    View:
      name: view
      in: query
      description: Partial-response view (AIP-157). BASIC omits expensive fields; FULL returns everything. Default BASIC for List, FULL for Get.
      schema:
        $ref: '#/components/schemas/View'
    UpdateMask:
      name: updateMask
      in: query
      description: Comma-separated field paths to update (google.protobuf.FieldMask, AIP-134). Omitted = every populated field; `*` = full replacement.
      schema:
        type: string
    AllowMissing:
      name: allowMissing
      in: query
      description: When true and the resource does not exist, Update creates it (AIP-134).
      schema:
        type: boolean
        default: false
    ValidateOnly:
      name: validateOnly
      in: query
      description: Validate the request and report what would happen without changing anything (AIP-163).
      schema:
        type: boolean
        default: false
    RequestId:
      name: requestId
      in: query
      description: Client-generated UUID that makes the request idempotent (AIP-155). A retry with the same requestId and the same request returns the original result; reusing it for a different request is 400 INVALID_ARGUMENT with reason `REQUEST_ID_REUSED`.
      schema:
        type: string
        format: uuid
    Etag:
      name: etag
      in: query
      description: Current etag of the resource; a mismatch fails with ABORTED (AIP-154).
      schema:
        type: string
    Workspace:
      name: workspace
      in: path
      required: true
      description: Workspace ID.
      schema:
        type: string
    PathUser:
      name: user
      in: path
      required: true
      description: User ID, or the alias `me` for the caller. Responses carry the canonical name.
      schema:
        type: string
    PathSession:
      name: session
      in: path
      required: true
      description: Session ID, or the alias `current` for the session of the presented token. Responses carry the canonical name.
      schema:
        type: string
    PathOperation:
      name: operation
      in: path
      required: true
      description: Operation ID.
      schema:
        type: string
    PathComponent:
      name: component
      in: path
      required: true
      description: Component ID.
      schema:
        type: string
    PathIncident:
      name: incident
      in: path
      required: true
      description: Incident ID.
      schema:
        type: string
    PathPlatformAuditEvent:
      name: auditEvent
      in: path
      required: true
      description: Platform audit event ID.
      schema:
        type: string
    UserLookupEmail:
      name: email
      in: query
      required: true
      description: Exact email address to look up.
      schema:
        type: string
        format: email
    PathMember:
      name: member
      in: path
      required: true
      description: Member ID (= user ID), or `me` for the caller.
      schema:
        type: string
    PathGroup:
      name: group
      in: path
      required: true
      description: Group ID.
      schema:
        type: string
    PathMembership:
      name: membership
      in: path
      required: true
      description: Membership ID.
      schema:
        type: string
    PathRole:
      name: role
      in: path
      required: true
      description: Custom role ID.
      schema:
        type: string
    PathPredefinedRole:
      name: role
      in: path
      required: true
      description: Predefined role ID (e.g. `workspaceAdmin`, `collectionOwner`).
      schema:
        type: string
    PathPermission:
      name: permission
      in: path
      required: true
      description: Permission ID (e.g. `items.publish`, `contributions.review`).
      schema:
        type: string
    PathAuditEvent:
      name: auditEvent
      in: path
      required: true
      description: Audit event ID.
      schema:
        type: string
    PathKnowledgeGap:
      name: knowledgeGap
      in: path
      required: true
      description: Knowledge gap ID.
      schema:
        type: string
    PathShare:
      name: share
      in: path
      required: true
      description: Share ID.
      schema:
        type: string
    WorkspaceOrWildcard:
      name: workspace
      in: path
      required: true
      description: Workspace ID, or `-` to read across all workspaces (platform only, AIP-159).
      schema:
        type: string
    WorkspaceUsageWindow:
      name: window
      in: query
      description: Reporting window as an ISO-8601 period.
      schema:
        type: string
        enum:
          - P1D
          - P7D
          - P30D
        default: P7D
    WorkspaceTimeZone:
      name: timeZone
      in: query
      description: IANA time zone used to bucket days (e.g. `Asia/Ho_Chi_Minh`); default `UTC`.
      schema:
        type: string
    WorkspaceIamPrincipal:
      name: principal
      in: query
      required: true
      description: 'WorkspaceIamPrincipal to analyze: `user:{userId}`, `group:{groupId}` or `workspaceMembers`.'
      schema:
        type: string
    WorkspaceGroupId:
      name: groupId
      in: query
      description: Optional client-chosen group ID (`^[a-z][a-z0-9-]{0,62}$`); server-generated when omitted.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,62}$
    WorkspaceRoleId:
      name: roleId
      in: query
      description: Optional client-chosen custom role ID (`^[a-z][a-zA-Z0-9]{0,62}$`); server-generated when omitted.
      schema:
        type: string
        pattern: ^[a-z][a-zA-Z0-9]{0,62}$
    LibraryPathMember:
      name: member
      in: path
      required: true
      description: Member ID (= user ID) or `me` for the caller.
      schema:
        type: string
    LibraryPathSavedItem:
      name: savedItem
      in: path
      required: true
      description: Saved item ID (= item ID).
      schema:
        type: string
    LibrarySavedItemId:
      name: savedItemId
      in: query
      required: true
      description: The ID to use; must be the item ID of `item`.
      schema:
        type: string
    LibraryPathRecentItem:
      name: recentItem
      in: path
      required: true
      description: Recent item ID (= item ID).
      schema:
        type: string
    LibraryPathSavedSearch:
      name: savedSearch
      in: path
      required: true
      description: Saved search ID.
      schema:
        type: string
    LibraryPathNotification:
      name: notification
      in: path
      required: true
      description: Notification ID.
      schema:
        type: string
    PathItem:
      name: item
      in: path
      required: true
      description: Item ID (UUID).
      schema:
        type: string
    PathItemPassage:
      name: passage
      in: path
      required: true
      description: Passage ID (= chunk ID).
      schema:
        type: string
    PathItemRevision:
      name: revision
      in: path
      required: true
      description: Revision ID (= revision number).
      schema:
        type: string
    ItemAlt:
      name: alt
      in: query
      description: Response representation (Google `alt`). `media` (documents only) answers 302 with `Location` = short-lived signed URL of the original of the current revision instead of the JSON resource.
      schema:
        type: string
        enum:
          - json
          - media
        default: json
    ItemShowLocked:
      name: showLocked
      in: query
      description: Also return discoverable root collections the caller cannot read, in the LOCKED projection.
      schema:
        type: boolean
        default: false
    ItemForce:
      name: force
      in: query
      description: Delete a collection that still has live children, tombstoning its whole live subtree with one `deleteTime`.
      schema:
        type: boolean
        default: false
    ItemPreviewRevision:
      name: revision
      in: query
      description: Revision name (`…/items/{item}/revisions/{revision}`) or revision number to view; default the current revision.
      schema:
        type: string
    PathContribution:
      name: contribution
      in: path
      required: true
      description: Contribution ID.
      schema:
        type: string
    PathTopic:
      name: topic
      in: path
      required: true
      description: Topic ID.
      schema:
        type: string
    TopicId:
      name: topicId
      in: query
      description: Optional client-chosen topic ID; taken → ALREADY_EXISTS (409).
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,62}$
    PathTopicCorrection:
      name: topicCorrection
      in: path
      required: true
      description: Topic correction ID.
      schema:
        type: string
    PathItemShortcut:
      name: shortcut
      in: path
      required: true
      description: Shortcut ID (= the target item's ID; at most one live shortcut per container and target).
      schema:
        type: string
    PathConnector:
      name: connector
      in: path
      required: true
      description: Connector ID.
      schema:
        type: string
    PathConnection:
      name: connection
      in: path
      required: true
      description: Connection ID.
      schema:
        type: string
    PathSource:
      name: source
      in: path
      required: true
      description: Source ID; `-` in List syncs reads across sources.
      schema:
        type: string
    PathSync:
      name: sync
      in: path
      required: true
      description: Sync ID.
      schema:
        type: string
    PathIngestionRun:
      name: ingestionRun
      in: path
      required: true
      description: Ingestion run ID; `-` in ListTasks reads across runs.
      schema:
        type: string
    PathTask:
      name: task
      in: path
      required: true
      description: Task ID; equals the ID of the processed item.
      schema:
        type: string
    PathIngestionPolicy:
      name: ingestionPolicy
      in: path
      required: true
      description: Ingestion policy ID; only `default` exists.
      schema:
        type: string
    ConnectionId:
      name: connectionId
      in: query
      description: Connection ID to use; generated if omitted.
      schema:
        type: string
    SourceId:
      name: sourceId
      in: query
      description: Source ID to use; generated if omitted.
      schema:
        type: string
    ConnectionBrowsePath:
      name: path
      in: query
      description: Provider path to list; empty = root.
      schema:
        type: string
    IngestionWorkspaceOrWildcard:
      name: workspace
      in: path
      required: true
      description: Workspace ID, or `-` (platform callers) to read across workspaces.
      schema:
        type: string
    PathConversation:
      name: conversation
      in: path
      required: true
      description: Conversation ID.
      schema:
        type: string
    PathMessage:
      name: message
      in: path
      required: true
      description: Message ID.
      schema:
        type: string
    PathArtifact:
      name: artifact
      in: path
      required: true
      description: Artifact ID.
      schema:
        type: string
    PathArtifactRevision:
      name: revision
      in: path
      required: true
      description: Artifact revision ID.
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: query
      description: Client-chosen conversation ID (AIP-133), `[a-z0-9-]{1,63}`.
      schema:
        type: string
        pattern: ^[a-z0-9-]{1,63}$
    ArtifactAlt:
      name: alt
      in: query
      description: '`media` downloads the current revision content.'
      schema:
        type: string
        enum:
          - json
          - media
        default: json
    ArtifactExportMimeType:
      name: mimeType
      in: query
      required: true
      description: Target format.
      schema:
        type: string
        enum:
          - text/csv
          - application/pdf
          - text/markdown
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    ArtifactExportRevision:
      name: revision
      in: query
      description: Revision name to export; default current.
      schema:
        type: string
    CollabPathSpace:
      name: space
      in: path
      required: true
      description: Space ID.
      schema:
        type: string
    CollabPathMember:
      name: member
      in: path
      required: true
      description: Space member ID (= user ID).
      schema:
        type: string
    CollabPathMaterial:
      name: material
      in: path
      required: true
      description: Material ID.
      schema:
        type: string
    CollabPathAnnouncement:
      name: announcement
      in: path
      required: true
      description: Announcement ID.
      schema:
        type: string
    CollabPathEvent:
      name: event
      in: path
      required: true
      description: Space event ID.
      schema:
        type: string
    CollabPathRequestType:
      name: requestType
      in: path
      required: true
      description: Request type ID.
      schema:
        type: string
    CollabPathRequest:
      name: request
      in: path
      required: true
      description: Request ID.
      schema:
        type: string
    CollabPathMessage:
      name: message
      in: path
      required: true
      description: Request message ID.
      schema:
        type: string
    CollabSpaceId:
      name: spaceId
      in: query
      description: Optional client-chosen space ID; `^[a-z][a-z0-9-]{0,62}$`. Taken → 409 ALREADY_EXISTS.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,62}$
    CollabRequestTypeId:
      name: requestTypeId
      in: query
      description: Optional client-chosen request type ID; `^[a-z][a-z0-9-]{0,62}$`. Taken → 409 ALREADY_EXISTS.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,62}$
  responses:
    BadRequest:
      description: INVALID_ARGUMENT, FAILED_PRECONDITION or OUT_OF_RANGE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing, expired or revoked access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PermissionDenied:
      description: PERMISSION_DENIED — returned whether or not the resource exists (AIP-211).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — the caller may read the parent but the resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: ALREADY_EXISTS or ABORTED (stale etag, concurrent change).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: RESOURCE_EXHAUSTED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Empty:
      description: Success with an empty body (google.protobuf.Empty).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Empty'
  schemas:
    Empty:
      type: object
      additionalProperties: false
      description: google.protobuf.Empty.
    View:
      type: string
      enum:
        - VIEW_UNSPECIFIED
        - BASIC
        - FULL
    Error:
      type: object
      description: HTTP/JSON representation of google.rpc.Status (AIP-193).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - status
            - details
          properties:
            code:
              type: integer
              description: HTTP status code.
            message:
              type: string
              description: Developer-facing English message.
            status:
              type: string
              enum:
                - INVALID_ARGUMENT
                - FAILED_PRECONDITION
                - OUT_OF_RANGE
                - UNAUTHENTICATED
                - PERMISSION_DENIED
                - NOT_FOUND
                - ALREADY_EXISTS
                - ABORTED
                - RESOURCE_EXHAUSTED
                - CANCELLED
                - INTERNAL
                - UNAVAILABLE
                - DEADLINE_EXCEEDED
                - UNIMPLEMENTED
            details:
              type: array
              description: Always contains one ErrorInfo; may add BadRequest, PreconditionFailure, LocalizedMessage, Help.
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
        - '@type'
      properties:
        '@type':
          type: string
          example: type.googleapis.com/google.rpc.ErrorInfo
        reason:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+[A-Z0-9]$
          description: ErrorInfo reason (UPPER_SNAKE_CASE).
        domain:
          type: string
          example: bomesh.app
        metadata:
          type: object
          additionalProperties:
            type: string
        locale:
          type: string
        message:
          type: string
      additionalProperties: true
    Operation:
      type: object
      description: "google.longrunning.Operation (AIP-151). `response` is set when done without error; its `@type` names the result message. `metadata` is exactly the method's typed metadata message from `x-operation-info` plus `@type` (prefix `type.googleapis.com/bomesh.v1.`); every typed metadata carries `createTime` and `progressPercent`. A cancelled operation is `done` with `error` CANCELLED; an operation whose server restarted before it finished is `done` with `error` UNAVAILABLE. Methods that complete within the request (CreateWorkspace, exports) return an Operation that is already `done`; clients must still handle the not-done case."
      required:
        - name
        - done
      properties:
        name:
          type: string
          example: operations/7c1f0e2a
          readOnly: true
        metadata:
          type: object
          additionalProperties: true
          description: 'The typed metadata message named by the method''s `x-operation-info`, with `@type`.'
        done:
          type: boolean
        error:
          $ref: '#/components/schemas/Status'
        response:
          type: object
          additionalProperties: true
    Status:
      type: object
      description: google.rpc.Status (inside Operation.error).
      properties:
        code:
          type: integer
          description: google.rpc.Code numeric value.
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Policy:
      type: object
      description: IAM policy (google.iam.v1.Policy). Principals are `user:{userId}`, `group:{groupId}` or `workspaceMembers`.
      properties:
        version:
          type: integer
          format: int32
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        etag:
          type: string
          format: byte
    Binding:
      type: object
      required:
        - role
        - members
      properties:
        role:
          type: string
          example: roles/collectionViewer
          description: Predefined `roles/{role}` or custom `workspaces/{workspace}/roles/{role}`.
        members:
          type: array
          items:
            type: string
            example: user:0d6c2c4e
    GetIamPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        options:
          type: object
          properties:
            requestedPolicyVersion:
              type: integer
              format: int32
    SetIamPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - policy
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
        updateMask:
          type: string
    TestIamPermissionsRequest:
      type: object
      additionalProperties: false
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
            example: items.publish
    TestIamPermissionsResponse:
      type: object
      additionalProperties: false
      properties:
        permissions:
          type: array
          items:
            type: string
    Citation:
      type: object
      additionalProperties: false
      description: A grounded reference to a passage.
      required:
        - available
      properties:
        passage:
          type: string
          description: workspaces/{workspace}/items/{item}/passages/{passage}
        item:
          type: string
          description: Name of the cited DOCUMENT item, workspaces/{workspace}/items/{item}
        displayName:
          type: string
        pageNumber:
          type: integer
          format: int32
        excerpt:
          type: string
        available:
          type: boolean
          description: False when the reader can no longer open the document; then only `available` is set.
        outdated:
          type: boolean
          readOnly: true
          description: True when the cited document's current revision was created after the message — the answer was written from an earlier version.
        updateTime:
          type: string
          format: date-time
          readOnly: true
          description: When the cited document's current revision was created.
    ItemKind:
      type: string
      description: Structural kind. COLLECTION holds other items and carries access policies; DOCUMENT holds content. Immutable.
      enum:
        - COLLECTION
        - DOCUMENT
    ItemType:
      type: string
      readOnly: true
      description: 'Classification scoped by `itemKind`; set by the server and immutable. COLLECTION: STANDARD (created by clients) or PERSONAL (a member''s "My files", created by the server). DOCUMENT: the file class of its content, derived from the validated MIME type and file name — PDF (application/pdf), WORD (DOCX, DOC), PRESENTATION (PPTX, PPT), SPREADSHEET (XLSX, XLS, CSV, TSV), MARKDOWN (MD, Markdown, RST), HTML (HTML, HTM), PLAIN_TEXT (TXT, LOG, SQL and other text/*), DATA (JSON, JSONL, XML, YAML), IMAGE (image/*), AUDIO (audio/*), VIDEO (video/*), ARCHIVE (ZIP), OTHER (anything else). Every revision of a document has the same file class; content of another class is refused with reason ITEM_TYPE_MISMATCH. Not a business taxonomy (use topics).'
      enum:
        - STANDARD
        - PERSONAL
        - PDF
        - WORD
        - PRESENTATION
        - SPREADSHEET
        - MARKDOWN
        - HTML
        - PLAIN_TEXT
        - DATA
        - IMAGE
        - AUDIO
        - VIDEO
        - ARCHIVE
        - OTHER
    ItemState:
      type: string
      readOnly: true
      description: Item lifecycle (AIP-164). DELETED items are hidden unless showDeleted=true and are purged at purgeTime.
      enum:
        - ACTIVE
        - DELETED
    ContentState:
      type: string
      readOnly: true
      description: Availability of a Document's stored original. PENDING until the bytes are confirmed; FAILED when the stored object did not validate. Independent of publication and indexing.
      enum:
        - PENDING
        - AVAILABLE
        - FAILED
    PublicationState:
      type: string
      readOnly: true
      description: Who sees a Document in its governing collection. PUBLISHED = every reader; UNPUBLISHED = only holders of items.update there. Independent of review, content and indexing.
      enum:
        - PUBLISHED
        - UNPUBLISHED
    IndexingState:
      type: string
      readOnly: true
      description: Processing of a Document, independent of publication. OUTDATED = indexed with an older processing configuration; UNSUPPORTED = kept but never processed.
      enum:
        - PENDING
        - RUNNING
        - SUCCEEDED
        - FAILED
        - OUTDATED
        - UNSUPPORTED
    VerificationState:
      type: string
      readOnly: true
      description: Trust shown to readers. REVIEW_DUE = verification expired or the source changed after publication.
      enum:
        - VERIFIED
        - REVIEW_DUE
        - UNVERIFIED
    ItemAccess:
      type: string
      readOnly: true
      description: The caller's effective access to an item, from roles on its governing collections. LOCKED = a discoverable root collection the caller cannot read (only name, displayName, description and ownerSummary are returned; never counts).
      enum:
        - READER
        - EDITOR
        - OWNER
        - LOCKED
    ContributionState:
      type: string
      readOnly: true
      enum:
        - ANALYZING
        - IN_REVIEW
        - CHANGES_REQUESTED
        - APPROVED
        - REJECTED
        - WITHDRAWN
    User:
