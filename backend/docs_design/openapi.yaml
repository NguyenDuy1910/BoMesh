          description: User-safe cause, e.g. ITEM_TYPE_MISMATCH when a new version has another file class than the document's `itemType` (the version is not appended).
    IngestionTask:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Resource name `workspaces/{workspace}/ingestionRuns/{ingestionRun}/tasks/{task}`; task ID = item ID.
          readOnly: true
        item:
          type: string
          readOnly: true
          description: Item name (`workspaces/{workspace}/items/{item}`) of the DOCUMENT item being processed; the task ID equals the item ID. Omitted for platform callers.
        revision:
          type: string
          readOnly: true
          description: Item revision name (`workspaces/{workspace}/items/{item}/revisions/{revision}`) this task processed, recorded when the task starts. If the item's current revision or governing collection changed while the task ran, the task still finishes, but the item's `indexingState` stays PENDING and its index metadata is re-applied. Omitted for platform callers.
        state:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
          readOnly: true
        phase:
          type: string
          enum:
            - QUEUED
            - FETCHING
            - PARSING
            - OCR
            - CLASSIFYING
            - CHUNKING
            - EMBEDDING
            - INDEXING
          readOnly: true
        phases:
          type: array
          items:
            $ref: '#/components/schemas/IngestionTaskPhase'
          readOnly: true
        error:
          $ref: '#/components/schemas/Status'
          readOnly: true
        errorClass:
          type: string
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        startTime:
          type: string
          format: date-time
          readOnly: true
        endTime:
          type: string
          format: date-time
          readOnly: true
    ListIngestionTasksResponse:
      type: object
      additionalProperties: false
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/IngestionTask'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
    Conversation:
      type: object
      additionalProperties: false
      description: Owner-private chat thread.
      properties:
        name:
          type: string
          readOnly: true
          description: workspaces/{workspace}/conversations/{conversation}
        displayName:
          type: string
        owner:
          type: string
          readOnly: true
          description: workspaces/{workspace}/members/{member}
        pinned:
          type: boolean
        scope:
          $ref: '#/components/schemas/ConversationScope'
        lastMessageTime:
          type: string
          format: date-time
          readOnly: true
        lastAnswerSnippet:
          type: string
          readOnly: true
          description: The first 300 characters of the text of the latest COMPLETED assistant message (raw markdown), for list previews without a ListMessages call per conversation; omitted when the conversation has no completed answer.
        outdatedSources:
          type: array
          readOnly: true
          description: Readable documents cited by the conversation's current answers whose current revision is newer than the citing answer (Citation.outdated), most recent change first. Empty when every answer is current.
          items:
            type: object
            additionalProperties: false
            readOnly: true
            properties:
              item:
                type: string
                readOnly: true
                description: workspaces/{workspace}/items/{item} (a DOCUMENT).
              displayName:
                type: string
                readOnly: true
              updateTime:
                type: string
                format: date-time
                readOnly: true
                description: When its current revision was created.
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        deleteTime:
          type: string
          format: date-time
          readOnly: true
        purgeTime:
          type: string
          format: date-time
          readOnly: true
    ConversationScope:
      type: object
      additionalProperties: false
      description: 'Grounding scope; empty = every item the caller can read. Every entry must be readable by the caller, else 403 PERMISSION_DENIED on Create/UpdateConversation. "Readable" means the Item visibility rule: the item is ACTIVE, every ancestor is ACTIVE, the caller holds `items.get` on its governing collection, and it is PUBLISHED or the caller holds `items.update` there. The contribution-reviewer exception does not apply: a reviewer cannot use a candidate draft they may only review.'
      properties:
        collections:
          type: array
          items:
            type: string
            description: Name of a COLLECTION item (`workspaces/{workspace}/items/{item}`); its whole subtree is in scope. A DOCUMENT item is 400 INVALID_ARGUMENT.
        spaces:
          type: array
          items:
            type: string
            description: 'workspaces/{workspace}/spaces/{space}; puts the space''s readable materials (`spaces/{space}/materials`) in scope: COLLECTION materials with their subtrees, DOCUMENT materials as single documents.'
    ListConversationsResponse:
      type: object
      additionalProperties: false
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
    UndeleteConversationRequest:
      type: object
      additionalProperties: false
      properties: {}
    ConverseRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        attachments:
          type: array
          items:
            type: string
            description: "Item name of a DOCUMENT (`workspaces/{workspace}/items/{item}`), typically a CONVERSATION_ATTACHMENT in the caller's PERSONAL collection; must be readable by the caller, else 403. \"Readable\" means the Item visibility rule: the item is ACTIVE, every ancestor is ACTIVE, the caller holds `items.get` on its governing collection, and it is PUBLISHED or the caller holds `items.update` there. The contribution-reviewer exception does not apply: a reviewer cannot use a candidate draft they may only review."
        replaceFromMessage:
          type: string
          description: workspaces/{workspace}/conversations/{conversation}/messages/{message}; that message and later ones are replaced.
    Message:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          readOnly: true
          description: workspaces/{workspace}/conversations/{conversation}/messages/{message}
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
          readOnly: true
        text:
          type: string
          readOnly: true
        citations:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Citation'
          description: Passages (`workspaces/{workspace}/items/{item}/passages/{passage}`) grounding the text.
        artifacts:
          type: array
          readOnly: true
          items:
            type: string
            description: workspaces/{workspace}/artifacts/{artifact}
        state:
          type: string
          enum:
            - COMPLETED
            - INTERRUPTED
            - FAILED
          readOnly: true
        feedback:
          $ref: '#/components/schemas/MessageFeedback'
        createTime:
          type: string
          format: date-time
          readOnly: true
        available:
          type: boolean
          readOnly: true
          description: Set (false) only for a shared reader when this turn cites a source they cannot read now; then only `name`, `role`, `state` and `createTime` are set.
    MessageFeedback:
      type: object
      additionalProperties: false
      description: Output only; set with :submitFeedback.
      properties:
        rating:
          type: string
          enum:
            - HELPFUL
            - UNHELPFUL
        reason:
          type: string
        comment:
          type: string
        createTime:
          type: string
          format: date-time
          readOnly: true
    ListMessagesResponse:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
    SubmitMessageFeedbackRequest:
      type: object
      additionalProperties: false
      required:
        - rating
      properties:
        rating:
          type: string
          enum:
            - HELPFUL
            - UNHELPFUL
            - RATING_UNSPECIFIED
          description: RATING_UNSPECIFIED clears.
        reason:
          type: string
        comment:
          type: string
    Artifact:
      type: object
      additionalProperties: false
      description: 'Assistant-made file or Work output. An artifact is its own Assistant resource (`workspaces/{workspace}/artifacts/{artifact}`): its storage row in the items table lives in a hidden per-member system collection that the items API (Get/List/SearchItems, ingestion) never returns. Publishing it into knowledge creates a separate DOCUMENT item (PublishArtifact).'
      properties:
        name:
          type: string
          readOnly: true
          description: workspaces/{workspace}/artifacts/{artifact}
        displayName:
          type: string
        kind:
          type: string
          enum:
            - FILE
            - DRAFT
            - EVIDENCE_REVIEW
            - STUDY_GUIDE
            - QUIZ
        mimeType:
          type: string
          readOnly: true
        owner:
          type: string
          readOnly: true
          description: workspaces/{workspace}/members/{member}
        conversation:
          type: string
          description: workspaces/{workspace}/conversations/{conversation}
        space:
          type: string
          description: workspaces/{workspace}/spaces/{space}
        audience:
          type: string
          enum:
            - PRIVATE
            - SPACE
          description: PRIVATE (owner only) or SPACE (members of `space`). Setting SPACE on Create or Update requires every source item to be readable by all space members, else 400 FAILED_PRECONDITION reason AUDIENCE_CANNOT_READ_SOURCES.
        sourceItems:
          type: array
          items:
            type: string
            description: 'Item name of a DOCUMENT (`workspaces/{workspace}/items/{item}`); only those readable to the caller are returned (see `hiddenSourceCount`). On create each must be readable by the caller (403 otherwise). "Readable" means the Item visibility rule: the item is ACTIVE, every ancestor is ACTIVE, the caller holds `items.get` on its governing collection, and it is PUBLISHED or the caller holds `items.update` there. The contribution-reviewer exception does not apply: a reviewer cannot use a candidate draft they may only review.'
        hiddenSourceCount:
          type: integer
          format: int32
          readOnly: true
          description: Source items withheld because the caller cannot read them now.
        evidenceReview:
          allOf:
            - $ref: '#/components/schemas/EvidenceReview'
          description: 'Evidence review (kind EVIDENCE_REVIEW). Filtered per reader on every read: cells and the synthesis citing items the caller cannot read now are replaced by placeholders (`available: false` / `synthesisAvailable: false`).'
        state:
          type: string
          enum:
            - GENERATING
            - ACTIVE
            - FAILED
            - DELETED
          readOnly: true
        revision:
          type: string
          readOnly: true
          description: Current revision name.
        etag:
          type: string
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        deleteTime:
          type: string
          format: date-time
          readOnly: true
        purgeTime:
          type: string
          format: date-time
          readOnly: true
        generationInstructions:
          type: string
          writeOnly: true
          description: 'Input only: instructions for the assistant on CreateArtifact.'
    EvidenceReview:
      type: object
      additionalProperties: false
      description: Options × criteria matrix (kind EVIDENCE_REVIEW).
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceReviewOption'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceReviewCriterion'
        cells:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/EvidenceReviewCell'
        synthesis:
          type: string
          readOnly: true
        synthesisAvailable:
          type: boolean
          readOnly: true
          description: False when the synthesis was withheld because it cites sources the caller cannot read now; `synthesis` is then empty.
    EvidenceReviewOption:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
        displayName:
          type: string
        description:
          type: string
    EvidenceReviewCriterion:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
        displayName:
          type: string
        description:
          type: string
    EvidenceReviewCell:
      type: object
      additionalProperties: false
      properties:
        option:
          type: string
          description: Option key.
        criterion:
          type: string
          description: Criterion key.
        state:
          type: string
          enum:
            - GENERATING
            - SUPPORTED
            - PARTIAL
            - NOT_FOUND
            - FAILED
          readOnly: true
        summary:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        available:
          type: boolean
          readOnly: true
          description: False when the cell was withheld because the caller cannot read its cited sources now; then only `option`, `criterion` and `available` are set.
