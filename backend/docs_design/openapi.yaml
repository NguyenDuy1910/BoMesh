    CollectionFacet:
      type: object
      description: 'Facet of a COLLECTION item (UX: a root collection is a "knowledge base"). Its type (STANDARD or PERSONAL) is `Item.itemType`.'
      properties:
        owner:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`. PERSONAL collections only.
          readOnly: true
        ownerSummary:
          type: string
          description: E.g. "Owned by Legal". Also set on LOCKED projections.
          readOnly: true
        description:
          type: string
        inheritAccess:
          type: boolean
          description: 'Nested collections only: inherit access from the parent. Roots are always access boundaries and read `false`. Changing it also needs `items.setIamPolicy`.'
        discoverable:
          type: boolean
          description: 'Roots only: members who cannot read it see it as LOCKED (and may request COLLECTION_ACCESS).'
        acceptsContributions:
          type: boolean
        childCount:
          type: integer
          format: int32
          description: Live direct children the caller can see. Shortcuts are not counted.
          readOnly: true
        documentCount:
          type: integer
          format: int32
          description: Published readable documents in the subtree; omitted for LOCKED. Shortcuts are not counted.
          readOnly: true
        shortcutCount:
          type: integer
          format: int32
          readOnly: true
          description: Live shortcuts in this container whose target the caller can see; omitted for LOCKED.
      additionalProperties: false
    ItemVerification:
      type: object
      description: Set by VerifyItem.
      properties:
        state:
          $ref: '#/components/schemas/VerificationState'
        verifier:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`.
          readOnly: true
        verifyTime:
          type: string
          format: date-time
          readOnly: true
        nextReviewTime:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    ItemOrigin:
      type: object
      description: Where the file came from.
      properties:
        source:
          type: string
          description: Source name `workspaces/{workspace}/sources/{source}`; empty for uploads. Set = source-managed.
        externalUri:
          type: string
        path:
          type: string
        sourceUpdateTime:
          type: string
          format: date-time
      additionalProperties: false
    ItemQualityIssue:
      type: object
      properties:
        kind:
          type: string
          enum:
            - REVIEW_DUE
            - MISSING_DETAILS
            - POSSIBLE_DUPLICATE
            - CHANGED_AT_SOURCE
        relatedItem:
          type: string
          description: An Item name. Returned only when the caller can see that item under the visibility rule (every caller, reviewers too); the issue kind stays.
      additionalProperties: false
    DocumentCover:
      type: object
      readOnly: true
      description: 'What the first page of the current revision looks like, so a list draws a document without reading its content. Produced by the ingestion worker when the content arrives (not by processing) and dropped when approval, a new revision or rollback changes the current revision. Absent while it is not produced yet or when the format has nothing to show: the client draws the format''s typed tile. Never a page count. `imageUri` wins over the text fields when present.'
      properties:
        kind:
          type: string
          readOnly: true
          enum:
            - PAGE
            - SLIDE
            - SHEET
            - TEXT
            - IMAGE
          description: The first page's shape. PAGE a paper page (PDF, DOCX), SLIDE a 16:9 slide (PPTX), SHEET a grid (XLSX, CSV), TEXT plain lines (TXT, Markdown, HTML), IMAGE the picture itself.
        imageUri:
          type: string
          format: uri
          readOnly: true
          description: Short-lived signed URL of a small WebP (at most 480 px wide) of the first page, slide or image, when one exists. The object is immutable; the URL is stable within its signing window so browsers reuse it.
        widthPixels:
          type: integer
          format: int32
          readOnly: true
          description: Width of the `imageUri` image.
        heightPixels:
          type: integer
          format: int32
          readOnly: true
          description: Height of the `imageUri` image.
        title:
          type: string
          maxLength: 200
          readOnly: true
          description: First heading or slide title, when known; the image's alt text.
        lines:
          type: array
          maxItems: 8
          readOnly: true
          items:
            type: string
            maxLength: 160
          description: The first page's or slide's opening lines (480 characters together at most); only without `imageUri`.
        cells:
          type: array
          maxItems: 6
          readOnly: true
          items:
            type: array
            maxItems: 5
            items:
              type: string
              maxLength: 40
          description: 'SHEET without `imageUri`: the first sheet''s top-left cells, row by row (at most 6 rows of 5).'
      additionalProperties: false
    DocumentFacet:
      type: object
      description: Facet of a DOCUMENT item. Review, publication (`publicationState`), content availability (`contentState`) and indexing (`indexingState`) are independent.
      properties:
        fileName:
          type: string
          description: 'File name. Input on create only (mimeType required; sizeBytes required for the signed-upload flow); read-only afterwards: follows the current revision (approval of a NEW_REVISION and rollback update it).'
        mimeType:
          type: string
          description: 'MIME type. Input on create only (mimeType required; sizeBytes required for the signed-upload flow); read-only afterwards: follows the current revision (approval of a NEW_REVISION and rollback update it).'
        sizeBytes:
          type: string
          format: int64
          description: 'Size in bytes (int64 as string). Input on create only (mimeType required; sizeBytes required for the signed-upload flow); read-only afterwards: follows the current revision (approval of a NEW_REVISION and rollback update it).'
        purpose:
          type: string
          enum:
            - KNOWLEDGE
            - CONVERSATION_ATTACHMENT
          description: Immutable. CONVERSATION_ATTACHMENT only in the caller's PERSONAL collection.
          default: KNOWLEDGE
        topics:
          type: array
          items:
            type: string
            description: Topic name `workspaces/{workspace}/topics/{topic}`.
          description: Topic names; a person's topics and the assistant's (see `assistantTopics`).
        assistantTopics:
          type: array
          items:
            type: string
            description: Topic name `workspaces/{workspace}/topics/{topic}`.
          description: The subset of `topics` the assistant applied when the document was processed (CLASSIFYING) and no person has set or confirmed; UpdateItem `document.topics` and ConfirmTopicAssignments make them a person's.
          readOnly: true
        summary:
          type: string
        languageCode:
          type: string
          description: BCP-47.
        owner:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`. Accountable for the content.
        contentState:
          $ref: '#/components/schemas/ContentState'
        publicationState:
          $ref: '#/components/schemas/PublicationState'
        collectionKind:
          type: string
          enum:
            - STANDARD
            - PERSONAL
          description: 'Kind of the collection tree the document lives in: STANDARD = the workspace''s shared knowledge; PERSONAL = a member''s "My files", their private scope (uploads and contribution drafts). Browse lists only STANDARD, PUBLISHED documents that finished processing.'
          readOnly: true
        indexingState:
          $ref: '#/components/schemas/IndexingState'
        indexingError:
          $ref: '#/components/schemas/Status'
          readOnly: true
        lastIngestionRun:
          type: string
          description: '`workspaces/{workspace}/ingestionRuns/{ingestionRun}`.'
          readOnly: true
        revision:
          type: string
          description: Current revision `workspaces/{workspace}/items/{item}/revisions/{revision}`.
          readOnly: true
        indexedRevision:
          type: string
          readOnly: true
          description: Revision name the passages and citations belong to (may lag `revision` while indexing is PENDING/RUNNING).
        verification:
          $ref: '#/components/schemas/ItemVerification'
          readOnly: true
        origin:
          $ref: '#/components/schemas/ItemOrigin'
          readOnly: true
        qualityIssues:
          type: array
          items:
            $ref: '#/components/schemas/ItemQualityIssue'
          description: Editors only (`items.update`); empty for readers.
          readOnly: true
        cover:
          $ref: '#/components/schemas/DocumentCover'
        uploadUri:
          type: string
          description: 'Signed upload URL; only while `contentState: PENDING`, creator only.'
          readOnly: true
      additionalProperties: false
    Item:
      type: object
      description: "One node of the workspace knowledge tree: a COLLECTION (holds items, carries access policies) or a DOCUMENT (holds content). Exactly one facet, matching `itemKind`; `itemType` classifies it within its kind. Visibility rule: a caller sees a document iff it is ACTIVE, every ancestor is ACTIVE, the caller holds `items.get` on its governing collection (nearest COLLECTION ancestor; access inherits downward until a collection with `inheritAccess=false`; roots are always boundaries), and it is PUBLISHED or the caller holds `items.update` there. Throughout the API, \"visible\"/\"readable\" means this rule: List, Search, counts, saved and recent items, space materials, artifacts, attachments, move, merge and every reference. Reviewer exception — applies ONLY to GetItem, GetItemPreview and `alt=media`: holders of `contributions.review` for an open contribution may read that contribution's candidate item through those three calls; nowhere else. Deleted items: only holders of `items.undelete` (resolved through the deleted cohort's ancestors; the published rule still applies) see DELETED items, via `showDeleted` or Get. LOCKED projection: a discoverable root collection the caller cannot read is returned with only name, itemKind, itemType, displayName, `collection.description`, `collection.ownerSummary` and `access: LOCKED`; it never carries counts. Item shortcuts (`…/items/{item}/shortcuts`) are references, not hierarchy."
      properties:
        name:
          type: string
          description: An Item name `workspaces/{workspace}/items/{item}`.
          readOnly: true
        itemKind:
          $ref: '#/components/schemas/ItemKind'
          description: Required on create; immutable.
        itemType:
          $ref: '#/components/schemas/ItemType'
        displayName:
          type: string
          description: Required; at most 512 characters.
          maxLength: 512
        parentItem:
          type: string
          description: Item name of a COLLECTION (or, server-written only, a DOCUMENT); empty = root. Required for DOCUMENT. Set on create, immutable afterwards — use MoveItem. Item shortcuts never change it.
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/ItemAncestor'
          description: 'View FULL only. Root first. Truncation: only collections the caller can read, plus discoverable roots as LOCKED. Item shortcuts are not ancestors.'
          readOnly: true
        access:
          $ref: '#/components/schemas/ItemAccess'
        state:
          $ref: '#/components/schemas/ItemState'
        creator:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`.
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        deleteTime:
          type: string
          format: date-time
          readOnly: true
        purgeTime:
          type: string
          format: date-time
          readOnly: true
        etag:
          type: string
        collection:
          $ref: '#/components/schemas/CollectionFacet'
        document:
          $ref: '#/components/schemas/DocumentFacet'
      allOf:
        - if:
            required:
              - itemKind
            properties:
              itemKind:
                const: COLLECTION
          then:
            properties:
              document: false
        - if:
            required:
              - itemKind
            properties:
              itemKind:
                const: DOCUMENT
          then:
            properties:
              collection: false
    ListItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
      additionalProperties: false
    CreateItemMediaRequest:
      type: object
      required:
        - metadata
        - file
      properties:
        metadata:
          $ref: '#/components/schemas/Item'
          description: The Item JSON (part `metadata`).
        file:
          type: string
          format: binary
      additionalProperties: false
    CompleteItemUploadRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    SearchItemsFacetSpec:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          description: 'Facet field: `ancestors`, `itemType`, `document.topics`, `document.owner`, `document.origin.source`, `document.mimeType`, `document.languageCode`, `document.verification.state`, `updateTime` (interval facet: needs `intervals`). `ancestors` values use the same truncation as `Item.ancestors`: Truncation: only collections the caller can read, plus discoverable roots as LOCKED. `document.topics` is hierarchical like its filter: a DOMAIN counts the documents tagged with it or with any topic under it (each document once).'
        limit:
          type: integer
          format: int32
          description: Max values (default 10); ignored for interval facets.
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/SearchItemsInterval'
          description: Interval facet buckets (Vertex AI Search `FacetKey.intervals`); required for `updateTime` and refused (INVALID_ARGUMENT) for other fields. Every interval returns one value, in request order, with its bounds in `interval` and its count (0 included); intervals may overlap.
        excludedFromFilter:
          type: boolean
          default: true
          description: "Disjunctive: the facet's own filter clause is ignored when counting it."
      additionalProperties: false
    SearchItemsInterval:
      type: object
      properties:
        minimum:
          type: string
          format: date-time
          description: Inclusive lower bound; unset = unbounded.
        maximum:
          type: string
          format: date-time
          description: Inclusive upper bound; unset = unbounded. At least one bound is required, and `minimum` must not be after `maximum`.
      additionalProperties: false
      description: A range of field values (RFC 3339 timestamps for `updateTime`).
    SearchItemsContentSearchSpec:
      type: object
      properties:
        snippets:
          type: boolean
          description: Return highlighted snippets.
        passages:
          type: integer
          format: int32
          minimum: 0
          description: Max passages per result (assistant retrieval); 0 = none.
      additionalProperties: false
    SearchItemsRequest:
      type: object
      properties:
        query:
          type: string
        filter:
          type: string
          description: AIP-160, same fields as ListItems; `ancestors:` scopes to subtrees.
        facetSpecs:
          type: array
          items:
            $ref: '#/components/schemas/SearchItemsFacetSpec'
        orderBy:
          type: string
          description: Empty = relevance; else as ListItems.
        relatedItem:
          type: string
          description: An Item name `workspaces/{workspace}/items/{item}`. Returns documents related to it (Related panel); needs `items.get` on it.
        contentSearchSpec:
          $ref: '#/components/schemas/SearchItemsContentSearchSpec'
        pageSize:
          type: integer
          format: int32
        pageToken:
          type: string
      additionalProperties: false
    SearchItemsPassage:
      type: object
      properties:
        passage:
          type: string
          description: '`workspaces/{workspace}/items/{item}/passages/{passage}`.'
        text:
          type: string
        pageNumber:
          type: integer
          format: int32
        score:
          type: number
      additionalProperties: false
    SearchItemsResult:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/Item'
        snippets:
          type: array
          items:
            type: string
        passages:
          type: array
          items:
            $ref: '#/components/schemas/SearchItemsPassage'
        score:
          type: number
      additionalProperties: false
    SearchItemsFacetValue:
      type: object
      properties:
        value:
          type: string
          description: The field value (a resource name for references); unset for interval facets.
        interval:
          $ref: '#/components/schemas/SearchItemsInterval'
          description: The requested interval, for interval facets (instead of `value`).
        displayName:
          type: string
          description: Label of a reference value, so clients need no read per value — a topic's name, a collection's title, an owner's display name (else email; absent once they are no longer a member).
        documentCount:
          type: integer
          format: int32
          description: Matching documents the caller can see (disjunctive).
      additionalProperties: false
    SearchItemsFacet:
      type: object
      properties:
        field:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/SearchItemsFacetValue'
      additionalProperties: false
      description: 'Facet values; for `ancestors`, Truncation: only collections the caller can read, plus discoverable roots as LOCKED.'
    SearchItemsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchItemsResult'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/SearchItemsFacet'
        totalSize:
          type: integer
          format: int32
        nextPageToken:
          type: string
      additionalProperties: false
    UndeleteItemRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    MoveItemRequest:
      type: object
      required:
        - destinationParent
      properties:
        destinationParent:
          type: string
          description: Name of a COLLECTION item, or the workspace name `workspaces/{workspace}` to make a collection a root.
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    PublishItemRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    UnpublishItemRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    VerifyItemRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    MergeItemRequest:
      type: object
      required:
        - targetItem
      properties:
        targetItem:
          type: string
          description: An Item name `workspaces/{workspace}/items/{item}`. The DOCUMENT to keep.
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    CollectionImportRow:
      type: object
      description: 'One folder of the file, named the way people name folders: no IDs. `path` holds the display names from the import''s collection down to the folder; each segment is trimmed and matches a readable live child COLLECTION by name, case- and whitespace-insensitive. Segments that do not exist are created, parents first.'
      required:
        - path
      properties:
        path:
          type: array
          minItems: 1
          items:
            type: string
          description: Display names from the collection down to the folder, e.g. `["Faculty of IT", "Slides"]`. 1 to 512 characters each after trimming and at most 8 segments, else the row is skipped.
        description:
          type: string
          maxLength: 2000
          description: Description of the folder when this row creates it; ignored for a folder that already exists.
      additionalProperties: false
    ImportCollectionsRequest:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CollectionImportRow'
          description: In file order (depth-first, parents before children); more than 1000 → INVALID_ARGUMENT.
        validateOnly:
          type: boolean
          description: Report what the import would do; change nothing.
      additionalProperties: false
    CollectionImportChange:
      type: object
      description: One folder an import creates, named the way the file names it.
      properties:
        item:
          type: string
          description: The new Item's name `workspaces/{workspace}/items/{item}`; absent with `validateOnly`.
        path:
          type: array
          items:
            type: string
          description: Display names from the import's collection down to the folder, as the file writes them (trimmed).
        row:
          type: integer
          format: int32
          description: 1-based position in `rows` naming this folder (a later row naming a folder first created only as an intermediate claims it, and that row's `description` applies); absent for an intermediate folder no row names.
      additionalProperties: false
    CollectionImportSkippedRow:
      type: object
      properties:
        row:
          type: integer
          format: int32
          description: 1-based position in `rows`.
        reason:
          type: string
          description: Why the row was skipped, one of the fixed English reasons of ImportCollections.
      additionalProperties: false
    ImportCollectionsResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/CollectionImportChange'
          description: In creation order, parents before children.
        unchangedCount:
          type: integer
          format: int32
          description: Rows whose full path already existed before the import (a path an earlier row of the file names is skipped instead).
        skippedRows:
          type: array
          items:
            $ref: '#/components/schemas/CollectionImportSkippedRow'
      additionalProperties: false
    ItemPageAsset:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        imageUri:
          type: string
          description: Signed, short-lived.
          readOnly: true
        widthPixels:
          type: integer
          format: int32
        heightPixels:
          type: integer
          format: int32
      additionalProperties: false
    ItemPreview:
      type: object
      description: How to show a document's file (singleton, output only), from the preview engine (document_viewer.md). The engine turns every supported format into one of six representations, so a viewer only knows those six. Independent of processing; read from PostgreSQL and object storage only, never from the search index, and never converting in the request.
      properties:
        name:
          type: string
          description: '`workspaces/{workspace}/items/{item}/preview`.'
          readOnly: true
        revision:
          type: string
          description: Revision shown (`workspaces/{workspace}/items/{item}/revisions/{revision}`).
          readOnly: true
        state:
          type: string
          enum:
            - READY
            - PREPARING
            - UNAVAILABLE
          description: 'READY: draw `representation`. PREPARING: the representation is being made (the engine usually makes it when the content arrives; this read asked for it too) — poll again in a couple of seconds. UNAVAILABLE: nothing to draw (see `unavailableReason`); `original` still downloads the file.'
          readOnly: true
        unavailableReason:
          type: string
          enum:
            - FORMAT_NOT_SUPPORTED
            - TOO_LARGE
            - CONVERSION_FAILED
          description: Set only when `state` is UNAVAILABLE. CONVERSION_FAILED is a property of this revision's file (not retried until its content changes).
          readOnly: true
        representation:
          $ref: '#/components/schemas/ItemRepresentation'
        original:
          $ref: '#/components/schemas/ItemPreviewFile'
      additionalProperties: false
    ItemRepresentation:
      type: object
      readOnly: true
      description: 'What the viewer draws; present only when READY. `kind` is the only branch a viewer takes. PDF: a PDF (the original, or the file converted to PDF) read page by page with `Range`. IMAGE: a picture the browser shows as is. TABLE: gzip JSON `application/vnd.bomesh.table+json` (sheets of rows, bounded). TEXT: UTF-8 text (bounded), `textFormat` MARKDOWN or PLAIN, `language` a hint for code. MEDIA: a file the browser plays (`mediaType` VIDEO or AUDIO). ARCHIVE: gzip JSON `application/vnd.bomesh.archive+json` (the entry list).'
      properties:
        kind:
          type: string
          enum:
            - PDF
            - IMAGE
            - TABLE
            - TEXT
            - MEDIA
            - ARCHIVE
          readOnly: true
        uri:
          type: string
          description: Signed GET URL; for a representation the engine made, the object is immutable and the URL stays the same within its signing window, so the browser cache serves repeat opens. A 403 from storage means it expired; read the preview again.
          readOnly: true
        mimeType:
          type: string
          readOnly: true
        sizeBytes:
          type: string
          format: int64
          readOnly: true
        expireTime:
          type: string
          format: date-time
          readOnly: true
        textFormat:
          type: string
          enum:
            - MARKDOWN
            - PLAIN
          description: TEXT only.
          readOnly: true
        language:
          type: string
          description: TEXT only, optional; the file's language for monospaced code (`json`, `python`, `sql` …).
          readOnly: true
        mediaType:
          type: string
          enum:
            - VIDEO
            - AUDIO
          description: MEDIA only.
          readOnly: true
        truncated:
          type: boolean
          description: TEXT, TABLE and ARCHIVE only; true when the file is larger than the representation's bounds (the viewer points at `original`).
          readOnly: true
      additionalProperties: false
    ItemPreviewFile:
      type: object
      readOnly: true
      description: The revision's original file in object storage (the same object `alt=media` redirects to), for download.
      properties:
        uri:
          type: string
          description: Signed GET URL.
          readOnly: true
        mimeType:
          type: string
          readOnly: true
        sizeBytes:
          type: string
          format: int64
          readOnly: true
        expireTime:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    ItemRendition:
      type: object
      readOnly: true
      description: Whole-document rendition (`application/vnd.bomesh.document+json`, gzip-encoded) of a conversation artifact's revision, fetched directly from object storage. Knowledge documents are shown through ItemPreview representations instead.
      properties:
        uri:
          type: string
          description: Signed, short-lived GET URL.
          readOnly: true
        version:
          type: integer
          format: int32
          description: Rendition format version; clients cache by item, revision and version.
          readOnly: true
        sizeBytes:
          type: string
          format: int64
          description: Compressed size (int64 as string).
          readOnly: true
        blockCount:
          type: integer
          format: int32
          readOnly: true
        truncated:
          type: boolean
          description: True when the rendition hit its size bounds; the viewer shows a truncation notice.
          readOnly: true
      additionalProperties: false
    ItemPassageBoundingBox:
      type: object
      description: Normalized 0–1 page coordinates.
      properties:
        pageNumber:
          type: integer
          format: int32
        left:
          type: number
        top:
          type: number
        width:
          type: number
        height:
          type: number
      additionalProperties: false
    ItemPassage:
      type: object
      description: A citation target.
      properties:
        name:
          type: string
          description: '`workspaces/{workspace}/items/{item}/passages/{passage}`; passage ID = chunk ID.'
          readOnly: true
        text:
          type: string
          readOnly: true
        pageNumber:
          type: integer
          format: int32
          readOnly: true
        boundingBoxes:
          type: array
