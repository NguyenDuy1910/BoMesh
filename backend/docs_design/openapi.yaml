          type: string
      additionalProperties: false
    ItemRevision:
      type: object
      description: A stored version of a document (AIP-162).
      properties:
        name:
          type: string
          description: '`workspaces/{workspace}/items/{item}/revisions/{revision}`; revision ID = revision number.'
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        mimeType:
          type: string
          readOnly: true
        sizeBytes:
          type: string
          format: int64
          description: Size of the stored object (int64 as string).
          readOnly: true
        changeSummary:
          type: string
          readOnly: true
        contribution:
          type: string
          description: Contribution that produced it, if any.
          readOnly: true
        creator:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`.
          readOnly: true
        externalVersion:
          type: string
          description: Version at the source, for source-managed documents.
          readOnly: true
        restoredFrom:
          type: string
          description: Revision name this one was rolled back from.
          readOnly: true
    ListItemRevisionsResponse:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ItemRevision'
        nextPageToken:
          type: string
      additionalProperties: false
    RollbackItemRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    ContributionSuggestions:
      type: object
      description: 'Assistant suggestions (output only). Set by the analysis when the contribution opens (topics whose names occur in the title, file name or note, collection); for a NEW_DOCUMENT, `topics` and `summary` are replaced by the CLASSIFYING step when the candidate is processed (CreateIngestionRun), with `topicsConfidence` and `summaryConfidence` cleared.'
      properties:
        topics:
          type: array
          items:
            type: string
            description: Topic name.
        topicsConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        proposedTopics:
          type: array
          items:
            type: string
            description: PROPOSED topic name.
        proposedTopicsConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        collection:
          type: string
          description: Name of a COLLECTION item; only collections the contributor can read that accept contributions.
        collectionConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        summary:
          type: string
        summaryConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
      additionalProperties: false
    ContributionFlag:
      type: object
      properties:
        kind:
          type: string
          enum:
            - DUPLICATE
            - NEW_REVISION
            - PERSONAL_DATA
            - UNSEARCHABLE_FORMAT
        relatedItem:
          type: string
          description: An Item name; returned only when the caller can see it under the visibility rule.
      additionalProperties: false
    ContributionDecision:
      type: object
      properties:
        reviewer:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`.
        message:
          type: string
        decideTime:
          type: string
          format: date-time
      additionalProperties: false
    ContributionEvent:
      type: object
      properties:
        kind:
          type: string
          enum:
            - SUBMITTED
            - ANALYZED
            - CHANGES_REQUESTED
            - RESUBMITTED
            - APPROVED
            - REJECTED
            - WITHDRAWN
        actor:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`. Empty for system events.
        message:
          type: string
        createTime:
          type: string
          format: date-time
      additionalProperties: false
    Contribution:
      type: object
      description: 'A request to add a document (or a new revision) to a collection. State machine: ANALYZING → IN_REVIEW (system); IN_REVIEW → APPROVED (approve) | CHANGES_REQUESTED (requestChanges) | REJECTED (reject) | WITHDRAWN (withdraw); CHANGES_REQUESTED → ANALYZING (resubmit) | WITHDRAWN (withdraw). APPROVED, REJECTED, WITHDRAWN are terminal. Any other transition → FAILED_PRECONDITION (400).'
      properties:
        name:
          type: string
          description: '`workspaces/{workspace}/contributions/{contribution}`.'
          readOnly: true
        kind:
          type: string
          enum:
            - NEW_DOCUMENT
            - NEW_REVISION
        origin:
          type: string
          enum:
            - MEMBER
            - SOURCE
          readOnly: true
        item:
          type: string
          description: "An Item name `workspaces/{workspace}/items/{item}`. The candidate DOCUMENT: for MEMBER it lives in the contributor's PERSONAL collection (shared for review without copying); for SOURCE it is UNPUBLISHED in the source's target collection. Must be ACTIVE with `contentState: AVAILABLE`. While the contribution is open the candidate cannot be moved, deleted or have its content changed (CONTRIBUTION_OPEN); a SOURCE candidate is source-managed through its contribution and cannot be moved."
        targetCollection:
          type: string
          description: 'Name of a COLLECTION item; any other item → INVALID_ARGUMENT (400). Empty = let the assistant suggest (NEW_DOCUMENT). NEW_REVISION: set by the server to the governing collection of `replacesItem`; a different value → INVALID_ARGUMENT.'
        replacesItem:
          type: string
          description: 'An Item name `workspaces/{workspace}/items/{item}`. NEW_REVISION only: the published DOCUMENT to revise.'
        contributor:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`. Empty for SOURCE origin.
          readOnly: true
        source:
          type: string
          description: Source name `workspaces/{workspace}/sources/{source}`; SOURCE origin only.
          readOnly: true
        externalVersion:
          type: string
          readOnly: true
          description: 'SOURCE NEW_REVISION only: the provider version under review.'
        note:
          type: string
        changeSummary:
          type: string
        suggestions:
          $ref: '#/components/schemas/ContributionSuggestions'
          readOnly: true
        flags:
          type: array
          items:
            $ref: '#/components/schemas/ContributionFlag'
          description: Every caller sees every flag kind; `relatedItem` is returned only when the caller can see that item under the visibility rule (reviewers too).
          readOnly: true
        audienceSummary:
          type: string
          readOnly: true
        state:
          $ref: '#/components/schemas/ContributionState'
        decision:
          $ref: '#/components/schemas/ContributionDecision'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/ContributionEvent'
          description: View FULL only.
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        etag:
          type: string
    ListContributionsResponse:
      type: object
      properties:
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/Contribution'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
      additionalProperties: false
    ApproveContributionRequest:
      type: object
      required:
        - etag
      properties:
        targetCollection:
          type: string
          description: "Name of a COLLECTION item. Defaults to the contribution's `targetCollection`; required when that is empty (NEW_DOCUMENT/MEMBER). NEW_REVISION: must equal the governing collection of `replacesItem`, else INVALID_ARGUMENT."
        topics:
          type: array
          items:
            type: string
            description: Topic name.
        summary:
          type: string
        recordCorrection:
          type: boolean
          description: Record a TopicCorrection when the approved `topics` differ from the assistant's suggested topics ("Use my change to improve classification").
        etag:
          type: string
          description: The contribution etag the reviewer saw; mismatch (e.g. after a resubmit) → ABORTED (409).
      additionalProperties: false
    RequestContributionChangesRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    RejectContributionRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    WithdrawContributionRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    ResubmitContributionRequest:
      type: object
      required:
        - changeSummary
      properties:
        item:
          type: string
          description: An Item name `workspaces/{workspace}/items/{item}`. Optional replacement candidate in the caller's PERSONAL collection; unreadable → PERMISSION_DENIED.
        note:
          type: string
        changeSummary:
          type: string
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    Topic:
      type: object
      description: Taxonomy node. Non-ACTIVE topics (PROPOSED, REJECTED) are visible only to holders of `topics.accept`; others get PERMISSION_DENIED (403) on Get and they are omitted from List.
      properties:
        name:
          type: string
          description: '`workspaces/{workspace}/topics/{topic}`.'
          readOnly: true
        displayName:
          type: string
        description:
          type: string
        kind:
          type: string
          enum:
            - DOMAIN
            - TOPIC
        parentTopic:
          type: string
          description: Parent DOMAIN topic name; TOPIC kind only.
        icon:
          type: string
          pattern: ^([a-z][a-z0-9-]{0,63})?$
          description: An icon name; clients offer one shared icon set (e.g. `book`, `flask`, `landmark`). A TOPIC without one shows its domain's icon. A malformed name → INVALID_ARGUMENT (400) on `icon`; empty clears it.
        color:
          type: string
          pattern: ^(#[0-9A-Fa-f]{6})?$
          description: '`#RRGGBB` (case-insensitive; stored lowercase), set on DOMAINs: their topics show the domain colour. A malformed value → INVALID_ARGUMENT (400) on `color`; empty clears it.'
        keywords:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
          description: Words in a title or text that mean a document belongs here. Classification signal (read by CLASSIFYING); TOPIC kind only.
        synonyms:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
          description: Other names of the topic; they count like keywords. TOPIC kind only.
        guidance:
          type: string
          maxLength: 2000
          description: Free text for the assistant on when to use the topic and what belongs elsewhere. TOPIC kind only.
        examples:
          type: array
          maxItems: 5
          items:
            type: string
            description: DOCUMENT item name; one the caller cannot see → PERMISSION_DENIED (403), another item type → INVALID_ARGUMENT (400).
          description: Documents that clearly belong here; their titles are shown to the assistant. On reads, only the examples the caller can see. TOPIC kind only.
        rules:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TopicRule'
          description: A document a rule matches gets the topics of every matching rule and the assistant is not asked (CLASSIFYING). TOPIC kind only.
        state:
          type: string
          enum:
            - PROPOSED
            - ACTIVE
            - REJECTED
            - DELETED
          readOnly: true
        evidence:
          type: array
          items:
            type: string
            description: Contribution name.
          description: Contributions that proposed it, filtered to the caller.
          readOnly: true
        documentCount:
          type: integer
          format: int32
          description: Documents tagged with it that the caller can see (visibility rule).
          readOnly: true
        inReviewCount:
          type: integer
          format: int32
          description: Open contributions proposing or using it; reviewers only.
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        deleteTime:
          type: string
          format: date-time
          readOnly: true
        purgeTime:
          type: string
          format: date-time
          readOnly: true
        etag:
          type: string
    ListTopicsResponse:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
      additionalProperties: false
    UndeleteTopicRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    AcceptTopicRequest:
      type: object
      properties:
        parentTopic:
          type: string
          description: Parent DOMAIN topic name.
        displayName:
          type: string
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    RejectTopicRequest:
      type: object
      properties:
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    MergeTopicRequest:
      type: object
      required:
        - targetTopic
      properties:
        targetTopic:
          type: string
          description: Topic name to keep.
        etag:
          type: string
          description: Optional; must match the current etag, else ABORTED (409).
      additionalProperties: false
    TopicRule:
      type: object
      description: Exactly one of `collection` or `source`, else INVALID_ARGUMENT (400).
      properties:
        collection:
          type: string
          description: COLLECTION item name; matches documents in its subtree. One the caller cannot see → PERMISSION_DENIED (403), another item type → INVALID_ARGUMENT (400).
        source:
          type: string
          description: Source name `workspaces/{workspace}/sources/{source}` of a live source, else INVALID_ARGUMENT (400); matches documents that source registered.
      additionalProperties: false
    ConfirmTopicAssignmentsRequest:
      type: object
      properties:
        filter:
          type: string
          description: ListItems filter over documents (empty = every document the caller may edit).
      additionalProperties: false
    ConfirmTopicAssignmentsResponse:
      type: object
      properties:
        confirmedCount:
          type: integer
          format: int32
          readOnly: true
      additionalProperties: false
    TopicImportRow:
      type: object
      description: 'One spreadsheet row, named the way people name topics: no codes. `domain` is the domain''s display name; a row without `topic` describes that domain, a row with `topic` is a topic in it. Without `name`, a domain is matched by name among ACTIVE domains (case- and space-insensitive) and created when none matches (also when only its topic rows name it); a topic is matched by name among the ACTIVE topics of that domain and created there when none matches. `name` (the resource name, from an export) matches the topic or domain itself, so the row may rename it or move a topic to another domain. New topics get server-generated IDs. An absent field leaves the value unchanged (empty on a new topic); the kind of an existing topic never changes.'
      required:
        - domain
      properties:
        domain:
          type: string
          maxLength: 255
          description: Display name of the domain.
        topic:
          type: string
          maxLength: 255
          description: Display name of the topic; empty = the row describes the domain.
        name:
          type: string
          description: Optional. The topic resource name `workspaces/{workspace}/topics/{topic}` from an export; the row then updates that topic (or domain) instead of matching by display name. Unknown, archived or of the other kind → the row is skipped.
        description:
          type: string
        keywords:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
        synonyms:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
        guidance:
          type: string
          maxLength: 2000
      additionalProperties: false
    ImportTopicsRequest:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/TopicImportRow'
        mode:
          type: string
          enum:
            - MERGE
            - REPLACE
          default: MERGE
          description: MERGE adds and updates. REPLACE also archives (soft-deletes) ACTIVE topics and domains no row matched; one still in use is kept.
        validateOnly:
          type: boolean
          description: Report what the import would do; change nothing.
      additionalProperties: false
    TopicImportSkippedRow:
      type: object
      properties:
        row:
          type: integer
          format: int32
          description: 1-based position in `rows`.
        reason:
          type: string
      additionalProperties: false
    TopicImportChange:
      type: object
      description: One topic or domain an import creates, updates or archives, named the way the file names it.
      properties:
        topic:
          type: string
          description: Topic resource name. For a create in `validateOnly` it is provisional (the applied import generates the ID).
        kind:
          type: string
          enum:
            - DOMAIN
            - TOPIC
        displayName:
          type: string
          description: The name after the import.
        domain:
          type: string
          description: Display name of its domain after the import (topics only).
        row:
          type: integer
          format: int32
          description: 1-based position in `rows` that caused it; absent for archives and for a domain created only because topic rows name it.
        changes:
          type: array
          items:
            type: string
            enum:
              - RENAMED
              - MOVED
              - DESCRIPTION
              - KEYWORDS
              - SYNONYMS
              - GUIDANCE
          description: What an update changes (updates only).
        previousDisplayName:
          type: string
          description: The name before a rename.
      additionalProperties: false
    ImportTopicsResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/TopicImportChange'
        updated:
          type: array
          items:
            $ref: '#/components/schemas/TopicImportChange'
        archived:
          type: array
          items:
            $ref: '#/components/schemas/TopicImportChange'
        unchangedCount:
          type: integer
          format: int32
          description: Rows that changed nothing, plus topics REPLACE kept because they are in use.
        skippedRows:
          type: array
          items:
            $ref: '#/components/schemas/TopicImportSkippedRow'
      additionalProperties: false
    TestTopicClassificationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 1024
        text:
          type: string
          maxLength: 20000
          description: Sample content, read like a document's leading excerpts.
        collection:
          type: string
          description: COLLECTION item name the sample would be in (for collection rules); unreadable → PERMISSION_DENIED (403).
        source:
          type: string
          description: Source name the sample would come from (for source rules).
        topics:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Topic'
          description: Unsaved changes to existing ACTIVE topics, by `name`; their signal fields replace the stored ones for this test only.
      additionalProperties: false
    TopicClassificationResult:
      type: object
      properties:
        topic:
          type: string
          description: Topic name.
        reason:
          type: string
          enum:
            - RULE
            - ASSISTANT
      additionalProperties: false
    TestTopicClassificationResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TopicClassificationResult'
          description: Ranked; rule hits first, then the topics the assistant picked in its order. Empty = no topic.
        summary:
          type: string
          description: The assistant's one- or two-sentence summary; absent when a rule settled the topics.
      additionalProperties: false
    TopicClassificationRuleSummary:
      type: object
      properties:
        topic:
          type: string
          description: Topic name.
        rule:
          $ref: '#/components/schemas/TopicRule'
      additionalProperties: false
    CompileTopicClassificationPromptResponse:
      type: object
      properties:
        prompt:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TopicClassificationRuleSummary'
        estimatedTokens:
          type: integer
          format: int32
      additionalProperties: false
    TopicCorrection:
      type: object
      description: A person's change of a document's topics away from the assistant's. Created by ApproveContribution with `recordCorrection` when the approved topics differ from the suggested ones, and by UpdateItem `document.topics` when it replaces assistant-applied topics.
      properties:
        name:
          type: string
          description: '`workspaces/{workspace}/topicCorrections/{topicCorrection}`.'
          readOnly: true
        item:
          type: string
          description: The corrected document's Item name; historical (MergeItem does not re-point it). Omitted when the caller cannot see it.
          readOnly: true
        itemDisplayName:
          type: string
          description: The document's title; omitted when the caller cannot see it.
          readOnly: true
        fromTopics:
          type: array
          items:
            type: string
            description: Topic name.
          description: The assistant's topics the person removed.
          readOnly: true
        toTopics:
          type: array
          items:
            type: string
            description: Topic name.
          description: The topics the person chose that the assistant had not.
          readOnly: true
        actor:
          type: string
          description: Member name of the person who changed the topics.
          readOnly: true
        state:
