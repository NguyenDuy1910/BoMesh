          format: int32
    IngestionRun:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Resource name `workspaces/{workspace}/ingestionRuns/{ingestionRun}`.
          readOnly: true
        selector:
          allOf:
            - $ref: '#/components/schemas/IngestionRunSelector'
          description: 'Required on create; omitted for platform callers and `workspaces/-` reads. Snapshot: resolved into tasks at creation. On reads `items[]` echoes only items the caller can see, and `filter` only when the caller can read every item it names.'
        classification:
          allOf:
            - $ref: '#/components/schemas/IngestionRunClassification'
          description: Optional on create; immutable. A retry keeps the retried run's classification. Omitted for platform callers and `workspaces/-` reads.
        readImages:
          type: boolean
          description: 'Optional on create (default false); immutable. Read the text inside every picture of the documents (Office files, HTML, the typed pages of PDFs) with the configured vision model, placed with each picture. Slower, and one model call per distinct picture. Scanned PDF pages are transcribed whatever this says. True without a configured vision model → FAILED_PRECONDITION (400) reason VISION_MODEL_UNAVAILABLE. A retry keeps the retried run''s value.'
        trigger:
          type: string
          enum:
            - MANUAL
            - API
            - SCHEDULE
            - PLATFORM_RETRY
        state:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
          readOnly: true
        counts:
