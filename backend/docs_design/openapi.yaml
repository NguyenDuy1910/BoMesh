# BoMesh API contract (AIP-based). Design: api_design.md; schema: design.dbml.
openapi: 3.1.0
info:
  title: BoMesh API
  version: 1.0.0
  description: "Canonical BoMesh API contract, designed with the Google API Improvement Proposals (AIP-190 and the AIPs it references). Human-readable design: `api_design.md`; Item domain: `item_model.md`. Implementation status: the backend serves this contract; the web and mobile clients still call the removed legacy routes and are being migrated.\n\nResource names (`workspaces/{workspace}/items/{item}`) are the identity of every resource and the value of every reference. JSON uses the proto3 mapping (lowerCamelCase fields, UPPER_SNAKE enums, RFC 3339 times). Standard methods: Get, List, Create, Update (PATCH + updateMask), Delete; everything else is a `:verb` custom method. Errors are google.rpc.Status; authorization is checked before existence (403 PERMISSION_DENIED, AIP-211). `x-permission` names the IAM permission each method requires."
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: Accounts, their preferences and sign-in sessions.
  - name: Workspaces
    description: Workspaces, people, groups, roles, audit and knowledge gaps.
  - name: Library
    description: "A member's personal library: saved and recent items, saved searches, notifications and Home."
  - name: Knowledge
    description: Items (collections and documents), contributions, topics and reading lists.
  - name: Ingestion
    description: Connectors, connections, sources, syncs, ingestion runs and policy.
  - name: Assistant
    description: Conversations, shares and assistant-made artifacts.
  - name: Collaboration
    description: Spaces (members, materials, announcements, events, request types) and requests with messages; gated by workspace modules.
  - name: Operations
    description: Long-running operations, platform health (components, incidents) and platform audit events.
paths:
  /api/v1/sessions:
    post:
      tags:
        - Identity
      operationId: CreateSession
      summary: Sign in.
      description: "Public. Exchanges a credential (password or Google ID token) for a Session whose `accessToken` is returned only in this response. Not idempotent by `requestId`: tokens are never stored, so every call creates a new session. A sign-in records one platform `SIGN_IN` audit event plus one in each workspace where the user is an active member.\nWrong credentials → 401 UNAUTHENTICATED reason INVALID_CREDENTIALS (same answer whether or not the account exists); suspended account → 400 FAILED_PRECONDITION reason USER_SUSPENDED; malformed body → 400 INVALID_ARGUMENT; throttled → 429 (target contract; rate limiting is not implemented yet).\n"
      security: []
      x-permission: none
      x-authorization: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Session'
      responses:
        '200':
          description: The new session including its accessToken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Identity
      operationId: ListSessions
      summary: List the caller's sessions.
      description: Own sessions only. Filter `state`, `authenticationMethod`; orderBy `createTime`, `lastSeenTime`. `accessToken` is never returned.
      x-permission: none
      x-authorization: own sessions
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/sessions/{session}:
    get:
      tags:
        - Identity
      operationId: GetSession
      summary: Get one of the caller's sessions.
      description: Own sessions only (`sessions/current` = the session of the presented token). Another user's session → 403.
      x-permission: none
      x-authorization: own
      parameters:
        - $ref: '#/components/parameters/PathSession'
      responses:
        '200':
          description: The session (without accessToken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Identity
      operationId: DeleteSession
      summary: Sign out a session.
      description: Ends the session (ACTIVE → ENDED) and revokes its token; `sessions/current` signs out the caller. Returns the ended session (sessions end softly and stay readable). Already ENDED → 400 FAILED_PRECONDITION. Another user's session → 403.
      x-permission: none
      x-authorization: own
      parameters:
        - $ref: '#/components/parameters/PathSession'
      responses:
        '200':
          description: The ended session (state ENDED, without accessToken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users:
    post:
      tags:
        - Identity
      operationId: CreateUser
      summary: Sign up a new account.
      description: "Public sign-up. The server assigns the user ID and returns the User in state ACTIVE.\n`validateOnly=true` only checks the email (and username) and creates nothing.\nInvalid email or password → 400 INVALID_ARGUMENT; email or username already used → 409 ALREADY_EXISTS (reason EMAIL_ALREADY_USED / USERNAME_ALREADY_USED); sign-up throttling → 429 (target contract; rate limiting is not implemented yet).\n"
      security: []
      x-permission: none
      x-authorization: public
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ValidateOnly'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: The created (or, with validateOnly, validated) user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Identity
      operationId: ListUsers
      summary: List accounts (platform).
      description: "Lists every account. Filter fields `state`, `platformRole`, `email`; orderBy `createTime`, `lastActiveTime`, `displayName`.\nBad filter → 400 INVALID_ARGUMENT; missing `users.list` → 403.\n"
      x-permission: users.list
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/users/{user}:
    get:
      tags:
        - Identity
      operationId: GetUser
      summary: Get an account.
      description: "Returns the user. Allowed for the caller's own account (`users/me`) or with `users.get` (platform). Otherwise 403 whether or not the user exists; 404 only for callers holding `users.get`.\n"
      x-permission: users.get
      x-authorization: self, or users.get (platform)
      parameters:
        - $ref: '#/components/parameters/PathUser'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Identity
      operationId: UpdateUser
      summary: Update an account.
      description: "Self may update `displayName` and `username`. `platformRole` needs `users.update` (platform); changing one's own `platformRole` → 400 FAILED_PRECONDITION reason SELF_MODIFICATION.\nMasked fields that are output-only (`email`, `state`, times) → 400 INVALID_ARGUMENT; username taken → 409 ALREADY_EXISTS.\n"
      x-permission: users.update
      x-authorization: self for displayName and username; users.update (platform) for platformRole, never on self
      parameters:
        - $ref: '#/components/parameters/PathUser'
        - $ref: '#/components/parameters/UpdateMask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{user}/preferences:
    get:
      tags:
        - Identity
      operationId: GetUserPreferences
      summary: Get the caller's preferences.
      description: Singleton; self only (`users/me/preferences`). Other users → 403.
      x-permission: none
      x-authorization: self
      parameters:
        - $ref: '#/components/parameters/PathUser'
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Identity
      operationId: UpdateUserPreferences
      summary: Update the caller's preferences.
      description: "Self only. Invalid languageCode, enum or `lastWorkspace` not a workspace the caller belongs to → 400 INVALID_ARGUMENT.\n"
      x-permission: none
      x-authorization: self
      parameters:
        - $ref: '#/components/parameters/PathUser'
        - $ref: '#/components/parameters/UpdateMask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: The updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user}:activate:
    post:
      tags:
        - Identity
      operationId: ActivateUser
      summary: Reactivate a suspended account.
      description: "SUSPENDED → ACTIVE. Already ACTIVE → 400 FAILED_PRECONDITION. On self → 400 FAILED_PRECONDITION reason SELF_MODIFICATION.\n"
      x-permission: users.activate
      parameters:
        - $ref: '#/components/parameters/PathUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateUserRequest'
      responses:
        '200':
          description: The activated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user}:suspend:
    post:
      tags:
        - Identity
      operationId: SuspendUser
      summary: Suspend an account.
      description: "ACTIVE → SUSPENDED; ends every session of the account. Already SUSPENDED → 400 FAILED_PRECONDITION. On self → 400 FAILED_PRECONDITION reason SELF_MODIFICATION.\n"
      x-permission: users.suspend
      parameters:
        - $ref: '#/components/parameters/PathUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
      responses:
        '200':
          description: The suspended user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users:lookup:
    get:
      tags:
        - Identity
      operationId: LookupUser
      summary: Find an account by exact email.
      description: "Exact, case-insensitive email match only; returns `name`, `email`, `displayName`, `state`. Caller needs `members.create` in some workspace (adding people).\nMissing email → 400 INVALID_ARGUMENT; no match → 404.\n"
      x-permission: members.create
      parameters:
        - $ref: '#/components/parameters/UserLookupEmail'
      responses:
        '200':
          description: The matching user (restricted fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users:resetPassword:
    post:
      tags:
        - Identity
      operationId: ResetPassword
      summary: Set a new password with a reset token.
      description: "Public. Consumes `resetToken`, sets `newPassword` and ends every session of the account.\nInvalid, used or expired token → 400 FAILED_PRECONDITION reason RESET_TOKEN_INVALID; weak password → 400 INVALID_ARGUMENT; throttled → 429.\n"
      security: []
      x-permission: none
      x-authorization: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/users:sendPasswordReset:
    post:
      tags:
        - Identity
      operationId: SendPasswordReset
      summary: Email a password-reset link.
      description: "Public. Always returns Empty, whether or not the email belongs to an account (no account enumeration). Malformed email → 400; throttled → 429 (target contract; rate limiting is not implemented yet).\n"
      security: []
      x-permission: none
      x-authorization: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPasswordResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/permissions:
    get:
      tags:
        - Workspaces
      operationId: ListPermissions
      summary: List permissions.
      description: The permission catalog.
      x-authorization: Granted to every authenticated user.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPermissionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      x-permission: permissions.list
  /api/v1/permissions/{permission}:
    get:
      tags:
        - Workspaces
      operationId: GetPermission
      summary: Get a permission.
      description: Get a permission.
      x-authorization: Granted to every authenticated user.
      parameters:
        - $ref: '#/components/parameters/PathPermission'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      x-permission: permissions.get
  /api/v1/roles:
    get:
      tags:
        - Workspaces
      operationId: ListPredefinedRoles
      summary: List predefined roles.
      description: 'Platform-defined roles: `roles/workspaceAdmin`, `roles/workspaceMember`, `roles/collectionOwner`, `roles/collectionEditor`, `roles/collectionViewer` (granted on COLLECTION items), `roles/spaceLead`, `roles/spaceStaff`, `roles/spaceMember`, `roles/platformAdmin`, `roles/platformOperator`. Item permissions: collectionViewer holds `items.get`, `items.list`, `items.search`, `items.testIamPermissions`, `itemLinks.get`, `itemLinks.list`; collectionEditor adds `items.create`, `items.update`, `items.move`, `items.publish`, `items.verify`, `itemLinks.create`, `itemLinks.delete`; collectionOwner adds `items.delete`, `items.undelete`, `items.getIamPolicy`, `items.setIamPolicy`, `contributions.review`. `roles/workspaceAdmin` holds every `items.*` and `itemLinks.*` permission tenant-wide. `items.list`, `items.search` and `items.testIamPermissions` are also held by every workspace member; `items.create` on the workspace (root collections) is held by `roles/workspaceAdmin`.'
      x-authorization: Granted to every authenticated user.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      x-permission: roles.list
  /api/v1/roles/{role}:
    get:
      tags:
        - Workspaces
      operationId: GetPredefinedRole
      summary: Get a predefined role.
      description: Returns a predefined role and its `includedPermissions` (e.g. `roles/collectionEditor`).
      x-authorization: Granted to every authenticated user.
      parameters:
        - $ref: '#/components/parameters/PathPredefinedRole'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      x-permission: roles.get
  /api/v1/workspaces:
    post:
      tags:
        - Workspaces
      operationId: CreateWorkspace
      summary: Create a workspace.
      description: Starts provisioning; returns an Operation (metadata `CreateWorkspaceMetadata`, response `@type` `Workspace`). The workspace is `CREATING` until done, then `ACTIVE`; provisioning currently completes within the request, so the Operation is usually already `done` (clients must still handle the not-done case). `initialAdminEmail` (required on create) becomes `roles/workspaceAdmin`. Duplicate `code` → ALREADY_EXISTS (409, reason WORKSPACE_CODE_TAKEN); invalid fields → INVALID_ARGUMENT (400).
      x-permission: workspaces.create
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workspace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
      x-operation-info:
        response:
          $ref: '#/components/schemas/Workspace'
        metadata:
          $ref: '#/components/schemas/CreateWorkspaceMetadata'
    get:
      tags:
        - Workspaces
      operationId: ListWorkspaces
      summary: List workspaces.
      description: Lists workspaces the caller is a member of; callers with `workspaces.list` (platform) see all. Filter on `state`, `template`, `code`.
      x-authorization: Members see their own workspaces without the permission; platform callers with workspaces.list see all.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspacesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      x-permission: workspaces.list
  /api/v1/workspaces/{workspace}:
    get:
      tags:
        - Workspaces
      operationId: GetWorkspace
      summary: Get a workspace.
      description: Members and platform (`workspaces.get`) may read.
      x-authorization: Granted to every member (roles/workspaceMember) and platform roles.
      parameters:
        - $ref: '#/components/parameters/Workspace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: workspaces.get
    patch:
      tags:
        - Workspaces
      operationId: UpdateWorkspace
      summary: Update a workspace.
      description: 'Updatable: `displayName`, `code`. Taken `code` → ALREADY_EXISTS (409); stale `etag` → ABORTED (409).'
      x-permission: workspaces.update
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/UpdateMask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workspace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/workspaces/{workspace}/assistant:
    get:
      tags:
        - Workspaces
      operationId: GetWorkspaceAssistant
      summary: Get the assistant configuration.
      description: Readable by every member.
      x-authorization: Granted to every member.
      parameters:
        - $ref: '#/components/parameters/Workspace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAssistant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: workspaces.getAssistant
    patch:
      tags:
        - Workspaces
      operationId: UpdateWorkspaceAssistant
      summary: Update the assistant configuration.
      description: '`instructions` > 2000 chars or > 3 starter prompts per role → INVALID_ARGUMENT (400); stale `etag` → ABORTED (409).'
      x-permission: workspaces.updateAssistant
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/UpdateMask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceAssistant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAssistant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
