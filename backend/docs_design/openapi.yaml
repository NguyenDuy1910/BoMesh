        error:
          allOf:
            - $ref: '#/components/schemas/Status'
          readOnly: true
          description: Omitted for platform callers and `workspaces/-` reads.
        retryOf:
          type: string
          description: Resource name `workspaces/{workspace}/ingestionRuns/{ingestionRun}`.
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        startTime:
          type: string
          format: date-time
          readOnly: true
        endTime:
          type: string
          format: date-time
          readOnly: true
