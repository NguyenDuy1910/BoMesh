    post:
      tags:
        - Workspaces
      operationId: CreateMember
      summary: Add a member.
      description: Adds `user` and grants `roles` in the same call. Granting roles beyond the caller's own → PERMISSION_DENIED (403, reason ROLE_ESCALATION); already a member → ALREADY_EXISTS (409).
      x-permission: members.create
