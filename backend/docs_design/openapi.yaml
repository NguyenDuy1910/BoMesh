  /api/v1/workspaces/{workspace}/conversations/{conversation}:converse:
    post:
      tags:
        - Assistant
      operationId: ConverseConversation
      summary: Send a turn and stream the assistant reply.
      description: "Appends the user `message` (with optional `attachments`, DOCUMENT item names) to the server-held history and streams the assistant reply as Server-Sent Events following OpenResponses. Events (SSE `event:` names, JSON `data:`):\n- `response.created` — the reply started; data carries the assistant message name.\n- `response.output_item.added` — a new output item (text, citation, artifact reference) began.\n- `response.output_text.delta` — incremental text (`delta`).\n- `response.completed` — the reply finished; the message is stored with state COMPLETED.\n- `response.failed` — generation failed; the message is stored with state FAILED and data carries a `Status`.\nA client disconnect stores the partial message as INTERRUPTED. `replaceFromMessage` (a message resource name) discards that message and later ones before answering (regenerate/edit). A deleted conversation is 400 FAILED_PRECONDITION with reason CONVERSATION_DELETED; an unknown `replaceFromMessage` is 400 INVALID_ARGUMENT. `attachments` the caller cannot read are 403 PERMISSION_DENIED. To attach a new file, the client first uploads it with CreateItem (DOCUMENT, `document.purpose: CONVERSATION_ATTACHMENT`) into the caller's PERSONAL collection, then passes the item name. An attachment that is not a DOCUMENT item is 400 INVALID_ARGUMENT. Citations in the reply reference items and passages (`workspaces/{workspace}/items/{item}/passages/{passage}`). Every attachment must be readable by the caller, else 403 PERMISSION_DENIED. \"Readable\" means the Item visibility rule: the item is ACTIVE, every ancestor is ACTIVE, the caller holds `items.get` on its governing collection, and it is PUBLISHED or the caller holds `items.update` there. The contribution-reviewer exception does not apply: a reviewer cannot use a candidate draft they may only review."
      x-permission: conversations.converse
      x-authorization: owner (conversations are owner-private)
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/PathConversation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConverseRequest'
      responses:
        '200':
          description: SSE stream of OpenResponses events.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream (OpenResponses event names).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
