  /api/v1/workspaces/{workspace}/contributions/{contribution}:withdraw:
    post:
      tags:
        - Knowledge
      operationId: WithdrawContribution
      summary: Withdraw a contribution.
      description: 'IN_REVIEW or CHANGES_REQUESTED → WITHDRAWN; the candidate item is not changed. SOURCE origin → FAILED_PRECONDITION. Stale etag → ABORTED (409). State machine: ANALYZING → IN_REVIEW (system); IN_REVIEW → APPROVED (approve) | CHANGES_REQUESTED (requestChanges) | REJECTED (reject) | WITHDRAWN (withdraw); CHANGES_REQUESTED → ANALYZING (resubmit) | WITHDRAWN (withdraw). APPROVED, REJECTED, WITHDRAWN are terminal. Any other transition → FAILED_PRECONDITION (400).'
      x-permission: contributions.withdraw
      x-authorization: contributor (MEMBER origin)
      parameters:
        - $ref: '#/components/parameters/Workspace'
        - $ref: '#/components/parameters/PathContribution'
