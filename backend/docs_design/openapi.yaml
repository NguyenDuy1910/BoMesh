    Workspace:
      type: object
      description: "A tenant workspace. State rules for every method inside a workspace: `CREATING` → 400 FAILED_PRECONDITION reason `WORKSPACE_CREATING`; `SUSPENDED` → reason `WORKSPACE_SUSPENDED`; `ARCHIVED` is read-only (writes → reason `WORKSPACE_ARCHIVED`). Get, Suspend, Activate and Archive of the workspace itself are exempt."
      required:
        - displayName
        - code
      properties:
        name:
          type: string
          description: Resource name `workspaces/{workspace}` (system ID).
          readOnly: true
        uid:
          type: string
          description: System-assigned unique ID.
          readOnly: true
        displayName:
          type: string
          description: Display name.
        code:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$
          description: Unique web address; mutable.
        template:
          type: string
          enum:
            - ENTERPRISE
            - CAMPUS
          description: Workspace template; set on create.
        demo:
          type: boolean
          description: Whether this is a demo workspace; set on create.
        state:
          type: string
          enum:
            - CREATING
            - ACTIVE
            - SUSPENDED
            - ARCHIVED
          description: Lifecycle state.
          readOnly: true
        ingestionState:
          type: string
          enum:
            - ACTIVE
            - PAUSED
          description: Whether ingestion runs.
          readOnly: true
        memberCount:
          type: integer
          format: int32
          readOnly: true
          description: Active members.
        etag:
          type: string
          description: Concurrency token (AIP-154).
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: Creation time.
        updateTime:
          type: string
          format: date-time
          readOnly: true
          description: Last update time.
        initialAdminEmail:
          type: string
          format: email
          writeOnly: true
          description: 'Input only, on create: email of the user granted `roles/workspaceAdmin`.'
    ListWorkspacesResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        nextPageToken:
          type: string
          description: Token for the next page; empty when there are no more results.
        totalSize:
          type: integer
          format: int32
          description: Approximate total number of results.
      additionalProperties: false
