        verification:
          $ref: '#/components/schemas/ItemVerification'
          readOnly: true
        origin:
          $ref: '#/components/schemas/ItemOrigin'
          readOnly: true
        mergedInto:
          type: string
          readOnly: true
          description: 'Set by MergeItem on the deleted duplicate: the Item name it was merged into. Reading-list, saved and recent references to this item resolve to it at read time. Cleared by UndeleteItem.'
        qualityIssues:
          type: array
          items:
            $ref: '#/components/schemas/ItemQualityIssue'
          description: Editors only (`items.update`); empty for readers.
          readOnly: true
        thumbnailUri:
          type: string
          readOnly: true
          description: Derived preview of the current revision; reset when approval or rollback changes the current revision.
        uploadUri:
          type: string
          description: 'Signed upload URL; only while `contentState: PENDING`, creator only.'
          readOnly: true
      additionalProperties: false
    Item:
      type: object
      description: "One node of the workspace knowledge tree: a COLLECTION (holds items, carries access policies) or a DOCUMENT (holds content). Exactly one facet, matching `itemType`. Visibility rule: a caller sees a document iff it is ACTIVE, every ancestor is ACTIVE, the caller holds `items.get` on its governing collection (nearest COLLECTION ancestor; access inherits downward until a collection with `inheritAccess=false`; roots are always boundaries), and it is PUBLISHED or the caller holds `items.update` there. Throughout the API, \"visible\"/\"readable\" means this rule: List, Search, counts, reading lists, saved and recent items, artifacts, attachments, move, merge and every reference. Reviewer exception — applies ONLY to GetItem, GetItemContent and `alt=media`: holders of `contributions.review` for an open contribution may read that contribution's candidate item through those three calls; nowhere else. Deleted items: only holders of `items.undelete` (resolved through the deleted cohort's ancestors; the published rule still applies) see DELETED items, via `showDeleted` or Get. LOCKED projection: a discoverable root collection the caller cannot read is returned with only name, displayName, `collection.description`, `collection.ownerSummary` and `access: LOCKED`; it never carries counts. Item links (`…/items/{item}/links`) are reference shortcuts, not hierarchy."
      properties:
        name:
          type: string
          description: An Item name `workspaces/{workspace}/items/{item}`.
          readOnly: true
        itemType:
          $ref: '#/components/schemas/ItemType'
          description: Required on create; immutable.
        displayName:
          type: string
          description: Required; at most 512 characters.
          maxLength: 512
        parentItem:
          type: string
          description: Item name of a COLLECTION (or, server-written only, a DOCUMENT); empty = root. Required for DOCUMENT. Set on create, immutable afterwards — use MoveItem. Item links never change it.
        parentRelation:
          type: string
          enum:
            - CONTAINS
            - CHILD
            - ATTACHMENT
          description: CONTAINS under a collection; CHILD or ATTACHMENT under a document (written only by source sync).
          readOnly: true
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/ItemAncestor'
          description: 'View FULL only. Root first. Truncation: only collections the caller can read, plus discoverable roots as LOCKED. Item links are not ancestors.'
          readOnly: true
        access:
          $ref: '#/components/schemas/ItemAccess'
        state:
          $ref: '#/components/schemas/ItemState'
        creator:
          type: string
          description: Member name `workspaces/{workspace}/members/{member}`.
          readOnly: true
        createTime:
          type: string
          format: date-time
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        deleteTime:
          type: string
          format: date-time
          readOnly: true
        purgeTime:
          type: string
          format: date-time
          readOnly: true
        etag:
          type: string
        collection:
          $ref: '#/components/schemas/CollectionFacet'
        document:
          $ref: '#/components/schemas/DocumentFacet'
      allOf:
        - if:
            required:
              - itemType
            properties:
              itemType:
                const: COLLECTION
          then:
            properties:
              document: false
        - if:
            required:
              - itemType
            properties:
              itemType:
                const: DOCUMENT
          then:
            properties:
              collection: false
    ListItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
      additionalProperties: false
    CreateItemMediaRequest:
      type: object
      required:
        - metadata
        - file
      properties:
        metadata:
