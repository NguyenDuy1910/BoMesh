          description: workspaces/{workspace}/spaces/{space}/requestTypes/{requestType}; ID chosen via `requestTypeId` or server-assigned.
          readOnly: true
        displayName:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/RequestTypeField'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RequestTypeRule'
        slaDuration:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?s$
          description: Target time to resolve; sets Request.dueTime.
        state:
          type: string
          readOnly: true
          enum:
            - ACTIVE
            - DELETED
          description: ACTIVE types accept new requests; DELETED types are soft-deleted (existing requests keep their reference).
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: Creation time.
        updateTime:
          type: string
          format: date-time
          readOnly: true
          description: Last update time.
        etag:
          type: string
          description: Concurrency token (AIP-154); a stale value on Update, Delete or a transition → 409 ABORTED.
        deleteTime:
          type: string
          format: date-time
          readOnly: true
          description: Set when soft-deleted.
        purgeTime:
          type: string
          format: date-time
          readOnly: true
          description: When a deleted request type is purged.
      additionalProperties: false
    ListRequestTypesResponse:
      type: object
      additionalProperties: false
      properties:
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
        requestTypes:
          type: array
          items:
            $ref: '#/components/schemas/RequestType'
    RequestAssistantContext:
      type: object
      additionalProperties: false
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
    RequestEligibilityResult:
      type: object
      additionalProperties: false
      properties:
        condition:
          type: string
        severity:
          type: string
          enum:
            - BLOCK
            - WARN
        message:
          type: string
        policyCitation:
          type: string
    RequestEligibility:
      type: object
      additionalProperties: false
      readOnly: true
      properties:
        outcome:
          type: string
          enum:
            - PASS
            - WARN
            - BLOCK
        results:
          type: array
          items:
            $ref: '#/components/schemas/RequestEligibilityResult'
          description: Triggered rules.
    Request:
      type: object
      required:
        - kind
      properties:
        name:
          type: string
          readOnly: true
          description: workspaces/{workspace}/requests/{request}
        uid:
          type: string
          readOnly: true
          description: System-assigned unique ID.
        kind:
          type: string
          enum:
            - SERVICE
            - QUESTION
            - COLLECTION_ACCESS
            - SPACE_MEMBERSHIP
            - CONNECTOR
        requestType:
          type: string
          description: 'SERVICE only: workspaces/{workspace}/spaces/{space}/requestTypes/{requestType}'
        space:
          type: string
          description: 'SERVICE, QUESTION, SPACE_MEMBERSHIP: workspaces/{workspace}/spaces/{space}'
        collection:
          type: string
          description: 'COLLECTION_ACCESS only: name of a COLLECTION item (workspaces/{workspace}/items/{item}) the requester asks to access; the decision resource. Any other item → 400 INVALID_ARGUMENT; a collection the caller cannot discover → 403 PERMISSION_DENIED.'
        target:
          type: string
          description: 'CONNECTOR only: connectors/{connector} being requested; the decision resource.'
        requestedRole:
          type: string
          description: 'COLLECTION_ACCESS: `roles/collectionViewer` or `roles/collectionEditor`; SPACE_MEMBERSHIP: `roles/spaceMember` only; other kinds: must be empty. Any other value → 400 INVALID_ARGUMENT.'
        title:
          type: string
        fields:
          type: object
          additionalProperties: true
          description: google.protobuf.Struct of values keyed by RequestTypeField.key.
        question:
          type: string
        sourceMessage:
          type: string
          writeOnly: true
          description: 'Input only: workspaces/{workspace}/conversations/{conversation}/messages/{message} owned by the caller; the server copies its answer and citations into `assistantContext`. A message the caller does not own or cannot read → 403 PERMISSION_DENIED.'
        assistantContext:
          allOf:
            - $ref: '#/components/schemas/RequestAssistantContext'
          readOnly: true
          description: 'Output only: assistant answer and citations taken from `sourceMessage`, rendered per reader (citations the reader cannot open have `available: false`).'
        requester:
          type: string
          readOnly: true
          description: workspaces/{workspace}/members/{member} — the caller who filed the request.
        assignee:
          type: string
          description: workspaces/{workspace}/members/{member} — the decider handling the request.
        state:
          type: string
          readOnly: true
          description: Lifecycle state.
          enum:
            - OPEN
            - NEEDS_INFO
            - APPROVED
            - DENIED
            - ANSWERED
            - WITHDRAWN
            - CLOSED
        dueTime:
          type: string
          format: date-time
          readOnly: true
          description: createTime + requestType.slaDuration.
        overdue:
          type: boolean
          readOnly: true
        eligibility:
          allOf:
            - $ref: '#/components/schemas/RequestEligibility'
          readOnly: true
        faqItem:
          type: string
          readOnly: true
          description: Item name (workspaces/{workspace}/items/{item}) of the DOCUMENT published by `:answer` with `publishToCollection`.
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: Creation time.
        updateTime:
          type: string
          format: date-time
          readOnly: true
          description: Last update time.
        closeTime:
          type: string
          format: date-time
          readOnly: true
          description: First time the request reached APPROVED, DENIED, ANSWERED, WITHDRAWN or CLOSED.
        etag:
          type: string
          description: Concurrency token (AIP-154); a stale value on Update, Delete or a transition → 409 ABORTED.
      additionalProperties: false
    ListRequestsResponse:
      type: object
      additionalProperties: false
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/Request'
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
    ApproveRequestRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          description: Shown to the requester; recorded as a RequestMessage.
        role:
          type: string
          description: Optional role to grant instead of `requestedRole` (COLLECTION_ACCESS / SPACE_MEMBERSHIP only); must be equal to or lower than `requestedRole` and within the kind's allowed roles (else 400 INVALID_ARGUMENT).
        etag:
          type: string
          description: Optional current Request etag; a mismatch → 409 ABORTED.
    DenyRequestRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          description: Shown to the requester; recorded as a RequestMessage.
        etag:
          type: string
          description: Optional current Request etag; a mismatch → 409 ABORTED.
    AnswerRequestRequest:
      type: object
      additionalProperties: false
      required:
        - answer
      properties:
        answer:
          type: string
        publishToCollection:
          type: string
          description: 'Optional name of a COLLECTION item (workspaces/{workspace}/items/{item}): publishes the answer there as a new DOCUMENT item (as CreateItem), set in `faqItem`, and resolves matching knowledge gaps. Other item types → 400 INVALID_ARGUMENT.'
        etag:
          type: string
          description: Optional current Request etag; a mismatch → 409 ABORTED.
    WithdrawRequestRequest:
      type: object
      additionalProperties: false
      properties:
        etag:
          type: string
          description: Optional current Request etag; a mismatch → 409 ABORTED.
    CloseRequestRequest:
      type: object
      additionalProperties: false
      properties:
        etag:
          type: string
          description: Optional current Request etag; a mismatch → 409 ABORTED.
    RequestMessage:
      type: object
      required:
        - text
      properties:
        name:
          type: string
          readOnly: true
          description: workspaces/{workspace}/requests/{request}/messages/{message}
        author:
          type: string
          readOnly: true
          description: workspaces/{workspace}/members/{member}
        text:
          type: string
        internal:
          type: boolean
          description: Staff-only note hidden from the requester; setting it requires `requests.get` on the request's decision resource (else 403 PERMISSION_DENIED).
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: Post time.
      additionalProperties: false
    ListRequestMessagesResponse:
      type: object
      additionalProperties: false
      properties:
        nextPageToken:
          type: string
        totalSize:
          type: integer
          format: int32
        messages:
          type: array
          items:
            $ref: '#/components/schemas/RequestMessage'
    UndeleteRequestTypeRequest:
      type: object
      additionalProperties: false
      properties:
        etag:
          type: string
    SendBackRequestRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          description: Shown to the requester; recorded as a RequestMessage.
        etag:
          type: string
          description: Optional current Request etag; a mismatch → 409 ABORTED.
      required:
        - message
